<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>퇴근까지 5분 - High-Detail Office Escape</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0f172a; color: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
#wrap {
  width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); padding: 10px;
}
#gameShell {
  position: relative; width: min(1120px, 100%); height: min(720px, 100%);
  aspect-ratio: 1120 / 720; background: #1e293b; border: 2px solid #334155;
  border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  display: flex; flex-direction: column; overflow: hidden;
}
#gameShell.danger-mode {
  border-color: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
  animation: flashBorder 1s infinite alternate;
}
@keyframes flashBorder {
  0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
  100% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.6); }
}
#topbar {
  height: 60px; min-height: 60px; background: #0f172a; border-bottom: 2px solid #334155;
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; z-index: 5;
}
#round {
  font-size: 13px; font-weight: 800; color: #38bdf8; background: #1e293b;
  padding: 6px 12px; border-radius: 6px; border: 1px solid #334155; white-space: nowrap;
}
#objective {
  flex: 1; display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none;
}
#objective::-webkit-scrollbar { display: none; }
.task {
  font-size: 12px; font-weight: 600; white-space: nowrap; padding: 6px 12px;
  border: 1px solid #334155; border-radius: 20px; background: #1e293b; color: #94a3b8;
  display: flex; align-items: center; gap: 5px;
}
.task.done {
  color: #4ade80; border-color: #166534; background: rgba(22, 101, 52, 0.2); text-decoration: line-through;
}
#timer {
  font-size: 20px; font-weight: 900; font-family: monospace; color: #facc15;
  background: #1e293b; padding: 4px 12px; border-radius: 6px; border: 1px solid #334155;
  min-width: 80px; text-align: center;
}
#timer.danger { color: #f87171; border-color: #991b1b; animation: pulse 0.6s infinite alternate; }
@keyframes pulse { to { transform: scale(1.05); } }

#canvasContainer { flex: 1; position: relative; width: 100%; height: calc(100% - 60px); background: #090d16; }
#game { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

#inventoryUI {
  position: absolute; bottom: 16px; left: 16px; z-index: 6; display: flex; gap: 6px;
  background: rgba(15, 23, 42, 0.85); padding: 8px; border-radius: 8px; border: 1px solid #334155;
}
.inv-slot {
  width: 40px; height: 40px; background: rgba(15, 23, 42, 0.95); border: 1px solid #475569;
  border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px;
}
#skillUI {
  position: absolute; bottom: 16px; right: 16px; z-index: 6; display: flex; gap: 8px;
}
.skill-btn {
  background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; color: #38bdf8;
  padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; transition: all 0.2s; outline: none;
}
.skill-btn:disabled { border-color: #475569; color: #475569; opacity: 0.6; cursor: not-allowed; }

#message {
  position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 6;
  background: rgba(15, 23, 42, 0.95); border: 1px solid #38bdf8; color: #f8fafc;
  border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease; white-space: nowrap;
}
#message.show { opacity: 1; transform: translateX(-50%) translateY(-5px); }

#alarmOverlay {
  position: absolute; inset: 0; background: rgba(239, 68, 68, 0.2);
  pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.2s ease;
}
#alarmOverlay.active { opacity: 1; }

#startScreen, #endScreen {
  position: absolute; inset: 0; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px;
}
.card {
  width: min(520px, 100%); background: #1e293b; border: 1px solid #334155; border-radius: 12px;
  padding: 28px 24px; text-align: center; box-shadow: 0 16px 32px rgba(0,0,0,0.4);

h1 { font-size: 30px; font-weight: 800; color: #f8fafc; margin-bottom: 6px; }
.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
.card p { line-height: 1.6; color: #cbd5e1; font-size: 13px; margin-bottom: 18px; }
button.btn-primary {
  border: none; border-radius: 6px; background: #166534; color: #ffffff; font-weight: 700;
  font-size: 15px; padding: 12px 32px; cursor: pointer; transition: background 0.2s ease; outline: none;
}
button.btn-primary:hover { background: #15803d; }
.small { font-size: 11px; color: #94a3b8; margin-top: 16px; line-height: 1.5; background: #0f172a; padding: 8px; border-radius: 6px; text-align: left; }

#rankBadge {

#mobileControls { display: none; position: absolute; bottom: 70px; left: 12px; right: 12px; z-index: 7; justify-content: space-between; align-items: flex-end; pointer-events: none; }
.pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 4px; pointer-events: auto; }
.ctrl { border: 1px solid #475569; background: rgba(30, 41, 59, 0.85); color: #f8fafc; border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none; outline: none; }
.up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; } .down { grid-column: 2; grid-row: 2; } .right { grid-column: 3; grid-row: 2; }
.action { width: 80px; height: 80px; border-radius: 50%; background: rgba(22, 101, 52, 0.85); border: 2px solid #4ade80; font-size: 12px; line-height: 1.2; pointer-events: auto; }

@media (max-width: 768px), (pointer: coarse) {

  #wrap { padding: 0; }
  #gameShell { border-radius: 0; border: none; height: 100vh; width: 100vw; }

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  
  if (type === 'warn') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'item') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'win') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(554.37, now + 0.15);
    osc.frequency.setValueAtTime(659.25, now + 0.3);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
    osc.start(now); osc.stop(now + 0.5);
  } else if (type === 'dash') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'heart') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'donut') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(350, now);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'jammer') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.setValueAtTime(300, now + 0.1);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'hide') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  }
}

function resetRound(keepPosition = false) {
  const data = roundData[round];

function formatTime(s) {
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}

    d.className = "task" + (state[i] ? " done" : "");
    d.textContent = (state[i] ? "✓ " : "• ") + t;
    obj.appendChild(d);
  });
}

function updateInventoryUI() {
  for(let i=0; i<3; i++) {
    const slot = document.getElementById("slot" + i);
    slot.textContent = inventory[i] || "";
  }
}

function showMessage(t) {
  const m = document.getElementById("message");
  m.textContent = t;
  m.classList.add("show");
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => m.classList.remove("show"), 2200);
}

function solidAt(x, y, w, h) {
  const l = Math.floor(x / TILE), r = Math.floor((x + w - 1) / TILE);
  const t = Math.floor(y / TILE), b = Math.floor((y + h - 1) / TILE);
  for(let yy = t; yy <= b; yy++) {
    for(let xx = l; xx <= r; xx++) {
      if(yy < 0 || yy >= ROWS || xx < 0 || xx >= COLS || maps[round][yy][xx] === "#") return true;
    }
  }
  return false;
}

function triggerCaught(msg) {
  if (caughtCooldown > 0 || isHiding) return;
  playSound('warn');
  showMessage(msg);
  
  caughtCount++;
  startTime -= 8000;
  
  const overlay = document.getElementById("alarmOverlay");
  overlay.classList.add("active");
  setTimeout(() => overlay.classList.remove("active"), 400);

  isStunned = true;
  stunTimer = 1.0;
  caughtCooldown = 2.5;
}

function useDonut() {
  if (donutCooldown > 0 || !running || isStunned || isHiding) return;
  playSound('donut');
  activeDonut = { x: player.x + player.w/2, y: player.y + player.h/2, timer: 6.0 };
  donutCooldown = 12.0;
  showMessage("🍩 도넛을 던졌습니다! (상사 어그로 유도)");
}

function useJammer() {
  if (jammerCooldown > 0 || !running || isStunned || isHiding) return;
  playSound('jammer');
  jammerTimer = 5.0;
  jammerCooldown = 15.0;
  showMessage("📡 카메라 잼머 작동! (5초간 카메라 마비)");
}

function updateBoss(dt, isDanger) {
  const b = bosses[round];
  if (!b || !b.active) return;

  let moveTarget = null;
  if (activeDonut) {
    moveTarget = { x: activeDonut.x, y: activeDonut.y };
  } else if (b.alertTarget) {
    moveTarget = b.alertTarget;
    if (Math.hypot(moveTarget.x - b.x, moveTarget.y - b.y) < 10) {
      b.alertTarget = null;
    }
  } else {
    moveTarget = b.pts[b.currIdx];
  }

  if (isDanger) {
    b.speed = b.baseSpeed * 1.3;
    b.visionR = b.baseVision * 1.3;
  } else {
    b.speed = b.baseSpeed;
    b.visionR = b.baseVision;
  }

  const dx = moveTarget.x - b.x;
  const dy = moveTarget.y - b.y;
  const dist = Math.hypot(dx, dy);

  if (dist < 4 && !activeDonut && !b.alertTarget) {
    b.currIdx = (b.currIdx + 1) % b.pts.length;
  } else if (dist >= 4) {
    b.x += (dx / dist) * b.speed * dt;
    b.y += (dy / dist) * b.speed * dt;
  }

  const bx = b.x + b.w / 2, by = b.y + b.h / 2;
  const px = player.x + player.w / 2, py = player.y + player.h / 2;
  const pDist = Math.hypot(px - bx, py - by);

  if (pDist < 220 && running && !isEscaping) {
    heartSoundTimer -= dt;
    if (heartSoundTimer <= 0) {
      playSound('heart');
      heartSoundTimer = Math.max(0.2, pDist / 300);
    }
  }

  if (caughtCooldown > 0 || isHiding) return;

  if (pDist < b.visionR) {
    triggerCaught("🚨 상사에게 발각되었습니다! (-8초)");
  }
}

function updateCameras(dt) {
  const cams = cameras[round];
  if (!cams || cams.length === 0) return;

  if (jammerTimer > 0) {
    jammerTimer -= dt;
    if (jammerTimer < 0) jammerTimer = 0;
    return;
  }

  cams.forEach(cam => {
    cam.currentAngle += cam.sweepSpeed * dt * cam.dir;
    if (cam.currentAngle > cam.maxA) { cam.currentAngle = cam.maxA; cam.dir = -1; }
    if (cam.currentAngle < cam.minA) { cam.currentAngle = cam.minA; cam.dir = 1; }

    if (caughtCooldown > 0 || isHiding) return;

    const px = player.x + player.w / 2 - cam.x;
    const py = player.y + player.h / 2 - cam.y;
    const pDist = Math.hypot(px, py);

    if (pDist < cam.range) {
      let pAngle = Math.atan2(py, px);
      let diff = pAngle - cam.currentAngle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;

      if (Math.abs(diff) <= cam.widthAngle / 2) {
        triggerCaught("📹 감시 카메라 포착! (-8초)");
      }
    }
  });
}

function triggerDash() {
  if (dashCooldown > 0 || !running || isStunned || isHiding) return;
  playSound('dash');
  player.isDashing = true;
  player.speed = 420;
  dashCooldown = 4.0;
  
  const b = bosses[round];
  if (b && b.active) {
    b.alertTarget = { x: player.x, y: player.y };
  }

  setTimeout(() => {
    player.isDashing = false;
    player.speed = player.baseSpeed;
  }, 300);
}

function updateSkillUI(dt) {
  if (dashCooldown > 0) { dashCooldown -= dt; if (dashCooldown < 0) dashCooldown = 0; }
  if (donutCooldown > 0) { donutCooldown -= dt; if (donutCooldown < 0) donutCooldown = 0; }
  if (jammerCooldown > 0) { jammerCooldown -= dt; if (jammerCooldown < 0) jammerCooldown = 0; }

  if (activeDonut) {
    activeDonut.timer -= dt;
    if (activeDonut.timer <= 0) activeDonut = null;
  }

  const btn = document.getElementById("skillBtn");
  const cdTxt = document.getElementById("skillCd");
  if (dashCooldown > 0 || isStunned || isHiding) {
    btn.disabled = true;
    cdTxt.textContent = isStunned ? "STUNNED" : (isHiding ? "HIDING" : dashCooldown.toFixed(1) + "s");
  } else {
    btn.disabled = false;
    cdTxt.textContent = "READY";
  }

  const dBtn = document.getElementById("donutBtn");
  const dCd = document.getElementById("donutCd");
  if (donutCooldown > 0 || isStunned || isHiding) {
    dBtn.disabled = true;
    dCd.textContent = donutCooldown.toFixed(1) + "s";
  } else {
    dBtn.disabled = false;
    dCd.textContent = "READY";
  }

  const jBtn = document.getElementById("jammerBtn");
  const jCd = document.getElementById("jammerCd");
  if (jammerCooldown > 0 || isStunned || isHiding) {
    jBtn.disabled = true;
    jCd.textContent = jammerCooldown.toFixed(1) + "s";
  } else {
    jBtn.disabled = false;
    jCd.textContent = "READY";
  }
}

function move(dt) {
  if (isStunned || isHiding) return;

  let dx = 0, dy = 0;
  if(keys.left) dx--;
  if(keys.right) dx++;
  if(keys.up) dy--;
  if(keys.down) dy++;
  if(!dx && !dy) return;

  const len = Math.hypot(dx, dy);
  dx /= len; dy /= len;
  
  const nx = player.x + dx * player.speed * dt;
  const ny = player.y + dy * player.speed * dt;
  
  if(!solidAt(nx, player.y, player.w, player.h)) player.x = nx;
  if(!solidAt(player.x, ny, player.w, player.h)) player.y = ny;
}

function nearestObject() {
  let best = null, bd = Infinity;
  for(const o of roundData[round].objects) {
    const d = Math.hypot(player.x + player.w/2 - (o.x + o.w/2), player.y + player.h/2 - (o.y + o.h/2));
    if(d < 80 && d < bd) { best = o; bd = d; }
  }
  return best;
}

function allTasksDone() {
  const limit = round === 2 ? 2 : roundData[round].tasks.length;
  return roundData[round].tasks.slice(0, limit).every((_, i) => state[i]);
}

function interact() {
  if(!running || isEscaping || isStunned) return;

  if (isHiding) {
    isHiding = false;
    playSound('hide');
    showMessage("🙈 은신 해제!");
    return;
  }

  const o = nearestObject();
  if(!o) { showMessage("근처에 상호작용할 사무 용품이 없습니다."); return; }

  const complete = (i, text) => {
    if(!state[i]) { 
      state[i] = true; 
      playSound('item');
      if (o.icon) inventory.push(o.icon);
      updateInventoryUI();
      showMessage(text); 
      updateHUD(); 
      return true;
    } else {
      return false;
    }
  };

  let handledMission = false;

  if(round === 0) {
    if(o.id === "computer") handledMission = complete(0, "서랍 서류 더미 속에서 사원증을 찾았습니다!");
    else if(o.id === "printer") handledMission = complete(1, "오늘의 마지막 보고서 출력 완료!");
    else if(o.id === "phone") handledMission = complete(2, "충전 중이던 스마트폰을 챙겼습니다.");
    else if(o.id === "coffee") { playSound('item'); showMessage("☕ 진한 에스프레소! 이동 속도가 지속 상승합니다."); player.baseSpeed = 230; player.speed = 230; handledMission = true; }
    else if(o.id === "desk") { if(!state[0] && !state[1] && !state[2]) showMessage("포스트잇: '오늘 야근 금지!'"); }
    else if(o.id === "exit") tryExit();
  } else if(round === 1) {
    if(o.id === "files") handledMission = complete(0, "회의용 발표 자료를 모두 챙겼습니다!");
    else if(o.id === "npc") handledMission = complete(1, "팀장님: '수고했어, 먼저 들어가 봐!' (클리어)");
    else if(o.id === "card") handledMission = complete(2, "엘리베이터 전용 보안 카드를 취득했습니다!");
    else if(o.id === "coffee") { playSound('item'); showMessage("☕ 아메리카노로 카페인 완전 충전!"); player.baseSpeed = 240; player.speed = 240; handledMission = true; }
    else if(o.id === "meeting") { if(!state[0] && !state[1] && !state[2]) showMessage("텅 빈 회의실... 적막이 흐릅니다."); }
    else if(o.id === "exit") tryExit();
  } else {
    if(o.id === "computer") handledMission = complete(0, "PC 셧다운 완료! 드디어 완벽한 퇴근 준비.");
    else if(o.id === "password") handledMission = complete(1, "퇴근 승인 패스워드 인증 완료!");
    else if(o.id === "exit") tryExit();
    else if(o.id === "desk") { if(!state[0] && !state[1]) showMessage("사장님 자리: '승인 도장이 찍혀 있습니다.'"); }
    else if(o.id === "coffee") { playSound('item'); showMessage("☕ 에너지 드링크! 눈이 번쩍 뜨입니다."); player.baseSpeed = 250; player.speed = 250; handledMission = true; }
  }

  if (!handledMission && o.canHide) {
    isHiding = true;
    playSound('hide');
    showMessage("🙈 가구 아래 숨었습니다! (상사/카메라 완벽 회피)");
  }
}

function tryExit() {
  if(!allTasksDone()) { showMessage("남은 업무를 모두 마쳐야 퇴근할 수 있습니다!"); return; }
  
  isEscaping = true;
  escapeAnimTime = 0;
  playSound('win');
  
  if(round < 2) {
    showMessage("🎉 층별 업무 완료! 다음 층으로 이동합니다.");
    setTimeout(() => {
      round++;
      clearKeys();
      resetRound(true);
      startTime = performance.now();
      last = startTime;
      running = true;
    }, 1200);
  } else {
    if(!state[0] || !state[1]) {
      isEscaping = false;
      showMessage("컴퓨터 종료와 비밀번호 인증을 먼저 완료하세요.");
      return;
    }
    state[2] = true;
    updateHUD();
    setTimeout(() => {
      running = false;
      
      let rank = "S";
      if (caughtCount === 0 && totalElapsed < 120) rank = "S";
      else if (caughtCount <= 2 && totalElapsed < 160) rank = "A";
      else if (caughtCount <= 4) rank = "B";
      else if (caughtCount <= 6) rank = "C";
      else rank = "D";

      document.getElementById("endTitle").textContent = "🏆 칼퇴근 성공!";
      document.getElementById("rankBadge").textContent = rank + " 등급";
      document.getElementById("endText").innerHTML = `총 소요시간: <b>${Math.floor(totalElapsed)}초</b><br>발각 횟수: <b>${caughtCount}회</b>`;
      document.getElementById("endScreen").style.display = "flex";
    }, 1200);
  }
}

let startTime = 0;
function lose() {
  running = false;
  playSound('warn');
  document.getElementById("endTitle").textContent = "😱 야근 확정...";
  document.getElementById("rankBadge").textContent = "FAIL";
  document.getElementById("endText").textContent = "제한 시간이 초과되었습니다. 다음 기회에 칼퇴근을 노려보세요.";
  document.getElementById("endScreen").style.display = "flex";
}

function rect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawMap() {
  const map = maps[round];
  for(let y = 0; y < ROWS; y++) {
    for(let x = 0; x < COLS; x++) {
      const xx = x * TILE, yy = y * TILE;
      if(map[y][x] === "#") {
        const isOuterWall = (x === 0 || x === COLS - 1 || y === 0 || y === ROWS - 1);
        if (isOuterWall) {
          rect(xx, yy, 32, 32, "#1e293b");
          rect(xx, yy, 32, 4, "#334155");
          rect(xx, yy + 28, 32, 4, "#0f172a");
        } else {
          rect(xx, yy, 32, 32, "#334155");
          rect(xx + 2, yy + 2, 28, 28, "#475569");
          if ((x + y) % 3 === 0) {
            rect(xx + 4, yy + 6, 24, 20, "rgba(56, 189, 248, 0.2)");
            rect(xx + 4, yy + 6, 24, 2, "#38bdf8");
            rect(xx + 6, yy + 10, 8, 12, "rgba(255, 255, 255, 0.15)");
          }
          rect(xx + 30, yy, 2, 32, "#1e293b");
        }
      } else {
        const isCorridor = (y === 6 || y === 11 || y === 16 || x === 17);
        if(isCorridor) {
          rect(xx, yy, 32, 32, "#94a3b8");
          rect(xx + 1, yy + 1, 30, 30, "#cbd5e1");
          rect(xx + 2, yy + 2, 8, 8, "rgba(255,255,255,0.4)");
        } else {
          const alt = (x + y) % 2 === 0;
          rect(xx, yy, 32, 32, alt ? "#475569" : "#3e4c5e");
          rect(xx + 1, yy + 1, 30, 30, alt ? "#52637a" : "#475569");
          rect(xx + 15, yy + 1, 2, 30, "rgba(0,0,0,0.04)");
          rect(xx + 1, yy + 15, 30, 2, "rgba(0,0,0,0.04)");
        }
        if (y > 0 && map[y-1][x] === "#" && (x % 5 === 2)) {
          rect(xx + 4, yy, 24, 4, "#78350f");
          rect(xx + 22, yy + 2, 3, 3, "#facc15");
        }
      }
    }
  }

  for(let y = 0; y < ROWS; y++) {
    for(let x = 0; x < COLS; x++) {
      if(map[y][x] === "#" && y + 1 < ROWS && map[y+1][x] === ".") {
        rect(x * TILE, y * TILE + 28, 32, 4, "#0f172a");
      }
    }
  }
}

function drawBoss() {
  const b = bosses[round];
  if (!b || !b.active) return;

  const bx = b.x + b.w / 2, by = b.y + b.h / 2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, by, b.visionR, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(bx, by, 5, bx, by, b.visionR);
  grad.addColorStop(0, "rgba(239, 68, 68, 0.45)");
  grad.addColorStop(1, "rgba(239, 68, 68, 0.05)");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = "rgba(239, 68, 68, 0.5)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  rect(b.x, b.y + 10, b.w, b.h - 10, "#991b1b");
  rect(b.x + 4, b.y + 2, b.w - 8, 10, "#fbcfe8");
  rect(b.x + 2, b.y, b.w - 4, 4, "#1e293b");
  rect(b.x + b.w / 2 - 2, b.y + 12, 4, 8, "#fef08a");
}

function drawCameras() {
  const cams = cameras[round];
  if (!cams || cams.length === 0) return;

  cams.forEach(cam => {
    const isJammed = jammerTimer > 0;
    rect(cam.x - 6, cam.y - 6, 12, 12, "#64748b");
    rect(cam.x - 3, cam.y - 3, 6, 6, isJammed ? "#f59e0b" : "#dc2626");

    if (!isJammed) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cam.x, cam.y);
      const startA = cam.currentAngle - cam.widthAngle / 2;
      const endA = cam.currentAngle + cam.widthAngle / 2;
      ctx.arc(cam.x, cam.y, cam.range, startA, endA);
      ctx.closePath();
      
      const grad = ctx.createRadialGradient(cam.x, cam.y, 10, cam.x, cam.y, cam.range);
      grad.addColorStop(0, "rgba(245, 158, 11, 0.55)");
      grad.addColorStop(1, "rgba(245, 158, 11, 0.08)");
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = "rgba(245, 158, 11, 0.6)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
  });
}

  if(o.id === "phone") {

  }

      rect(x + 6 + i * 14, y + 8, 8, 4, i === 1 ? "#f59e0b" : "#e2e8f0");

  if(o.id === "npc") {

    rect(x + 6, y + 2, w - 12, 5, "#475569"); rect(x + 13, y + 18, 6, 10, "#dc2626");
    return;
  }
  
  if(o.id === "meeting") {
    rect(x, y, w, h, "#78350f"); rect(x + 2, y + 2, w - 4, h - 4, "#92400e");
    rect(x + 10, y + 10, 28, 12, "#e2e8f0");
    return;
  }
  
  if(o.id === "password") {
    rect(x, y, w, h, "#0f172a"); rect(x + 2, y + 2, w - 4, h - 4, "#1e293b");
    rect(x + 4, y + 4, w - 8, 16, "#15803d"); rect(x + 6, y + 6, 20, 2, "#4ade80");
    rect(x + 6, y + 10, 14, 2, "#4ade80");
    return;
  }
}

function drawDecor() {
  function officeSign(text, x, y, w = 110) {
    rect(x, y, w, 20, "#0f172a"); rect(x, y, w, 2, "#38bdf8");
    ctx.fillStyle = "#cbd5e1"; ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center"; ctx.fillText(text, x + w/2, y + 14); ctx.textAlign = "left";
  }

  function windowBlind(x, y) {
    rect(x, y, 48, 16, "#1e293b");
    for(let i = 0; i < 4; i++) rect(x + 2, y + 2 + i * 4, 44, 2, "#475569");
  }

  windowBlind(5*32, 2); windowBlind(10*32, 2); windowBlind(22*32, 2); windowBlind(28*32, 2);

  if(round === 0) {
    officeSign("▶ 안내 데스크", 3*32, 1*32+4, 100); officeSign("▶ 마케팅 부서", 19*32, 1*32+4, 100); officeSign("▶ 탕비실", 26*32, 1*32+4, 100);
  } else if(round === 1) {
    officeSign("▶ 기획 회의실", 3*32, 1*32+4, 100); officeSign("▶ 카드 키함", 26*32, 1*32+4, 100);
  } else {
    officeSign("▶ 임원 집무실", 2*32, 1*32+4, 100); officeSign("▶ 메인 서버실", 12*32, 6*32+4, 100);
  }

  rect(16, 16, 160, 28, "rgba(15, 23, 42, 0.9)");
  rect(16, 16, 160, 28, "rgba(255,255,255,0.05)");
  ctx.fillStyle = "#38bdf8"; ctx.font = "bold 12px sans-serif";
  ctx.fillText(roundData[round].name, 26, 35);
}

function drawPlayer() {
  rect(player.x + 2, player.y + 22, 16, 4, "rgba(0,0,0,0.4)");
  
  if (isStunned && Math.floor(Date.now() / 150) % 2 === 0) return;

  ctx.save();
  if (isHiding) {
    ctx.globalAlpha = 0.35;
  }

  rect(player.x + 4, player.y + 10, 12, 11, player.isDashing ? "#38bdf8" : "#f8fafc");
  rect(player.x + 7, player.y + 10, 6, 6, "#0284c7");
  rect(player.x + 9, player.y + 15, 3, 4, "#f8fafc");
  rect(player.x + 4, player.y + 20, 12, 6, "#1e293b");
  rect(player.x + 4, player.y + 24, 4, 2, "#0f172a");
  rect(player.x + 12, player.y + 24, 4, 2, "#0f172a");
  rect(player.x + 5, player.y + 3, 10, 8, "#fbcfe8");
  rect(player.x + 4, player.y, 12, 5, "#334155");
  rect(player.x + 6, player.y + 6, 2, 2, "#0f172a");
  rect(player.x + 12, player.y + 6, 2, 2, "#0f172a");

  ctx.restore();

  if (isHiding) {
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText("🙈 은신 중", player.x - 8, player.y - 8);
  }
}

function drawActiveDonut() {
  if (!activeDonut) return;
  ctx.font = "20px sans-serif";
  ctx.fillText("🍩", activeDonut.x - 10, activeDonut.y + 8);
}

function drawFogOfWar() {
  ctx.save();
  const px = player.x + player.w / 2;
  const py = player.y + player.h / 2;
  
  const grad = ctx.createRadialGradient(px, py, 60, px, py, 210);
  grad.addColorStop(0, "rgba(0,0,0,0)");
  grad.addColorStop(1, "rgba(9, 13, 22, 0.88)");
  
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawEscapeAnim() {
  if (!isEscaping) return;
  escapeAnimTime += 0.02;
  ctx.fillStyle = `rgba(56, 189, 248, ${Math.min(0.8, escapeAnimTime)})`;
  ctx.fillRect(0, 0, W, H);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawMap();
  drawDecor();
  roundData[round].objects.forEach(drawObject);
  drawActiveDonut();
  drawBoss();
  drawCameras();
  drawPlayer();
  
  if(running) {
    drawFogOfWar();
  }

  drawEscapeAnim();

  if(running && !isEscaping) {
    const o = nearestObject();
    if(o) {
      let text = "SPACE · " + o.name;
      if (o.canHide) {
        if (o.id === "files" && !state[0]) text = "SPACE · 회의 자료 회수";
        else text = "SPACE · " + (isHiding ? "은신 해제" : "숨기");
      }
      
      ctx.font = "bold 12px sans-serif";
      const tw = ctx.measureText(text).width;
      let bx = player.x + 10 - tw/2;
      let by = player.y - 22;
      bx = Math.max(10, Math.min(W - tw - 20, bx));
      
      rect(bx - 6, by - 14, tw + 12, 20, "#0f172a");
      rect(bx - 6, by - 14, tw + 12, 1, "#38bdf8");
      ctx.fillStyle = "#38bdf8";
      ctx.fillText(text, bx, by);
    }
  }
}

function loop(t) {
  const dt = Math.min(0.035, (t - last) / 1000 || 0);
  last = t;

  if(running && !isEscaping) {
    roundElapsed = (t - startTime) / 1000;
    totalElapsed += dt;
    const left = ROUND_TIME - roundElapsed;
    
    if (caughtCooldown > 0) {
      caughtCooldown -= dt;
      if (caughtCooldown < 0) caughtCooldown = 0;
    }
    if (stunTimer > 0) {
      stunTimer -= dt;
      if (stunTimer <= 0) {
        stunTimer = 0;
        isStunned = false;
      }
    }

    document.getElementById("timer").textContent = formatTime(left);
    const isDanger = left <= 30;
    document.getElementById("timer").classList.toggle("danger", isDanger);
    document.getElementById("gameShell").classList.toggle("danger-mode", isDanger);
    
    if(left <= 0) lose();
    else {
      move(dt);
      updateBoss(dt, isDanger);
      updateCameras(dt);
      updateSkillUI(dt);
    }
  }

  draw();
  requestAnimationFrame(loop);
}

function handleKeyEvent(code, isPressed) {
  if (code === "KeyW" || code === "ArrowUp") keys.up = isPressed;
  if (code === "KeyS" || code === "ArrowDown") keys.down = isPressed;
  if (code === "KeyA" || code === "ArrowLeft") keys.left = isPressed;
  if (code === "KeyD" || code === "ArrowRight") keys.right = isPressed;
}

window.addEventListener("keydown", e => {
  if (e.code === "ShiftLeft" || e.code === "ShiftRight") {
    e.preventDefault();
    triggerDash();
  }
  if (e.code === "KeyQ") {
    e.preventDefault();
    useDonut();
  }
  if (e.code === "KeyE") {
    e.preventDefault();
    useJammer();
  }
  if (e.code === "Space") {
    e.preventDefault();
    interact();
  }
  handleKeyEvent(e.code, true);
});

window.addEventListener("keyup", e => {
  handleKeyEvent(e.code, false);
});

window.addEventListener("blur", clearKeys);

document.querySelectorAll("[data-key]").forEach(btn => {
  const k = btn.dataset.key;
  const mapKey = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  const target = mapKey[k];
  
  const down = e => { e.preventDefault(); if (target) keys[target] = true; btn.blur(); };
  const up = e => { e.preventDefault(); if (target) keys[target] = false; btn.blur(); };
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointercancel", up);
  btn.addEventListener("pointerleave", up);
});

document.getElementById("actionBtn").addEventListener("pointerdown", e => {
  e.preventDefault(); interact(); e.target.blur();
});
document.getElementById("skillBtn").addEventListener("pointerdown", e => {
  e.preventDefault(); triggerDash(); e.target.blur();
});
document.getElementById("donutBtn").addEventListener("pointerdown", e => {
  e.preventDefault(); useDonut(); e.target.blur();
});
document.getElementById("jammerBtn").addEventListener("pointerdown", e => {
  e.preventDefault(); useJammer(); e.target.blur();
});

function startGame() {
  round = 0;
  running = false;
  roundElapsed = 0;
  totalElapsed = 0;
  caughtCount = 0;
  player.baseSpeed = 190;
  player.speed = 190;
  resetRound(false);
  startTime = performance.now();
  last = startTime;
  running = true;
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("endScreen").style.display = "none";
  window.focus();
  showMessage("🏃 게임 시작! 가구 밑에 숨거나 도넛/잼머를 활용하세요.");
}

const startBtn = document.getElementById("startBtn");
if(startBtn) startBtn.onclick = startGame;

const restartBtn = document.getElementById("restartBtn");
if(restartBtn) restartBtn.onclick = startGame;

resetRound(false);
requestAnimationFrame(loop);
</script>
</body>
