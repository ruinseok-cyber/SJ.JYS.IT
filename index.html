<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>JYS IT콘텐츠 오락실 런처</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b0b1a;--ac:#ffd84a;--hi:#9dff6a;--tx:#e8e8ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:radial-gradient(circle at 70% 30%,#25214a,#0b0b1a 70%);color:var(--tx);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(300px,42%) 1fr;gap:24px;height:calc(100% - 64px);padding:20px 28px 0}
/* 게임기 */
#cab{display:flex;flex-direction:column;align-items:center;min-height:0}
.cabody{width:min(100%,520px,max(260px,calc((100vh - 235px)*1.333)));flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(90deg,#1a1230,#3a2a6a 8%,#241a46 50%,#3a2a6a 92%,#1a1230);border:3px solid #0a0618;border-radius:18px 18px 6px 6px;padding:10px 14px 0;box-shadow:0 0 40px #6a4aff55}
.marquee{height:64px;border-radius:8px;background:linear-gradient(#ff3d7f,#7a2cff);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;text-shadow:0 0 10px #fff,0 0 22px #ff9;letter-spacing:2px;padding:0 10px;text-align:center;overflow:hidden;white-space:nowrap}
.bezel{margin-top:10px;background:#05050c;border:6px solid #14102a;border-radius:14px;padding:10px;box-shadow:inset 0 0 18px #000}
#screen{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;border-radius:6px}
#screen img{width:100%;height:100%;object-fit:contain;display:block}
#screen .noimg{display:grid;place-items:center;height:100%;color:#888;font-size:14px;text-align:center;background:repeating-linear-gradient(0deg,#111 0 3px,#181828 3px 6px)}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px);box-shadow:inset 0 0 40px #000a}
#screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:2}
#screen.full{position:fixed;inset:0;z-index:50;aspect-ratio:auto;border-radius:0}
#screen.full::after{display:none}
.cabody{position:relative}
.cab-decor{position:absolute;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(35%,180px,22vh);max-height:calc(100% - 220px);height:auto;object-fit:contain;pointer-events:none;z-index:1}
.panel{position:relative;z-index:2;margin-top:auto;height:90px;background:linear-gradient(#2d2358,#171030);border-top:3px solid #6a4aff;border-radius:50% 50% 0 0/22px 22px 0 0;display:flex;align-items:center;justify-content:center;gap:30px}
.stick{width:14px;height:44px;background:#ccc;border-radius:7px;position:relative;margin-right:24px}
.stick::before{content:"";position:absolute;top:-16px;left:-11px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d01010 70%)}
.btns{display:flex;gap:12px}.btns i{width:24px;height:24px;border-radius:50%;box-shadow:0 3px 0 #0006}
.btns i:nth-child(1){background:#4af}.btns i:nth-child(2){background:#fd4}.btns i:nth-child(3){background:#f55}
.coin{width:46px;height:12px;background:#000;border:2px solid #aaa;border-radius:3px;margin-left:10px}
/* 목록 */
#side{position:relative;border:2px solid #ffd84a55;border-radius:16px;background:#0008;padding:16px 20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#side h1{font-size:44px;color:var(--ac);text-shadow:3px 3px 0 #c33,0 0 18px #fa0;letter-spacing:4px;display:flex;align-items:center;gap:14px;margin-bottom:8px}
canvas{image-rendering:pixelated}
#list{scroll-behavior:auto;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:safe center;gap:2px;z-index:1;padding-right:4px;scrollbar-width:thin;scrollbar-color:#6a4aff #0000}
.row{display:flex;align-items:center;gap:18px;height:var(--rh,40px);flex:none;padding:0 14px;font-size:var(--fs,21px);font-weight:700;border:2px solid transparent;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.row b{color:#4ac8ff;min-width:44px;text-align:right}
.row.sel{color:var(--ac);border-color:var(--hi);background:#9dff6a1f;box-shadow:0 0 14px #9dff6a66}
.row.sel b{color:var(--ac)}
.row.sel::before{content:"★";color:#ffd84a;margin-left:-6px}
#sprite{position:absolute;right:8px;bottom:6px;opacity:.9;pointer-events:none}
#empty{display:none;margin:auto;text-align:center;line-height:2;font-size:18px}
@media (max-height:720px){#side{padding:10px 16px}#side h1{font-size:30px;margin-bottom:2px}#side h1 canvas{width:32px!important;height:32px!important}.marquee{height:46px;font-size:20px}.panel{height:70px}#sprite{width:110px!important;height:110px!important}}
#start{position:fixed;inset:0;z-index:200;background:#000d;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--ac);text-shadow:0 0 14px #fa0;cursor:pointer}
#start small{font-size:15px;color:#fff;text-shadow:none;opacity:.8}
@keyframes bl{50%{opacity:.2}}#start span{animation:bl 1s steps(2) infinite}
#gw{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden}
#gw iframe{position:absolute;left:0;top:0;border:0;background:#fff}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:150;background:#000c;color:var(--ac);border:2px solid var(--ac);border-radius:10px;padding:8px 18px;font-size:18px;font-weight:700;pointer-events:none;transition:opacity .4s}
#prev{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);border:2px dashed var(--hi);box-shadow:0 0 0 999px #0008;pointer-events:none}
#bar .sm{padding:6px 9px;border-width:1px}
/* 하단 */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 28px;background:#000a;border-top:2px solid #6a4aff55;font-size:14px}
#bar button,.pick{background:#1d1a3a;color:var(--tx);border:2px solid #6a4aff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
#bar button:hover,.pick:hover{background:#3a2f80}
#bar .sp{flex:1}.cell{border:2px solid #6a4aff;border-radius:8px;padding:8px 16px;font-size:16px}
#bar .cell b{color:var(--ac)}
</style>
</head>

let games=[],sel=0,running=false,t0=Date.now();
// ── 도트 스프라이트 (패미컴 느낌) ──
const PAL={R:'#e03030',S:'#ffc890',K:'#6a3410',B:'#2a50e0',Y:'#ffd84a',W:'#fff',X:'#b060ff',O:'#111',G:'#30c040',P:'#ff7ab0'};
const SPR={
hero:["...RRRRR....","..RRRRRRRRR.","..KKKSSKS...",".KSKSSSKSSS.",".KSKKSSSKSSS",".KKSSSSKKKK.","...SSSSSSS..","..RRBRRR....",".RRRBRRBRRR.","RRRRBBBBRRRR","SS.BBYBBYBB.","...BBB.BBB..","..KKK...KKK.",".KKKK...KKKK"],
ghost:["....XXXX....","..XXXXXXXX..",".XXXXXXXXXX.",".XXWWXXWWXX.","XXXWOXXWOXXX","XXXWWXXWWXXX","XXXXXXXXXXXX","XXXXXXXXXXXX","XXXXXXXXXXXX","XXXXXXXXXXXX","XX.XXX.XXX.X","X...XXXX...X"],
mush:["....RRRR....","..RRRRRRRR..",".RRWWRRRWWR.","RRWWWRRRWWWR","RRWWWRRRWWWR","RRRRRRRRRRRR",".WWSSOSSOSW.","..WSSSSSSW..","...SSSSSS...","....SSSS...."]};
function draw(cv,name){const s=SPR[name],c=cv.getContext('2d');cv.width=12;cv.height=Math.max(12,s.length);c.clearRect(0,0,12,cv.height);
 s.forEach((r,y)=>[...r.padEnd(12,'.')].forEach((ch,x)=>{if(PAL[ch]){c.fillStyle=PAL[ch];c.fillRect(x,y,1,1)}}))}
draw($('#cLogo'),'mush');
const names=['hero','ghost'];let sp=0;
function nextSprite(){draw($('#sprite'),names[sp++%names.length])}nextSprite();
// ── 효과음 ──
let ac;function beep(f=660,d=.06){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
// ── 폴더 읽기 ──
const nfc=s=>s.normalize('NFC');
$('#fi').onchange=e=>{
  const files=[...e.target.files],imgs={};
  const base=f=>nfc(f.name.replace(/\.[^.]+$/,'')),dir=f=>nfc((f.webkitRelativePath||'').replace(/[^/]*$/,''));
  files.filter(f=>/\.(png|jpe?g|gif|webp)$/i.test(f.name)).forEach(f=>{imgs[dir(f)+base(f)]=f;imgs[base(f)]=imgs[base(f)]||f});
  games=files.filter(f=>/\.html?$/i.test(f.name)&&!/런처|launcher/i.test(f.name)).map(f=>({file:f,title:base(f).replace(/_/g,' '),img:imgs[dir(f)+base(f)]||imgs[base(f)]}))
    .sort((a,b)=>a.title.localeCompare(b.title,'ko'));
  sel=0;render(false,true);beep(880,.12);
};
function ensureSel(){
  const L=$('#list'),N=games.length;if(!N)return;
  if(sel===0){L.scrollTop=0;return}
  if(sel===N-1){L.scrollTop=L.scrollHeight;return}
  const r=L.children[sel];if(!r)return;
  const a=r.getBoundingClientRect(),b=L.getBoundingClientRect();
  if(a.top<b.top)L.scrollTop+=a.top-b.top;else if(a.bottom>b.bottom)L.scrollTop+=a.bottom-b.bottom;
}
function render(keepScroll,ensure){
  const L=$('#list');const st0=L.scrollTop;const reuse=keepScroll&&games.length&&L.children.length===games.length;if(!reuse)L.innerHTML='';$('#empty').style.display=games.length?'none':'block';
  const N=games.length,H=L.clientHeight||400,rh=Math.max(30,Math.min(46,Math.floor(H/Math.max(N,1))-2));
  L.style.setProperty('--rh',rh+'px');L.style.setProperty('--fs',Math.min(21,Math.max(14,rh*.5))+'px');
  if(reuse){[...L.children].forEach((r,i)=>r.classList.toggle('sel',i===sel))}else games.forEach((g,n)=>{const d=document.createElement('div');
    d.className='row'+(n===sel?' sel':'');d.innerHTML=`<b>${n+1}</b><span>${g.title.replace(/</g,'&lt;')}</span>`;
    d.onclick=()=>{if(n===sel)play();else{sel=n;render(true);beep()}};L.appendChild(d)});
  if(keepScroll)L.scrollTop=st0;if(ensure){ensureSel();requestAnimationFrame(ensureSel);setTimeout(ensureSel,120)}
  $('#cnt').textContent=(N?sel+1:0)+'/'+N;
  const g=games[sel];$('#mq').textContent=g?g.title:'JYS IT콘텐츠 오락실';
  const sc=$('#screen');if(running){showZ(g);return}
  sc.innerHTML='';
  if(g&&(g.img||g.imgUrl)){const im=new Image();im.src=g.imgUrl?encodeURI(g.imgUrl):URL.createObjectURL(g.img);sc.appendChild(im)}
  else sc.innerHTML='<div class="noimg">'+(g?'스크린샷 없음<br>('+g.title+'.png 를 같은 폴더에 넣어주세요)':'INSERT COIN')+'</div>';
  showZ(g);
}
// ── 실행/종료 ──
// ── 게임별 화면 배율 저장 (Ctrl+휠 / 핀치 / Ctrl +,-,0) ──
const ZS=[.25,.33,.5,.67,.75,.8,.9,1,1.1,1.25,1.5,1.75,2,2.5,3,4,5];
const ZK=g=>'arcade.zoom.'+(g.file?g.file.name:g.url).normalize('NFC');
function getZ(g){try{const v=parseFloat(localStorage.getItem(ZK(g)));if(v>.2&&v<6)return v}catch(e){}return g.zoom||1}
function setZ(g,v){try{localStorage.setItem(ZK(g),String(v))}catch(e){}}
function showZ(g){$('#sz').textContent=Math.round((g?getZ(g):1)*100)+'%'}
function applyZ(g,toast){const f=$('#game');if(!f)return;const k=getZ(g);
  f.style.width=100/k+'%';f.style.height=100/k+'%';f.style.transform='scale('+k+')';f.style.transformOrigin='0 0';
  if(toast){const t=$('#toast');t.textContent='화면 배율 '+Math.round(k*100)+'%';t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,1200)}}
function stepZ(dir){const g=games[sel];if(!g||!running)return;const c=getZ(g);
  let i=ZS.reduce((b,v,j)=>Math.abs(v-c)<Math.abs(ZS[b]-c)?j:b,0);i=Math.max(0,Math.min(ZS.length-1,i+dir));
  setZ(g,ZS[i]);applyZ(g,true);showZ(g)}
let lastW=0;
function wheelZ(e){if(!e.ctrlKey)return;e.preventDefault();const n=Date.now();if(n-lastW<70)return;lastW=n;stepZ(e.deltaY<0?1:-1)}
function gameKey(e){if(e.key==='Escape')return stop();
  if(e.ctrlKey&&['+','=','-','_','0'].includes(e.key)){e.preventDefault();const g=games[sel];
    if(e.key==='0'){setZ(g,1);applyZ(g,true);showZ(g)}else stepZ(e.key==='-'||e.key==='_'?-1:1)}}
function gameShim(){
  try{localStorage.getItem('x')}catch(e){var m={};Object.defineProperty(window,'localStorage',{value:{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}}}})}
}
async function play(){
  const g=games[sel];if(!g||running)return;running=true;beep(990,.15);
  let txt;try{if(g.file)txt=await g.file.text();else{const r=await fetch(encodeURI(g.url));if(!r.ok)throw 0;txt=await r.text()}}catch(e){running=false;alert('게임 파일을 불러오지 못했어요: '+g.title);return}
  const w=document.createElement('div');w.id='gw';
  const f=document.createElement('iframe');f.id='game';f.allow='autoplay; fullscreen; gamepad';f.srcdoc='<script>('+gameShim.toString()+')()<\/script>'+txt;
  f.onload=()=>{try{const w=f.contentWindow;w.addEventListener('keydown',gameKey);w.addEventListener('wheel',wheelZ,{passive:false})}catch(e){}f.focus()};
  const t=document.createElement('div');t.id='toast';t.style.opacity=0;
  w.appendChild(f);w.appendChild(t);document.body.appendChild(w);applyZ(g,false);
}
function stop(){if(!running)return;running=false;const w=$('#gw');if(w)w.remove();render(false,true);beep(330,.15)}
function key(e){
  if(running){gameKey(e);return}
  if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault();
  if(!games.length)return;
  if(e.key==='ArrowDown'){sel=(sel+1)%games.length;render(true,true);beep();nextSprite()}
  else if(e.key==='ArrowUp'){sel=(sel-1+games.length)%games.length;render(true,true);beep();nextSprite()}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();play()}
}
addEventListener('keydown',key);addEventListener('resize',()=>{render(false,true);centerCabDecor()});
addEventListener('wheel',wheelZ,{passive:false});
$('#bReset').onclick=()=>{const g=games[sel];if(g){setZ(g,1);showZ(g)}};
$('#bPlay').onclick=play;$('#bExit').onclick=stop;
setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#clk').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
// ── 전체화면 (웹용: exe 키오스크 대신) ──
function toggleFS(){
  if(document.fullscreenElement){document.exitFullscreen();return}
  document.documentElement.requestFullscreen().then(()=>{try{navigator.keyboard&&navigator.keyboard.lock(['Escape'])}catch(e){}}).catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){try{navigator.keyboard&&navigator.keyboard.unlock()}catch(e){}}});
$('#bFull').onclick=toggleFS;
// ── 웹 모드: games/games.json 이 있으면 서버의 게임을 자동 로드 ──
(async()=>{
  try{
    const r=await fetch('games/games.json',{cache:'no-cache'});if(!r.ok)return;
    const list=await r.json();if(!Array.isArray(list)||!list.length)return;
    games=list.map(o=>({url:o.file,title:o.title||String(o.file).replace(/^.*\//,'').replace(/\.[^.]+$/,'').replace(/_/g,' '),imgUrl:o.img||null,zoom:o.zoom||1}))
      .sort((a,b)=>a.title.localeCompare(b.title,'ko'));
    const p=document.querySelector('.pick');if(p)p.style.display='none';
    sel=0;render(false,true);
  }catch(e){}
})();
render(false,true);
</script>
</body>
</html>
