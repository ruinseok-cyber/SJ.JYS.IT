<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DISCO // RHYTHM FIGHT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05000d;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#wrap {
    position: relative;
    width: min(1100px, 100vw);
    height: min(700px, 100vh);
    margin: auto;
    overflow: hidden;
    background: #090018;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.hud {
    position: absolute;
    top: 18px;
    left: 25px;
    right: 25px;

    display: flex;
    justify-content: space-between;

    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;

    text-shadow: 0 0 12px white;
}

#prompt {
    position: absolute;
    left: 50%;
    bottom: 145px;

    transform: translateX(-50%);

    font-size: 38px;
    font-weight: 1000;
    letter-spacing: 6px;

    text-shadow: 0 0 25px currentColor;
}

#beatText {
    position: absolute;
    left: 50%;
    bottom: 110px;

    transform: translateX(-50%);

    font-size: 12px;
    letter-spacing: 4px;
    opacity: .7;
}

#beatline {
    position: absolute;
    left: 9%;
    right: 9%;
    bottom: 78px;

    height: 45px;

    border-bottom: 3px solid rgba(255,255,255,.25);
}

#beatCursor {
    position: absolute;

    width: 4px;
    height: 55px;

    bottom: 73px;

    background: white;

    box-shadow:
        0 0 15px #00eaff,
        0 0 30px #00eaff;
}

#judgeLine {
    display: none;
}

#judgement {
    position: absolute;

    left: 50%;
    top: 43%;

    transform: translate(-50%, -50%) scale(.8);

    font-size: 45px;
    font-weight: 1000;
    letter-spacing: 5px;

    opacity: 0;

    transition: .1s;

    text-shadow: 0 0 30px currentColor;
}

#judgement.show {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1.1);
}

#keys {
    position: absolute;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 15px;
}

.key {
    width: 190px;
    height: 42px;

    border: 2px solid white;
    border-radius: 10px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-weight: 1000;

    background: #10051e;

    box-shadow:
        0 0 15px rgba(255,255,255,.25);

    transition: .08s;
}

.key.active {
    transform:
        translateY(-6px)
        scale(1.08);

    background: white;
    color: #08000f;

    box-shadow:
        0 0 20px white,
        0 0 40px white;
}

#start {
    position: absolute;
    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    gap: 15px;

    background: rgba(5,0,15,.9);

    backdrop-filter: blur(6px);
}

.title {
    font-size: 46px;

    font-weight: 1000;

    letter-spacing: 6px;

    color: #ff00aa;

    text-shadow:
        0 0 20px #ff00aa,
        0 0 50px #ff00aa;
}

.subtitle {
    font-size: 12px;

    letter-spacing: 5px;

    opacity: .65;
}

.controlPanel {
    width: 420px;

    padding: 22px;

    border-radius: 16px;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(15,0,35,.9);

    text-align: center;
}

.controlTitle {
    color: #ffe600;

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 18px;
}

.control {
    display: flex;

    justify-content: space-between;

    padding: 13px 18px;

    margin: 8px 0;

    border-radius: 10px;

    background:
        rgba(255,255,255,.06);
}

.control b {
    font-size: 20px;
}

.attackKey {
    color: #ffe600;
}

.defenseKey {
    color: #00eaff;
}

button {
    border: 0;

    padding: 14px 35px;

    border-radius: 12px;

    background: #ffe600;

    color: #15000f;

    font-size: 16px;

    font-weight: 1000;

    cursor: pointer;

    box-shadow:
        0 0 25px
        rgba(255,230,0,.5);
}

.info {
    font-size: 12px;

    opacity: .6;
}
</style>
</head>

<body>

<div id="wrap">

<canvas
    id="game"
    width="1100"
    height="700">
</canvas>

<div id="ui">

    <div class="hud">

        <div>
            HP <span id="hp">100</span>
        </div>

        <div>
            COMBO <span id="combo">0</span>
        </div>

        <div>
            SCORE <span id="score">0</span>
        </div>

        <div>
            BPM <span id="bpm">120</span>
        </div>

    </div>

    <div id="prompt">
        READY
    </div>

    <div id="beatText">
        ATTACK / DEFENSE BEAT
    </div>

    <div id="beatline"></div>

    <div id="beatCursor"></div>

    <div id="judgeLine"></div>

    <div id="judgement"></div>

    <div id="keys">

        <div
            class="key"
            id="attackUI">
            A · ATTACK
        </div>

        <div
            class="key"
            id="defenseUI">
            D · DEFENSE
        </div>

    </div>

</div>


<div id="start">

    <div
        class="title"
        id="title">
        NEON DISCO
    </div>

    <div class="subtitle">
        RHYTHM COMBAT // 120 BPM
    </div>

    <div class="controlPanel">

        <div class="controlTitle">
            CONTROL
        </div>

        <div class="control">

            <span class="attackKey">
                ATTACK
            </span>

            <b class="attackKey">
                A
            </b>

        </div>

        <div class="control">

            <span class="defenseKey">
                DEFENSE
            </span>

            <b class="defenseKey">
                D
            </b>

        </div>

        <div class="info">
            적이 원 안에 들어왔을 때
            박자에 맞춰 입력하세요.
        </div>

    </div>

    <button id="startButton">
        START TRACK
    </button>

    <div class="info">
        강렬한 120 BPM 전자 리듬이 시작됩니다.
    </div>

</div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;


/* =================================================
   SETTINGS
================================================= */

const BPM = 120;

const BEAT_MS =
    60000 / BPM;

const PERFECT_WINDOW =
    BEAT_MS * 0.10;

const GOOD_WINDOW =
    BEAT_MS * 0.22;


/*
    캐릭터 주변의 실제 판정 범위
*/
const JUDGE_RADIUS = 125;


/*
    공격 성공 순간의 슬로모션
*/
let slowMotion = 1;

let slowMotionTimer = 0;


/* =================================================
   GAME STATE
================================================= */

let running = false;

let startTime = 0;

let lastFrameTime = 0;

let lastBeat = -1;

let beat = 0;

let score = 0;

let combo = 0;

let hp = 100;

let action = null;

let actionBeat = -1;

let pulse = 0;

let shake = 0;

let flash = 0;


/* =================================================
   HERO
================================================= */

let heroX = 550;

let heroY = 435;


/* =================================================
   OBJECTS
================================================= */

let enemies = [];

let particles = [];


/* =================================================
   AUDIO
================================================= */

let audioCtx = null;

let audioTimer = null;

let audioStep = 0;


/* =================================================
   UI
================================================= */

const hpEl =
    document.getElementById("hp");

const comboEl =
    document.getElementById("combo");

const scoreEl =
    document.getElementById("score");

const bpmEl =
    document.getElementById("bpm");

const prompt =
    document.getElementById("prompt");

const judgement =
    document.getElementById("judgement");

const attackUI =
    document.getElementById("attackUI");

const defenseUI =
    document.getElementById("defenseUI");

const beatCursor =
    document.getElementById("beatCursor");


/* =================================================
   AUDIO
================================================= */

function startMusic() {

    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    audioCtx.resume();

    audioStep = 0;

    playMusicBeat();

    audioTimer =
        setInterval(
            playMusicBeat,
            BEAT_MS / 2
        );
}


function stopMusic() {

    if (audioTimer) {

        clearInterval(audioTimer);

        audioTimer = null;
    }

    if (audioCtx) {

        audioCtx.close();

        audioCtx = null;
    }
}


function playMusicBeat() {

    if (!audioCtx || !running)
        return;

    const now =
        audioCtx.currentTime;


    /*
       KICK
    */

    if (audioStep % 2 === 0) {

        const kick =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        kick.type = "sine";

        kick.frequency.setValueAtTime(
            140,
            now
        );

        kick.frequency.exponentialRampToValueAtTime(
            45,
            now + .13
        );

        gain.gain.setValueAtTime(
            .35,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .18
        );

        kick.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        kick.start(now);

        kick.stop(
            now + .2
        );
    }


    /*
       BASS
    */

    if (audioStep % 4 === 2) {

        const bass =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        bass.type = "sawtooth";

        bass.frequency.value = 55;

        gain.gain.setValueAtTime(
            .08,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .22
        );

        bass.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        bass.start(now);

        bass.stop(
            now + .25
        );
    }


    /*
       HI-HAT
    */

    if (audioStep % 2 === 1) {

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type = "square";

        osc.frequency.value = 7000;

        gain.gain.setValueAtTime(
            .025,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now + .035
        );

        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        osc.start(now);

        osc.stop(
            now + .04
        );
    }


    audioStep++;
}


/* =================================================
   START
================================================= */

document
    .getElementById("startButton")
    .onclick =
    startGame;


function startGame() {

    score = 0;

    combo = 0;

    hp = 100;

    beat = 0;

    lastBeat = -1;

    action = null;

    actionBeat = -1;

    heroX = 550;

    heroY = 435;

    enemies = [];

    particles = [];

    pulse = 0;

    shake = 0;

    flash = 0;

    slowMotion = 1;

    slowMotionTimer = 0;

    running = true;

    startTime =
        performance.now();

    lastFrameTime =
        performance.now();


    document
        .getElementById("start")
        .style.display =
        "none";

    document
        .getElementById("title")
        .textContent =
        "NEON DISCO";

    document
        .getElementById("startButton")
        .textContent =
        "START TRACK";


    bpmEl.textContent =
        BPM;

    startMusic();

    requestAnimationFrame(loop);
}


/* =================================================
   JUDGEMENT
================================================= */

let judgementTimer = null;


function showJudgement(
    text,
    color
) {

    judgement.textContent =
        text;

    judgement.style.color =
        color;

    judgement.classList.add(
        "show"
    );

    clearTimeout(
        judgementTimer
    );

    judgementTimer =
        setTimeout(
            () => {

                judgement.classList.remove(
                    "show"
                );

            },
            250
        );
}


/* =================================================
   PARTICLES
================================================= */

function burst(
    x,
    y,
    amount,
    color
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            2 +
            Math.random() * 7;

        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            size:
                2 +
                Math.random() * 5,

            color: color

        });
    }
}


/* =================================================
   SPAWN ENEMY
================================================= */

function spawnEnemy() {

    const side =
        Math.floor(
            Math.random() * 4
        );

    let x;
    let y;

    const pad = 70;


    if (side === 0) {

        x = -pad;

        y =
            150 +
            Math.random() * 330;
    }

    else if (side === 1) {

        x = W + pad;

        y =
            150 +
            Math.random() * 330;
    }

    else if (side === 2) {

        x =
            150 +
            Math.random() * 800;

        y = -pad;
    }

    else {

        x =
            150 +
            Math.random() * 800;

        y = H + pad;
    }


    /*
       현재 행동과 같은 종류의 적을 생성.
       따라서 판정이 꼬이지 않음.
    */

    const type =
        action ||
        (
            Math.random() < .5
            ? "ATTACK"
            : "DEFENSE"
        );


    enemies.push({

        x: x,

        y: y,

        type: type,

        hit: false,

        done: false,

        rot:
            Math.random() *
            Math.PI * 2,

        vx: 0,

        vy: 0,

        life: 1,

        bounce: false

    });
}


/* =================================================
   ACTION
================================================= */

function setAction(type) {

    action = type;

    actionBeat = beat;


    attackUI.classList.toggle(
        "active",
        type === "ATTACK"
    );

    defenseUI.classList.toggle(
        "active",
        type === "DEFENSE"
    );


    if (type === "ATTACK") {

        prompt.textContent =
            "ATTACK";

        prompt.style.color =
            "#ffe600";
    }

    else {

        prompt.textContent =
            "DEFENSE";

        prompt.style.color =
            "#00eaff";
    }
}


/* =================================================
   INPUT
================================================= */

window.addEventListener(
    "keydown",
    e => {

        if (!running)
            return;


        if (
            e.code === "KeyA"
        ) {

            e.preventDefault();

            playerAction(
                "ATTACK"
            );
        }


        if (
            e.code === "KeyD"
        ) {

            e.preventDefault();

            playerAction(
                "DEFENSE"
            );
        }

    }
);


/* =================================================
   PLAYER ACTION
================================================= */

function playerAction(type) {

    if (!running)
        return;


    const elapsed =
        performance.now() -
        startTime;


    const phase =
        elapsed % BEAT_MS;


    const distanceFromBeat =
        Math.min(
            phase,
            BEAT_MS - phase
        );


    const perfect =
        distanceFromBeat <=
        PERFECT_WINDOW;


    const good =
        distanceFromBeat <=
        GOOD_WINDOW;


    /*
       현재 행동에 맞는
       가장 가까운 적을 찾음
    */

    const target =
        enemies.find(
            e =>
                !e.done &&
                !e.hit &&
                e.type === type
        );


    let targetDistance =
        Infinity;


    if (target) {

        targetDistance =
            Math.hypot(
                target.x - heroX,
                target.y - heroY
            );
    }


    /*
       원형 판정선 안에 있어야 함
    */

    const inRange =
        target &&
        targetDistance <=
        JUDGE_RADIUS;


    /*
       행동 + 박자 + 거리
       모두 만족해야 성공
    */

    if (
        action === type &&
        actionBeat === beat &&
        inRange
    ) {

        combo++;


        if (perfect) {

            score +=
                200 +
                combo * 15;

            showJudgement(
                "PERFECT",
                "#ffe600"
            );

        }

        else if (good) {

            score +=
                120 +
                combo * 10;

            showJudgement(
                "GOOD",
                "#00eaff"
            );

        }

        else {

            score +=
                70 +
                combo * 5;

            showJudgement(
                "OK",
                "#ffffff"
            );
        }


        /*
           ATTACK
        */

        if (type === "ATTACK") {

            target.hit = true;

            target.done = true;


            /*
               공격 성공 순간
               슬로모션
            */

            slowMotion = .15;

            slowMotionTimer = 220;


            /*
               큰 입자 폭발
            */

            burst(
                target.x,
                target.y,
                70,
                "#ffea00"
            );

            burst(
                target.x,
                target.y,
                35,
                "#ff2bd6"
            );


            shake = 12;

            flash = 1;

        }


        /*
           DEFENSE
        */

        else {

            target.hit = true;

            target.bounce = true;


            const dx =
                target.x -
                heroX;

            const dy =
                target.y -
                heroY;


            const dist =
                Math.hypot(
                    dx,
                    dy
                ) || 1;


            /*
               캐릭터에서
               바깥쪽으로 튕김
            */

            target.vx =
                dx / dist * 16;

            target.vy =
                dy / dist * 16;


            burst(
                target.x,
                target.y,
                30,
                "#00eaff"
            );


            showJudgement(
                "BLOCK!",
                "#00eaff"
            );

            shake = 8;
        }

    }

    else {

        combo = 0;

        hp -= 10;

        shake = 15;

        showJudgement(
            "MISS",
            "#ff2bd6"
        );
    }


    updateUI();
}


/* =================================================
   UI
================================================= */

function updateUI() {

    hpEl.textContent =
        Math.max(
            0,
            Math.round(hp)
        );

    comboEl.textContent =
        combo;

    scoreEl.textContent =
        score;
}


/* =================================================
   GAME LOOP
================================================= */

function loop(now) {

    if (!running)
        return;


    /*
       실제 시간.
       슬로모션과 무관하게
       BPM 판정은 정확하게 유지.
    */

    const elapsed =
        now - startTime;


    const realDelta =
        Math.min(
            now - lastFrameTime,
            40
        );


    lastFrameTime = now;


    /*
       BEAT
    */

    beat =
        Math.floor(
            elapsed /
            BEAT_MS
        );


    /*
       슬로모션 회복
    */

    if (slowMotionTimer > 0) {

        slowMotionTimer -=
            realDelta;

    }

    else {

        slowMotion +=
            (1 - slowMotion) *
            .18;
    }


    /*
       새로운 박자
    */

    if (
        beat !==
        lastBeat
    ) {

        lastBeat =
            beat;

        pulse = 1;


        /*
           첫 박자에서
           행동 결정
        */

        if (beat === 0) {

            setAction(
                Math.random() < .5
                ? "ATTACK"
                : "DEFENSE"
            );
        }


        /*
           2박마다 적 생성
        */

        if (
            beat > 0 &&
            beat % 2 === 0
        ) {

            /*
               다음 행동 결정
            */

            setAction(
                Math.random() < .5
                ? "ATTACK"
                : "DEFENSE"
            );

            spawnEnemy();
        }
    }


    /*
       박자 진행률
    */

    const beatPhase =
        (elapsed % BEAT_MS) /
        BEAT_MS;


    /*
       현재 프레임의
       실제 이동 시간
    */

    const dt =
        realDelta /
        16.6667 *
        slowMotion;


    /* =================================================
       ENEMY MOVEMENT
    ================================================= */

    enemies.forEach(
        e => {

            /*
               방어 성공 후
               튕겨나가는 상태
            */

            if (e.bounce) {

                e.x +=
                    e.vx * dt;

                e.y +=
                    e.vy * dt;

                e.vx *=
                    Math.pow(
                        .94,
                        dt
                    );

                e.vy *=
                    Math.pow(
                        .94,
                        dt
                    );

                e.life -=
                    .035 * dt;

                return;
            }


            if (e.done)
                return;


            const dx =
                heroX -
                e.x;

            const dy =
                heroY -
                e.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                ) || 1;


            /*
               적 접근 속도
            */

            const speed = 1.65;


            e.x +=
                dx /
                distance *
                speed *
                dt;

            e.y +=
                dy /
                distance *
                speed *
                dt;


            e.rot +=
                .04 * dt;


            /*
               캐릭터와 너무 가까워지면
               공격 실패 처리
            */

            if (
                distance < 48 &&
                !e.hit
            ) {

                e.done = true;

                hp -= 12;

                combo = 0;

                shake = 20;

                burst(
                    heroX,
                    heroY,
                    20,
                    "#ff2bd6"
                );
            }

        }
    );


    /*
       사라진 적 제거
    */

    enemies =
        enemies.filter(
            e => {

                if (e.bounce) {

                    return (
                        e.life > 0
                    );
                }

                return !e.done;
            }
        );


    /* =================================================
       HERO ATTACK MOVEMENT
    ================================================= */

    const attacker =
        enemies.find(
            e =>
                !e.done &&
                !e.bounce &&
                e.type === "ATTACK"
        );


    if (
        attacker &&
        action === "ATTACK"
    ) {

        const dx =
            attacker.x -
            heroX;

        const dy =
            attacker.y -
            heroY;


        const distance =
            Math.hypot(
                dx,
                dy
            ) || 1;


        heroX +=
            dx /
            distance *
            3 *
            dt;

        heroY +=
            dy /
            distance *
            3 *
            dt;
    }


    /* =================================================
       DEFENSE MOVEMENT
    ================================================= */

    if (
        action === "DEFENSE" &&
        beatPhase < .45
    ) {

        heroX =
            550 +
            Math.sin(
                now * .012
            ) * 35;

        heroY =
            435 +
            Math.cos(
                now * .01
            ) * 12;

    }

    else {

        heroX +=
            (550 - heroX) *
            .015 *
            dt;

        heroY +=
            (435 - heroY) *
            .015 *
            dt;
    }


    /*
       화면 밖으로 나가지 않도록 제한
    */

    heroX =
        Math.max(
            100,
            Math.min(
                W - 100,
                heroX
            )
        );

    heroY =
        Math.max(
            130,
            Math.min(
                H - 180,
                heroY
            )
        );


    /* =================================================
       PARTICLES
    ================================================= */

    particles.forEach(
        p => {

            p.x +=
                p.vx * dt;

            p.y +=
                p.vy * dt;

            p.vy +=
                .1 * dt;

            p.life -=
                .025 * dt;
        }
    );


    particles =
        particles.filter(
            p =>
                p.life > 0
        );


    pulse *=
        Math.pow(
            .9,
            dt
        );

    shake *=
        Math.pow(
            .88,
            dt
        );

    flash *=
        Math.pow(
            .85,
            dt
        );


    draw(now);

    updateUI();


    /*
       GAME OVER
    */

    if (hp <= 0) {

        running = false;

        stopMusic();

        document
            .getElementById("start")
            .style.display =
            "flex";

        document
            .getElementById("title")
            .textContent =
            "GAME OVER";

        document
            .getElementById("startButton")
            .textContent =
            "RESTART";

        return;
    }


    requestAnimationFrame(
        loop
    );
}


/* =================================================
   DRAW
================================================= */

function draw(now) {

    ctx.save();


    /*
       SCREEN SHAKE
    */

    ctx.translate(

        (Math.random() - .5)
        * shake,

        (Math.random() - .5)
        * shake
    );


    /* =================================================
       BACKGROUND
    ================================================= */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#080014"
    );

    gradient.addColorStop(
        1,
        "#18002d"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =================================================
       DISCO GRID
    ================================================= */

    ctx.globalAlpha = .4;

    for (
        let x = -100;
        x < W + 100;
        x += 55
    ) {

        ctx.strokeStyle =
            Math.round(
                x / 55
            ) % 2

            ? "#ff00aa"
            : "#00eaff";

        ctx.beginPath();

        ctx.moveTo(
            x,
            350
        );

        ctx.lineTo(
            x - 160,
            700
        );

        ctx.stroke();
    }


    for (
        let y = 350;
        y < 700;
        y += 42
    ) {

        ctx.strokeStyle =
            "#ffe600";

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }


    ctx.globalAlpha = 1;


    /* =================================================
       BEAT RING
    ================================================= */

    ctx.strokeStyle =
        `rgba(255,234,0,${
            .2 +
            .35 * pulse
        })`;

    ctx.lineWidth =
        5 +
        8 * pulse;


    ctx.beginPath();

    ctx.arc(
        heroX,
        heroY,
        90 +
        35 * pulse,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /* =================================================
       CIRCULAR JUDGEMENT RANGE
    ================================================= */

    const target =
        enemies.find(
            e =>
                !e.done &&
                !e.hit
        );


    let ringColor =
        "#ffffff";

    let targetInRange = false;


    if (target) {

        const distance =
            Math.hypot(
                target.x - heroX,
                target.y - heroY
            );


        targetInRange =
            distance <=
            JUDGE_RADIUS;


        if (targetInRange) {

            if (
                target.type ===
                action
            ) {

                ringColor =
                    target.type ===
                    "ATTACK"

                    ? "#ffe600"
                    : "#00eaff";

            }

            else {

                ringColor =
                    "#ff2bd6";
            }
        }

        else {

            ringColor =
                target.type ===
                "ATTACK"

                ? "#ffe600"
                : "#00eaff";
        }
    }


    /*
       바깥쪽 원
    */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        heroX,
        heroY,
        JUDGE_RADIUS,
        0,
        Math.PI * 2
    );

    ctx.lineWidth =
        targetInRange
        ? 7
        : 4;

    ctx.strokeStyle =
        ringColor;

    ctx.shadowBlur =
        targetInRange
        ? 40
        : 20;

    ctx.shadowColor =
        ringColor;

    ctx.globalAlpha =
        targetInRange
        ? 1
        : .65;

    ctx.stroke();

    ctx.restore();


    /*
       안쪽 보조 원
    */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        heroX,
        heroY,
        JUDGE_RADIUS - 8,
        0,
        Math.PI * 2
    );

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        ringColor;

    ctx.globalAlpha = .25;

    ctx.stroke();

    ctx.restore();


    /*
       판정 가능 상태 강조
    */

    if (targetInRange) {

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            heroX,
            heroY,
            JUDGE_RADIUS + 9,
            0,
            Math.PI * 2
        );

        ctx.lineWidth = 3;

        ctx.strokeStyle =
            "#ffffff";

        ctx.shadowBlur = 45;

        ctx.shadowColor =
            ringColor;

        ctx.globalAlpha = .9;

        ctx.stroke();

        ctx.restore();
    }


    /* =================================================
       ENEMIES
    ================================================= */

    enemies.forEach(
        e => {

            if (e.done)
                return;


            const color =
                e.type === "ATTACK"
                ? "#ff2bd6"
                : "#00eaff";


            ctx.save();

            ctx.translate(
                e.x,
                e.y
            );

            ctx.rotate(
                e.rot
            );


            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                color;

            ctx.fillStyle =
                color;


            /*
               DIAMOND
            */

            ctx.beginPath();

            ctx.moveTo(
                0,
                -27
            );

            ctx.lineTo(
                27,
                0
            );

            ctx.lineTo(
                0,
                27
            );

            ctx.lineTo(
                -27,
                0
            );

            ctx.closePath();

            ctx.fill();


            ctx.fillStyle =
                "white";

            ctx.font =
                "900 10px Arial";

            ctx.textAlign =
                "center";


            ctx.fillText(
                e.type ===
                "ATTACK"

                ? "ATTACK"
                : "BLOCK",

                0,
                45
            );


            ctx.restore();
        }
    );


    /* =================================================
       HERO
    ================================================= */

    ctx.save();

    ctx.translate(
        heroX,
        heroY
    );


    const heroColor =
        action === "DEFENSE"
        ? "#00eaff"
        : "#ffe600";


    ctx.shadowBlur =
        35;

    ctx.shadowColor =
        heroColor;

    ctx.fillStyle =
        heroColor;


    /*
       BODY
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        29 +
        pulse * 5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       HEAD
    */

    ctx.fillStyle =
        "#15001f";


    ctx.beginPath();

    ctx.arc(
        0,
        -5,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       ATTACK EFFECT
    */

    if (
        action === "ATTACK"
    ) {

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 9;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            58,
            -.8,
            .8
        );

        ctx.stroke();
    }


    /*
       DEFENSE SHIELD
    */

    if (
        action === "DEFENSE"
    ) {

        ctx.strokeStyle =
            "#00eaff";

        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            65,
            -1.2,
            1.2
        );

        ctx.stroke();
    }


    ctx.restore();


    /* =================================================
       PARTICLES
    ================================================= */

    particles.forEach(
        p => {

            ctx.globalAlpha =
                p.life;

            ctx.fillStyle =
                p.color;

            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );
        }
    );


    ctx.globalAlpha = 1;


    /* =================================================
       FLASH
    ================================================= */

    if (flash > .01) {

        ctx.fillStyle =
            `rgba(255,255,255,${
                flash * .18
            })`;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }


    /* =================================================
       BEAT CURSOR
    ================================================= */

    const elapsed =
        now -
        startTime;


    const phase =
        (elapsed % BEAT_MS) /
        BEAT_MS;


    const cursorX =
        W * .09 +
        phase *
        W * .82;


    beatCursor.style.left =
        cursorX + "px";


    ctx.restore();
}

</script>
