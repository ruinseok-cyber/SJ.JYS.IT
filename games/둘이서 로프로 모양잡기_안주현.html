<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>둘이서 로프로 모양잡기</title>
<style>
  :root { --bg:#10131a; --panel:#181d27; --line:#2a3342; --text:#eef3f8; --muted:#9eabbc; --accent:#62d9ff; --good:#62e58c; --warn:#ffd166; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#1b2330 0,#10131a 55%,#0b0e13 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(1120px,96vw);height:min(900px,96vh);display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:center;justify-content:space-between;background:rgba(24,29,39,.92);border:1px solid var(--line);border-radius:16px;padding:12px 18px;box-shadow:0 14px 50px rgba(0,0,0,.25)}
  .title{font-weight:800;letter-spacing:.04em;font-size:18px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
  .stats{display:flex;gap:18px;align-items:center}.stat{text-align:center;min-width:74px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
  #targetPanel{display:flex;align-items:center;gap:14px;background:rgba(24,29,39,.92);border:1px solid var(--line);border-radius:16px;padding:10px 16px}
  #targetCanvas{width:112px;height:80px;background:#0d1118;border-radius:10px;border:1px solid #2a3444}
  #targetText{flex:1}.goal{font-size:14px;font-weight:700}.hint{font-size:12px;color:var(--muted);margin-top:3px}
  #gameWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #game{display:block;width:min(760px,78vh);height:min(760px,78vh);max-width:100%;max-height:100%;background:#0b0f15;border:1px solid #2a3342;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.4)}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .card{pointer-events:auto;background:rgba(16,19,26,.95);border:1px solid #394454;border-radius:18px;padding:24px 30px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.5);max-width:460px;width:90%}
  .card h1{margin:0 0 8px;font-size:26px}.card p{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:12px}
  button{border:0;border-radius:10px;padding:11px 20px;background:var(--accent);color:#071018;font-weight:800;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  footer{text-align:center;color:#718096;font-size:11px;padding-bottom:2px}
  kbd{background:#222a36;border:1px solid #3a4657;border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:#dce5ef}
  .matchbar{height:5px;border-radius:5px;background:#232b38;overflow:hidden;margin-top:8px}.matchfill{height:100%;width:0;background:var(--good);transition:width .08s}

  /* 스코어보드 스타일 */
  .scoreboard{margin:14px 0;background:#131720;border:1px solid #2a3444;border-radius:12px;padding:10px 14px}
  .scoreboard-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;text-align:left}
  .score-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
  .score-table th{color:var(--muted);padding:4px 6px;border-bottom:1px solid #2a3444;font-weight:600}
  .score-table td{padding:6px;border-bottom:1px solid #1c2330;color:#dce5ef}
  .score-table tr:last-child td{border-bottom:none}
  .rank-1{color:#ffd166;font-weight:700}
  .rank-2{color:#dce5ef;font-weight:700}
  .rank-3{color:#cd7f32;font-weight:700}

  /* 이름 입력창 스타일 */
  .save-box{margin:14px 0;display:flex;gap:8px;justify-content:center}
  .save-box input{background:#0d1118;border:1px solid #3a4657;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;outline:none;width:160px;text-align:center}
  .save-box input:focus{border-color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="title">🏃‍➡️둘이서 로프로 모양잡기🏃</div></div>
    <div class="stats">
      <div class="stat"><b id="score">0 / 3</b><span>SCORE</span></div>
      <div class="stat"><b id="time">00:00.0</b><span>TIME</span></div>
      <div class="stat"><b id="match">0%</b><span>MATCH</span></div>
    </div>
  </header>

  <section id="targetPanel">
    <canvas id="targetCanvas" width="224" height="160"></canvas>
    <div id="targetText">
      <div class="goal" id="goalTitle">목표 도형</div>
      <div class="hint">P1 <kbd>W A S D</kbd> · P2 <kbd>↑ ↓ ← →</kbd> · 줄이 꼬이거나 겹치지 않고 직선상태를 유지하자!</div>
      <div class="matchbar"><div class="matchfill" id="matchFill"></div></div>
    </div>
  </section>

  <div id="gameWrap">
    <canvas id="game" width="760" height="760"></canvas>
    <div id="overlay">
      <div class="card" id="startCard">
        <h1>🏃‍➡️둘이서 로프로 모양잡기🏃</h1>
        <p>둘이서 협동해서 로프 양 끝을 잡고 3×3 기둥을 이용해 상단의 목표 도형을 만들자!<br>줄이 꼬이거나 겹치지 않고 직선상태를 유지하자!</p>
        
        <div class="scoreboard">
          <div class="scoreboard-title">🏆 명예의 전당 (BEST 3)</div>
          <table class="score-table">
            <thead>
              <tr><th>순위</th><th>이름</th><th style="text-align:right">기록</th></tr>
            </thead>
            <tbody id="leaderboardBody">
              <tr><td colspan="3" style="text-align:center;color:var(--muted)">기록이 없습니다</td></tr>
            </tbody>
          </table>
        </div>

        <button id="startBtn">게임 시작</button>
      </div>

      <div class="card" id="endCard" style="display:none">
        <h1>CLEAR!</h1>
        <p id="finalText"></p>
        <div id="finalTimeDisplay" style="margin-top:8px;font-size:28px;font-weight:900;color:#62d9ff"></div>
        
        <div class="save-box" id="saveBox">
          <input type="text" id="playerName" placeholder="팀 이름 (최대 8자)" maxlength="8">
          <button id="saveBtn">기록 저장</button>
        </div>

        <button id="restartBtn" style="margin-top:6px;">다시 하기</button>
      </div>
    </div>
  </div>
  <footer>로프는 Verlet + 거리 제약 + 기둥 충돌로 실시간 시뮬레이션됩니다.</footer>
</div>

<script>
(() => {
'use strict';
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const tCanvas = document.getElementById('targetCanvas'), tctx = tCanvas.getContext('2d');
const W=760,H=760;
const scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), matchEl=document.getElementById('match'), fillEl=document.getElementById('matchFill');
const startCard=document.getElementById('startCard'), endCard=document.getElementById('endCard');
const finalText=document.getElementById('finalText'), finalTimeDisplay=document.getElementById('finalTimeDisplay');
const leaderboardBody = document.getElementById('leaderboardBody');
const saveBox = document.getElementById('saveBox');
const playerNameInput = document.getElementById('playerName');
const saveBtn = document.getElementById('saveBtn');

let running=false, score=0, startTime=0, totalStartTime=0, finishTime=0, last=0, matchedSince=0, locked=false;
let lastElapsedMs = 0;

const map={x:95,y:70,w:570,h:620};
const posts=[];
for(let r=0;r<3;r++)for(let c=0;c<3;c++) posts.push({x:190+c*190,y:190+r*190,r:22});

const COMPLETION_BAND=24;
const COMPLETION_INNER_OFFSET=0;

// BOWTIE 항목이 삭제된 Shapes 리스트
const shapes=[
 {name:'ZIG-ZAG', pts:[0,1,4,3,6,7,8]},
 {name:'STAIR', pts:[0,1,4,5,8]},
 {name:'WAVE', pts:[0,3,1,4,2,5,8]},
 {name:'FRAME-L', pts:[0,1,2,5,8,7,6]},
 {name:'U-TURN', pts:[0,1,2,5,8]},
 {name:'HOOK', pts:[6,3,0,1,4,7]},
 {name:'TRIANGLE-M', pts:[6,1,8,7]},
 {name:'DIAMOND-CORNER', pts:[1,3,7,5,2]},
 {name:'HOUSE', pts:[6,3,1,5,8,7,6]},
 {name:'SPIRAL', pts:[0,2,8,6,4]}
];

let remainingShapes = [];
let target = null;

function shuffleShapes() {
  remainingShapes = [...shapes];
  for (let i = remainingShapes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [remainingShapes[i], remainingShapes[j]] = [remainingShapes[j], remainingShapes[i]];
  }
}

const p1={x:130,y:500,vx:0,vy:0,rad:15,label:'P1'};
const p2={x:630,y:260,vx:0,vy:0,rad:15,label:'P2'};

const N=46, rope=[];
let restLen=0;

function initRope(){
  rope.length=0;
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    const x=p1.x+(p2.x-p1.x)*t, y=p1.y+(p2.y-p1.y)*t;
    rope.push({x,y,px:x,py:y});
  }
  restLen=(Math.hypot(p2.x-p1.x)*2.30)/(N-1);
}
initRope();

function chooseTarget(){
  if (remainingShapes.length === 0) shuffleShapes();
  target = remainingShapes.pop();
  drawTarget();
  matchedSince=0; locked=false;
}

function resetPlayers(){
  p1.x=135;p1.y=520;p1.vx=p1.vy=0;
  p2.x=625;p2.y=240;p2.vx=p2.vy=0;
  initRope();
}

function loadLeaderboard(){
  const data = localStorage.getItem('rope_coop_scores');
  return data ? JSON.parse(data) : [];
}

function updateLeaderboardUI(){
  const scores = loadLeaderboard();
  leaderboardBody.innerHTML = '';
  if(scores.length === 0){
    leaderboardBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted)">등록된 기록이 없습니다</td></tr>';
    return;
  }
  scores.slice(0, 3).forEach((item, index) => {
    const tr = document.createElement('tr');
    const rankClass = `rank-${index+1}`;
    tr.innerHTML = `
      <td class="${rankClass}">${index + 1}위</td>
      <td>${item.name}</td>
      <td style="text-align:right">${formatTime(item.time)}</td>
    `;
    leaderboardBody.appendChild(tr);
  });
}

function saveScore(name, ms){
  const scores = loadLeaderboard();
  scores.push({ name: name || 'ANONYMOUS', time: ms });
  scores.sort((a, b) => a.time - b.time);
  const top3 = scores.slice(0, 3);
  localStorage.setItem('rope_coop_scores', JSON.stringify(top3));
  updateLeaderboardUI();
}

function startGame(){
  score=0; startTime=performance.now();
  totalStartTime=startTime; finishTime=0; last=startTime; running=true; matchedSince=0; locked=false;
  scoreEl.textContent='0 / 3'; startCard.style.display='none'; endCard.style.display='none'; finalTimeDisplay.textContent='';
  shuffleShapes();
  resetPlayers(); chooseTarget(); requestAnimationFrame(loop);
}

function finish(){
  finishTime=performance.now();
  running=false;
  lastElapsedMs=Math.max(0, finishTime-(totalStartTime||startTime));
  const shown=formatTime(lastElapsedMs);
  timeEl.textContent=shown;
  finalText.innerHTML='3개의 도형을 모두 완성했습니다.';
  finalTimeDisplay.textContent='총 걸린 시간  '+shown;
  
  saveBox.style.display = 'flex';
  playerNameInput.value = '';
  endCard.style.display='block';
}

saveBtn.onclick = () => {
  const name = playerNameInput.value.trim();
  if(!name) { alert('이름을 입력해주세요!'); return; }
  saveScore(name, lastElapsedMs);
  saveBox.style.display = 'none';
  alert('기록이 저장되었습니다!');
};

document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=()=>{
  startCard.style.display='block';
  endCard.style.display='none';
  updateLeaderboardUI();
};

const pressedKeys=new Set();
const keys1={up:false,down:false,left:false,right:false};
const keys2={up:false,down:false,left:false,right:false};

function refreshKeys(){
  keys1.up=pressedKeys.has('KeyW');
  keys1.down=pressedKeys.has('KeyS');
  keys1.left=pressedKeys.has('KeyA');
  keys1.right=pressedKeys.has('KeyD');
  keys2.up=pressedKeys.has('ArrowUp');
  keys2.down=pressedKeys.has('ArrowDown');
  keys2.left=pressedKeys.has('ArrowLeft');
  keys2.right=pressedKeys.has('ArrowRight');
}

document.addEventListener('keydown',e=>{
  const allowed=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  if(allowed.includes(e.code)){
    pressedKeys.add(e.code);
    refreshKeys();
    e.preventDefault();
  }
});
document.addEventListener('keyup',e=>{
  pressedKeys.delete(e.code);
  refreshKeys();
});
window.addEventListener('blur',()=>{
  pressedKeys.clear();
  refreshKeys();
});

function updatePlayer(p,keys,dt){
  let dx=0,dy=0;
  if(keys.left) dx-=1;
  if(keys.right) dx+=1;
  if(keys.up) dy-=1;
  if(keys.down) dy+=1;

  if(dx||dy){
    const len=Math.hypot(dx,dy);
    dx/=len;dy/=len;
    const speed=285;

    const other=(p===p1)?p2:p1;
    const ox=p.x-other.x, oy=p.y-other.y;
    const od=Math.hypot(ox,oy)||1;
    const nx=ox/od, ny=oy/od;
    const outward=dx*nx+dy*ny;
    const maxD=restLen*(N-1)*0.985;

    if(od>=maxD && outward>0){
      dx-=outward*nx;
      dy-=outward*ny;
    }else{
      const wanted=od + (dx*nx+dy*ny)*speed*dt;
      if(wanted>maxD && outward>0){
        const allowed=Math.max(0,maxD-od)/Math.max(1,speed*dt);
        dx-=outward*nx;
        dy-=outward*ny;
        const tang=Math.hypot(dx,dy)||1;
        dx*=Math.min(1,allowed/tang);
        dy*=Math.min(1,allowed/tang);
      }
    }

    p.vx=dx*speed;
    p.vy=dy*speed;
    p.x+=dx*speed*dt;
    p.y+=dy*speed*dt;
  }else{
    p.vx=0;
    p.vy=0;
  }

  p.x=Math.max(map.x+p.rad,Math.min(map.x+map.w-p.rad,p.x));
  p.y=Math.max(map.y+p.rad,Math.min(map.y+map.h-p.rad,p.y));
}

function resolvePlayerPost(p,q){
  const min=p.rad+q.r;
  let dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
  if(d>=min)return false;
  const nx=dx/(d||1),ny=dy/(d||1);
  p.x=q.x+nx*min;
  p.y=q.y+ny*min;
  const vn=p.vx*nx+p.vy*ny;
  if(vn<0){p.vx-=vn*nx;p.vy-=vn*ny;}
  return true;
}

function resolveRopeSegmentPost(a,b,q){
  const rr=q.r+8;
  const abx=b.x-a.x, aby=b.y-a.y;
  const ab2=abx*abx+aby*aby;
  let t=ab2>1e-9 ? ((q.x-a.x)*abx+(q.y-a.y)*aby)/ab2 : 0;
  t=Math.max(0,Math.min(1,t));
  let cx=a.x+abx*t, cy=a.y+aby*t;
  let dx=cx-q.x,dy=cy-q.y,d=Math.hypot(dx,dy);

  if(d>=rr)return false;

  let nx,ny;
  if(d>1e-6){
    nx=dx/d;ny=dy/d;
  }else{
    const sl=Math.hypot(abx,aby);
    if(sl>1e-6){nx=-aby/sl;ny=abx/sl;}
    else{nx=1;ny=0;}
  }

  const push=rr-d+0.8;
  const wa=(t<0.5)?0.65:0.35;
  const wb=1-wa;

  if(a!==rope[0] && a!==rope[N-1]){
    a.x+=nx*push*wa;
    a.y+=ny*push*wa;
  }
  if(b!==rope[0] && b!==rope[N-1]){
    b.x+=nx*push*wb;
    b.y+=ny*push*wb;
  }

  for(const v of [a,b]){
    if(v===rope[0] || v===rope[N-1])continue;
    v.px=v.x;
    v.py=v.y;
  }
  return true;
}

function hardRopePostCollision(a){
  for(const q of posts){
    const rr=q.r+8;
    let dx=a.x-q.x,dy=a.y-q.y,d=Math.hypot(dx,dy);
    if(d<rr){
      const nx=dx/(d||1),ny=dy/(d||1);
      a.x=q.x+nx*(rr+0.8);
      a.y=q.y+ny*(rr+0.8);
      a.px=a.x;
      a.py=a.y;
    }
  }
}

function satisfyEndpoints(){
  rope[0].x=p1.x;rope[0].y=p1.y;
  rope[N-1].x=p2.x;rope[N-1].y=p2.y;
}

function solveConstraints(){
  for(let pass=0;pass<18;pass++){
    satisfyEndpoints();

    for(let i=0;i<N-1;i++){
      const a=rope[i],b=rope[i+1];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.001;
      const err=d-restLen;
      const nx=dx/d,ny=dy/d;
      const corr=err*0.42;
      if(i!==0){a.x+=nx*corr;a.y+=ny*corr;}
      if(i+1!==N-1){b.x-=nx*corr;b.y-=ny*corr;}
    }

    for(let i=0;i<N-1;i++){
      const a=rope[i],b=rope[i+1];
      for(const q of posts) resolveRopeSegmentPost(a,b,q);
    }

    for(let i=1;i<N-1;i++) hardRopePostCollision(rope[i]);
  }
  satisfyEndpoints();
}

function simulate(dt){
  const steps=12;
  const subDt=dt/steps;

  for(let step=0;step<steps;step++){
    updatePlayer(p1,keys1,subDt);
    updatePlayer(p2,keys2,subDt);

    for(const q of posts){
      resolvePlayerPost(p1,q);
      resolvePlayerPost(p2,q);
    }

    for(let i=1;i<N-1;i++){
      const a=rope[i];
      const vx=(a.x-a.px)*0.42;
      const vy=(a.y-a.py)*0.42;
      a.px=a.x;a.py=a.y;
      a.x+=vx;
      a.y+=vy+980*subDt*subDt;
    }

    solveConstraints();
    for(let i=0;i<N-1;i++){
      for(const q of posts) resolveRopeSegmentPost(rope[i],rope[i+1],q);
    }
    satisfyEndpoints();
  }
}

function distToSegment(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y;
  const ab2 = abx * abx + aby * aby;
  if (ab2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x) * abx + (p.y - a.y) * aby) / ab2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + abx * t), p.y - (a.y + aby * t));
}

function isIntersecting(p1, p2, p3, p4) {
  function ccw(a, b, c) {
    return (c.y - a.y) * (b.x - a.x) > (b.y - a.y) * (c.x - a.x);
  }
  return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
}

function checkRopeTensionAndStructure() {
  for (let i = 0; i < N - 3; i++) {
    for (let j = i + 2; j < N - 1; j++) {
      if (i === 0 && j === N - 2) continue;
      if (isIntersecting(rope[i], rope[i+1], rope[j], rope[j+1])) {
        return { isOK: false, reason: '꼬임' };
      }
    }
  }

  const knots = [p1];
  for (let i = 1; i < N - 1; i++) {
    for (const q of posts) {
      if (Math.hypot(rope[i].x - q.x, rope[i].y - q.y) <= q.r + 14) {
        const lastKnot = knots[knots.length - 1];
        if (Math.hypot(rope[i].x - lastKnot.x, rope[i].y - lastKnot.y) > 25) {
          knots.push(rope[i]);
        }
      }
    }
  }
  knots.push(p2);

  const maxSegmentDeviation = 28; 
  for (let i = 1; i < N - 1; i++) {
    const pt = rope[i];
    let minDistanceToPath = Infinity;

    for (let k = 0; k < knots.length - 1; k++) {
      const d = distToSegment(pt, knots[k], knots[k+1]);
      if (d < minDistanceToPath) minDistanceToPath = d;
    }

    if (minDistanceToPath > maxSegmentDeviation) {
      return { isOK: false, reason: '구부러짐' };
    }
  }

  return { isOK: true, reason: '' };
}

function computeMatch(){
  const postRadius=posts[0].r;
  const inner=postRadius+COMPLETION_INNER_OFFSET;
  const outer=postRadius+COMPLETION_BAND;

  const active=new Map();
  for(const q of posts) active.set(q,0);

  for(const a of rope){
    let bestPost=null,bestD=Infinity;
    for(const q of posts){
      const d=Math.hypot(a.x-q.x,a.y-q.y);
      if(d>=inner && d<=outer && d<bestD){
        bestD=d;
        bestPost=q;
      }
    }
    if(bestPost) active.set(bestPost,1);
  }

  const targetPts=target.pts.map(i=>posts[i]);
  if(!targetPts.length)return 0;

  let covered=0;
  for(const q of targetPts){
    if(active.get(q)) covered++;
  }
  return covered/targetPts.length;
}

function updateMatch(dt){
  const m=computeMatch();
  const tensionCheck=checkRopeTensionAndStructure();
  const pct=Math.round(m*100);
  
  if (pct > 0 && !tensionCheck.isOK) {
    matchEl.textContent = pct + '% (' + tensionCheck.reason + ')';
    fillEl.style.background = 'var(--warn)';
  } else {
    matchEl.textContent = pct + '%';
    fillEl.style.background = 'var(--good)';
  }
  fillEl.style.width=pct+'%';

  if(m>=.85 && tensionCheck.isOK){
    if(!matchedSince)matchedSince=performance.now();
    if(performance.now()-matchedSince>650 && !locked){ 
      locked=true; 
      score++; 
      scoreEl.textContent=score+' / 3'; 
      successSound();
      if(score>=3){setTimeout(finish,500);} else {setTimeout(()=>{resetPlayers();chooseTarget();},650);}
    }
  } else matchedSince=0;
}

function successSound(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(520,ac.currentTime);o.frequency.exponentialRampToValueAtTime(880,ac.currentTime+.18);
  g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.02,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.3);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.32);
}

function drawTarget(){
  tctx.clearRect(0,0,224,160);tctx.fillStyle='#0d1118';tctx.fillRect(0,0,224,160);
  const ox=32,oy=18,dx=80,dy=62;
  tctx.strokeStyle='#293241';tctx.lineWidth=1;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){tctx.beginPath();tctx.arc(ox+j*dx,oy+i*dy,7,0,Math.PI*2);tctx.stroke();}
  const pts=target.pts.map(i=>({x:ox+(i%3)*dx,y:oy+Math.floor(i/3)*dy}));
  tctx.strokeStyle='#62d9ff';tctx.lineWidth=6;tctx.lineCap='round';tctx.lineJoin='round';
  tctx.beginPath();pts.forEach((p,i)=>i?tctx.lineTo(p.x,p.y):tctx.moveTo(p.x,p.y));tctx.stroke();
  tctx.fillStyle='#eef3f8';for(const p of pts){tctx.beginPath();tctx.arc(p.x,p.y,3,0,Math.PI*2);tctx.fill();}
  document.getElementById('goalTitle').textContent='목표 도형 · '+target.name;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d1118';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#253040';ctx.lineWidth=2;ctx.strokeRect(map.x,map.y,map.w,map.h);
  
  ctx.strokeStyle='rgba(70,86,108,.14)';ctx.lineWidth=1;
  for(let x=map.x+38;x<map.x+map.w;x+=38){ctx.beginPath();ctx.moveTo(x,map.y);ctx.lineTo(x,map.y+map.h);ctx.stroke();}
  for(let y=map.y+38;y<map.y+map.h;y+=38){ctx.beginPath();ctx.moveTo(map.x,y);ctx.lineTo(map.x+map.w,y);ctx.stroke();}
  
  const tp=target ? target.pts.map(i=>posts[i]) : [];
  if(tp.length){
    ctx.save();
    ctx.globalAlpha=.22;
    ctx.strokeStyle='#62d9ff';
    ctx.lineWidth=12;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.setLineDash([10,7]);
    ctx.beginPath();
    tp.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  ctx.save();
  for(const q of posts){
    ctx.beginPath();
    ctx.arc(q.x,q.y,q.r+COMPLETION_BAND,0,Math.PI*2);
    ctx.arc(q.x,q.y,q.r+COMPLETION_INNER_OFFSET,0,Math.PI*2,true);
    ctx.fillStyle='rgba(98,217,255,.075)';
    ctx.fill('evenodd');

    ctx.beginPath();
    ctx.arc(q.x,q.y,q.r+COMPLETION_BAND,0,Math.PI*2);
    ctx.strokeStyle='rgba(98,217,255,.42)';
    ctx.lineWidth=2;
    ctx.setLineDash([7,6]);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();

  for(let i=0;i<posts.length;i++){
    const q=posts[i];ctx.beginPath();ctx.arc(q.x,q.y,q.r+5,0,Math.PI*2);ctx.fillStyle='#151c27';ctx.fill();
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle='#343e4d';ctx.fill();ctx.strokeStyle='#526174';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(q.x-6,q.y-6,5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();
  }

  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=14;
  ctx.beginPath();rope.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  const grd=ctx.createLinearGradient(p1.x,p1.y,p2.x,p2.y);grd.addColorStop(0,'#ffcf5c');grd.addColorStop(.5,'#ff8a65');grd.addColorStop(1,'#62d9ff');
  ctx.strokeStyle=grd;ctx.lineWidth=8;ctx.beginPath();rope.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  drawPlayer(p1,'#ffcf5c');drawPlayer(p2,'#62d9ff');
}

function drawPlayer(p,c){
  ctx.beginPath();ctx.arc(p.x,p.y,p.rad+4,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();
  ctx.beginPath();ctx.arc(p.x,p.y,p.rad,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();
  ctx.fillStyle='#10131a';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.label,p.x,p.y);
}

function formatTime(ms){const s=ms/1000;return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0');}

function loop(now){
  if(!running)return;
  const dt=Math.min(.033,(now-last)/1000);last=now;
  try{
    simulate(dt);
    updateMatch(dt);
    draw();
  }catch(err){
    console.error('Runtime error:',err);
    running=false;
    matchEl.textContent='0%';
    fillEl.style.width='0%';
    return;
  }
  timeEl.textContent=formatTime(now-startTime);
  requestAnimationFrame(loop);
}

updateLeaderboardUI();
shuffleShapes();chooseTarget();draw();
})();
</script>
