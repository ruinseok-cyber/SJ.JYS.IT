<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2D 레이싱</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131a;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#wrap{position:relative;width:min(94vw,520px);height:min(94vh,780px)}
canvas{width:100%;height:100%;display:block;background:#252a31;border-radius:18px;box-shadow:0 15px 50px #0008}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,20,.94);border:1px solid #ffffff18;border-radius:18px;padding:28px;text-align:center;color:#fff;z-index:10}
.panel.hidden{display:none}
.panel h1,.panel h2,.panel p,.panel div{color:#fff}
.panel p{color:#e7ebf2}
.custom-box{width:min(420px,94%);max-height:78%;overflow:auto;background:#1a2230;border:1px solid #ffffff20;border-radius:16px;padding:18px;box-shadow:0 10px 30px #0008}
.custom-box h2{margin-top:0}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.swatch{min-height:58px;border:2px solid #ffffff30;border-radius:10px;color:#fff!important;font-size:12px;font-weight:bold;text-shadow:0 1px 3px #000;cursor:pointer}
.swatch.locked{filter:grayscale(.25);opacity:.85}
.swatch.selected{border-color:#fff;box-shadow:0 0 0 3px #36e1a166}
.balance{font-weight:bold;color:#ffd95a!important;margin:6px}

h1{font-size:42px;margin:0 0 10px}
h2{font-size:32px;margin:0 0 8px}
p{color:#cbd2df}
button{border:0;border-radius:12px;padding:13px 25px;font-size:17px;font-weight:bold;cursor:pointer;margin:6px;background:#fff;color:#111}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}

.records{width:min(400px,95%);margin:14px 0;max-height:260px;overflow:auto;background:#202632;border-radius:12px;padding:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #ffffff12;font-size:14px}
.row:last-child{border:0}
.row .rank{font-weight:bold;width:32px;color:#ffd95a;text-align:left}
.row .name{font-weight:bold;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.row .score{font-weight:800;color:#36e1a1;margin-right:10px}
.row .date{font-size:11px;color:#8e9ab0}

#hud{position:absolute;top:16px;left:18px;right:18px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;font-weight:bold;text-shadow:0 2px 3px #000;z-index:5}
#touch{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none;z-index:5}
.pad{display:flex;gap:12px}
.touchbtn{pointer-events:auto;width:64px;height:64px;border-radius:50%;background:#ffffff2b;border:1px solid #fff5;color:#fff;font-size:28px;display:grid;place-items:center;user-select:none}
.small{font-size:13px;color:#aeb7c7}

.shield-hud{font-size:16px;font-weight:800;color:#9fdcff!important;text-shadow:0 2px 4px #000;opacity:.85;margin:2px 0}

.settings-box{min-width:min(390px,90vw)}
.settings-icon{
  position:absolute!important;
  top:14px!important;
  left:14px!important;
  width:42px!important;
  height:42px!important;
  padding:0!important;
  border-radius:50%!important;
  font-size:20px!important;
  line-height:42px!important;
  z-index:20;
}
.setting-row{width:100%;margin:16px 0;text-align:left}
.setting-row label{display:block;font-weight:700;color:#fff!important;margin-bottom:8px}
#masterVolume{width:100%;accent-color:#36e1a1}
.check-row{display:flex!important;align-items:center;gap:10px;cursor:pointer}
.check-row input{width:20px;height:20px;accent-color:#36e1a1}

/* Nickname Input Modal UI */
.nickname-box{background:#1e293b;border:1px solid #36e1a188;border-radius:14px;padding:16px;margin:12px 0;width:100%}
.nickname-box input{
  width:80%;padding:10px 14px;border-radius:8px;border:1px solid #475569;
  background:#0f172a;color:#fff;font-size:16px;text-align:center;margin-top:8px;outline:none;
}
.nickname-box input:focus{border-color:#36e1a1}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="520" height="780"></canvas>
<div id="hud">
  <span id="score">점수 0</span>
  <span id="coinHud">🪙 0</span>
  <span id="shieldHud" class="shield-hud">⭐ 별 : 0/5</span>
  <span id="speed">속도 0</span>
</div>

<div id="touch">
  <div class="pad"><div class="touchbtn" id="left">◀</div><div class="touchbtn" id="right">▶</div></div>
</div>

<div class="panel" id="start">
  <h1>🏁 2D 레이싱</h1>
  <p>장애물을 피하면서 최대한 오래 달리세요!</p>
  <p class="small">PC: ← → 또는 A / D &nbsp; · &nbsp; 모바일: 아래 버튼</p>
  <button id="startBtn">게임 시작</button>
  <button id="customBtn">🎨 차량 꾸미기</button>
  <button id="settingsBtn" class="settings-icon" aria-label="설정" title="설정">⚙️</button>
  <button id="recordsBtn">🏆 기록 보기</button>
</div>

<div class="panel hidden" id="over">
  <h2>💥 GAME OVER</h2>
  <p id="finalScore"></p>
  
  <div id="nicknameSection" class="nickname-box hidden">
    <div style="color:#ffd95a;font-weight:bold;font-size:15px;">🎉 TOP 10 랭킹 달성!</div>
    <p class="small" style="margin:4px 0;">기록에 남길 닉네임을 입력하세요</p>
    <input type="text" id="playerNickname" maxlength="8" placeholder="닉네임 (최대 8자)">
  </div>

  <button id="retryBtn">다시 달리기</button>
  <button id="mainBtn">🏠 메인 화면</button>
  <button id="overRecordsBtn">🏆 기록 보기</button>
</div>

<div class="panel hidden" id="custom">
  <div class="custom-box">
    <h2>🎨 차량 커스터마이징</h2>
    <div class="balance">🪙 보유 코인: <span id="customCoins">0</span></div>
    <div id="customPreview"></div>
    <div class="swatches" id="swatches"></div>
    <p class="small">코인을 모아 원하는 차량 색상을 구매하세요.</p>
    <button id="closeCustom">닫기</button>
  </div>
</div>

<div class="panel hidden" id="settings">
  <div class="custom-box settings-box">
    <h2>⚙️ 사운드 설정</h2>
    <div class="setting-row">
      <label for="bgmVolume">🎵 BGM 음량 <span id="bgmValue">55%</span></label>
      <input id="bgmVolume" type="range" min="0" max="100" value="55">
    </div>
    <div class="setting-row">
      <label for="sfxVolume">🔊 효과음 음량 <span id="sfxValue">75%</span></label>
      <input id="sfxVolume" type="range" min="0" max="100" value="75">
    </div>
    <div class="setting-row">
      <label class="check-row">
        <input id="muteSound" type="checkbox">
        <span>🔇 전체 음소거</span>
      </label>
    </div>
    <p class="small">BGM과 효과음의 음량을 따로 조절할 수 있어요.</p>
    <button id="closeSettings">닫기</button>
  </div>
</div>

<div class="panel hidden" id="records">
  <h2>🏆 명예의 전당</h2>
  <div class="records" id="recordList"></div>
  <button id="closeRecords">닫기</button>
</div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const road={x:90,w:340};
let running=false,score=0,distance=0,speed=5,roadOffset=0,last=0,spawn=0;
let pendingScore=0;

// ===== Sound Engine =====
const soundSettings={
  bgm:Number(localStorage.getItem('soundBgm') ?? 55),
  sfx:Number(localStorage.getItem('soundSfx') ?? 75),
  muted:localStorage.getItem('soundMuted')==='1'
};
let audioCtx=null, masterGain=null, musicGain=null, sfxGain=null, musicTimer=null, musicStep=0;

function initAudio(){
  if(audioCtx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  audioCtx=new AC();
  masterGain=audioCtx.createGain();
  musicGain=audioCtx.createGain();
  sfxGain=audioCtx.createGain();
  const compressor=audioCtx.createDynamicsCompressor();
  compressor.threshold.value=-18; compressor.knee.value=12; compressor.ratio.value=4; compressor.attack.value=0.003; compressor.release.value=0.2;
  musicGain.connect(masterGain); sfxGain.connect(masterGain); masterGain.connect(compressor); compressor.connect(audioCtx.destination);
  musicGain.gain.value=soundSettings.bgm/100; sfxGain.gain.value=soundSettings.sfx/100;
  updateAudioVolume();
}
function updateAudioVolume(){
  if(!masterGain) return;
  masterGain.gain.value=soundSettings.muted ? 0 : 1;
  if(musicGain) musicGain.gain.value=soundSettings.bgm/100;
  if(sfxGain) sfxGain.gain.value=soundSettings.sfx/100;
}
function unlockAudio(){
  initAudio();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,duration,type='sine',gain=.08,when=0,slideTo=null){
  if(!audioCtx || soundSettings.muted) return;
  const now=audioCtx.currentTime+when, osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,now);
  if(slideTo!==null) osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),now+duration);
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(gain,now+.012); g.gain.exponentialRampToValueAtTime(.0001,now+duration);
  osc.connect(g); g.connect(sfxGain); osc.start(now); osc.stop(now+duration+.02);
}
function noise(duration=.12,gain=.06,when=0){
  if(!audioCtx || soundSettings.muted) return;
  const len=Math.floor(audioCtx.sampleRate*duration), buffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate), data=buffer.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
  const src=audioCtx.createBufferSource(), g=audioCtx.createGain(), now=audioCtx.currentTime+when;
  g.gain.setValueAtTime(gain,now); g.gain.exponentialRampToValueAtTime(.0001,now+duration);
  src.buffer=buffer; src.connect(g); g.connect(sfxGain); src.start(now); src.stop(now+duration+.01);
}
function playCoin(){ unlockAudio(); tone(880,.08,'square',.14); tone(1320,.12,'square',.11,.07); }
function playShield(){ unlockAudio(); tone(440,.12,'sine',.14); tone(660,.2,'sine',.12,.09); }
function playStar(){ unlockAudio(); tone(587.33,.08,'triangle',.15); tone(880,.14,'triangle',.15,.07); }
function playFever(){ unlockAudio(); tone(523,.1,'triangle',.18); tone(659,.1,'triangle',.18,.08); tone(784,.2,'triangle',.18,.16); }
function playCrash(){ unlockAudio(); noise(.22,.28); tone(100,.24,'sawtooth',.18,0,42); }
function playClick(){ unlockAudio(); tone(520,.05,'square',.07); }
function startMusic(){
  unlockAudio();
  if(!audioCtx || musicTimer) return;
  const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
  musicStep=0;
  musicTimer=setInterval(()=>{
    if(!audioCtx || soundSettings.muted) return;
    const n=notes[musicStep%notes.length], now=audioCtx.currentTime, osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type='triangle'; osc.frequency.value=n;
    g.gain.setValueAtTime(.0001,now); g.gain.linearRampToValueAtTime(.075,now+.03); g.gain.exponentialRampToValueAtTime(.0001,now+.34);
    osc.connect(g); g.connect(musicGain); osc.start(now); osc.stop(now+.36);
    if(musicStep%4===0){
      const bass=audioCtx.createOscillator(), bg=audioCtx.createGain();
      bass.type='sine'; bass.frequency.value=n/2;
      bg.gain.setValueAtTime(.0001,now); bg.gain.linearRampToValueAtTime(.045,now+.02); bg.gain.exponentialRampToValueAtTime(.0001,now+.28);
      bass.connect(bg); bg.connect(musicGain); bass.start(now); bass.stop(now+.3);
    }
    musicStep++;
  },380);
}
function stopMusic(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }

let keys={}, obstacles=[], pickups=[], player={x:W/2-23,y:H-135,w:46,h:78};
let shieldTime=0, pickupTimer=0, starCount=0, feverTime=0;

document.addEventListener('keydown',e=>{
  if(document.activeElement.tagName==='INPUT') return;
  keys[e.key.toLowerCase()]=true;
  if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(document.activeElement.tagName==='INPUT') return;
  keys[e.key.toLowerCase()]=false;
});

function bindTouch(id,key){
 const el=document.getElementById(id);
 ['pointerdown'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=true}));
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false}));
}
bindTouch('left','arrowleft');bindTouch('right','arrowright');

function rand(a,b){return Math.random()*(b-a)+a}

function reset(){
 saveCurrentNickname();
 score=0;distance=0;speed=5;roadOffset=0;spawn=0;obstacles=[];pickups=[];shieldTime=0;
 pickupTimer=100; starCount=0;feverTime=0;
 player.x=W/2-player.w/2;
 running=true; last=performance.now();
 document.getElementById('start').classList.add('hidden');
 document.getElementById('over').classList.add('hidden');
 document.getElementById('records').classList.add('hidden');
 requestAnimationFrame(loop);
}

function checkHighscore(s){
  let r=JSON.parse(localStorage.getItem('racingScores')||'[]');
  return r.length < 10 || s > (r[r.length-1]?.score || 0);
}

function gameOver(){
 playCrash(); stopMusic();
 running=false;
 pendingScore=Math.floor(score);
 document.getElementById('finalScore').innerHTML=`최종 점수 <b style="font-size:32px">${pendingScore.toLocaleString()}</b>`;
 
 const nickBox = document.getElementById('nicknameSection');
 if(checkHighscore(pendingScore) && pendingScore > 0){
   nickBox.classList.remove('hidden');
   document.getElementById('playerNickname').value = localStorage.getItem('lastNickname') || '';
 } else {
   nickBox.classList.add('hidden');
   saveScore(pendingScore, localStorage.getItem('lastNickname') || '익명');
 }

 document.getElementById('over').classList.remove('hidden');
}

function saveCurrentNickname(){
  const nickInput = document.getElementById('playerNickname');
  if(!document.getElementById('nicknameSection').classList.contains('hidden') && pendingScore > 0){
    let name = nickInput.value.trim() || '익명';
    localStorage.setItem('lastNickname', name);
    saveScore(pendingScore, name);
    pendingScore = 0;
    document.getElementById('nicknameSection').classList.add('hidden');
  }
}

function saveScore(s, name){
 if(s <= 0) return;
 let r=JSON.parse(localStorage.getItem('racingScores')||'[]');
 r.push({
   name: name.substring(0,8),
   score: s,
   date: new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
 });
 r.sort((a,b)=>b.score-a.score);
 r=r.slice(0,10);
 localStorage.setItem('racingScores',JSON.stringify(r));
}

const colorShop=[
 {name:'민트',color:'#36e1a1',price:0},
 {name:'블루',color:'#3aa7ff',price:50},
 {name:'레드',color:'#ff4f5e',price:100},
 {name:'옐로',color:'#ffd34e',price:150},
 {name:'퍼플',color:'#a86cff',price:200},
 {name:'핑크',color:'#ff6fb5',price:250},
 {name:'화이트',color:'#f2f5f7',price:300},
 {name:'블랙',color:'#252a31',price:400}
];
let ownedColors=JSON.parse(localStorage.getItem('ownedCarColors')||'["#36e1a1"]');
let selectedColor=localStorage.getItem('selectedCarColor')||'#36e1a1';
let coins=Number(localStorage.getItem('racingCoins')||0);

function saveGarage(){
 localStorage.setItem('ownedCarColors',JSON.stringify(ownedColors));
 localStorage.setItem('selectedCarColor',selectedColor);
 localStorage.setItem('racingCoins',String(coins));
}
function renderCustom(){
 document.getElementById('customCoins').textContent=coins.toLocaleString();
 const box=document.getElementById('swatches');
 box.innerHTML=colorShop.map(c=>{
   const owned=ownedColors.includes(c.color), selected=selectedColor===c.color;
   return `<button class="swatch ${owned?'':'locked'} ${selected?'selected':''}"
     style="background:${c.color};" data-color="${c.color}">
     ${selected?'✓ ':''}${c.name}<br>${owned?'보유':c.price+' 🪙'}</button>`;
 }).join('');
 box.querySelectorAll('.swatch').forEach(btn=>btn.onclick=()=>{
   const c=colorShop.find(x=>x.color===btn.dataset.color);
   if(ownedColors.includes(c.color)){selectedColor=c.color;saveGarage();renderCustom();return;}
   if(coins>=c.price){
     coins-=c.price;ownedColors.push(c.color);selectedColor=c.color;
     saveGarage();renderCustom();
   }else{
     alert(`코인이 ${c.price-coins}개 부족해요!`);
   }
 });
}

function showRecords(){
 saveCurrentNickname();
 const r=JSON.parse(localStorage.getItem('racingScores')||'[]');
 const box=document.getElementById('recordList');
 box.innerHTML=r.length?r.map((v,i)=>`
   <div class="row">
     <span class="rank">${i+1}위</span>
     <span class="name">${v.name||'익명'}</span>
     <span class="score">${v.score.toLocaleString()}점</span>
     <span class="date">${v.date}</span>
   </div>`).join(''):'<p style="padding:20px 0;">아직 저장된 기록이 없습니다.</p>';
 document.getElementById('start').classList.add('hidden');
 document.getElementById('over').classList.add('hidden');
 document.getElementById('settings').classList.add('hidden');
 document.getElementById('records').classList.remove('hidden');
}

function spawnObstacle(){
 const types=[
  {color:'#f6c945',w:46,h:72},{color:'#45aaf2',w:48,h:74},
  {color:'#ff5c5c',w:48,h:76},{color:'#9b59b6',w:46,h:70},{color:'#f08a5d',w:50,h:72}
 ];
 const kinds=['sedan','van','truck','taxi'];
 const t=types[Math.floor(Math.random()*types.length)];
 const kind=kinds[Math.floor(Math.random()*kinds.length)];
 const minX=road.x+3, maxX=road.x+road.w-t.w-3;
 const x=minX+Math.random()*Math.max(1,maxX-minX);
 obstacles.push({x:x,y:-100-rand(0,45),w:t.w,h:t.h,color:t.color,kind:kind});
}

function spawnPickup(forcedType=null){
 let type = forcedType;
 if(!type){
   const r = Math.random();
   if(r < 0.55) type = 'coin';
   else if(r < 0.70) type = 'shield';
   else type = 'star';
 }
 const x=road.x+22+Math.random()*(road.w-44);
 pickups.push({x,y:-40,w:34,h:34,type,spin:0});
}

function drawStarShape(ctx, cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
  ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step;
    x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius); ctx.closePath();
}

function pickupHit(a,b){
 const cx=b.x+b.w/2, cy=b.y+b.h/2, px=a.x+a.w/2, py=a.y+a.h/2;
 return Math.hypot(cx-px,cy-py)<Math.min(a.w,a.h)*.55;
}

function drawPickup(p){
 ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);
 if(p.type==='coin'){
   ctx.rotate(Math.sin(p.spin)*.15);
   ctx.fillStyle='#ffd447';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff0a0';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle='#9a6b00';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);
 }else if(p.type==='shield'){
   ctx.fillStyle='#49b7ff';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(14,-10);ctx.lineTo(11,8);ctx.quadraticCurveTo(0,18,-11,8);ctx.lineTo(-14,-10);ctx.closePath();ctx.fill();
   ctx.fillStyle='#e7f8ff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SHIELD',0,1);
 }else if(p.type==='star'){
   ctx.rotate(p.spin*0.8);
   ctx.fillStyle='#ffea00'; ctx.strokeStyle='#ffa000'; ctx.lineWidth=2;
   drawStarShape(ctx, 0, 0, 5, 15, 7);
   ctx.fill(); ctx.stroke();
 }
 ctx.restore();
}

function hit(a,b){
 const pad=5;
 return a.x+pad < b.x+b.w-pad && a.x+a.w-pad > b.x+pad && a.y+pad < b.y+b.h-pad && a.y+a.h-pad > b.y+pad;
}

function drawRoad(){
 ctx.fillStyle='#5b8c45';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#34383e';ctx.fillRect(road.x,0,road.w,H);
 ctx.fillStyle='#e9e9e9';ctx.fillRect(road.x,0,7,H);ctx.fillRect(road.x+road.w-7,0,7,H);
 ctx.fillStyle='#f7f7f7';
 roadOffset=(roadOffset+speed)%70;
 for(let y=-70+roadOffset;y<H;y+=70){
   ctx.fillRect(road.x+112,y,7,38); ctx.fillRect(road.x+222,y,7,38);
 }
}

function drawCar(x,y,w,h,color,kind='player'){
 ctx.save(); ctx.translate(Math.round(x),Math.round(y));
 ctx.lineJoin='round';ctx.lineCap='round';
 const safeColor=(typeof color==='string' && /^#[0-9a-f]{6}$/i.test(color))?color:'#4b86c5';
 ctx.fillStyle='rgba(0,0,0,.25)';
 ctx.beginPath();ctx.ellipse(w/2,h/2+4,w*.45,h*.46,0,0,Math.PI*2);ctx.fill();
 function wheel(px,py){ctx.fillStyle='#15171a';ctx.roundRect(px,py,9,20,3);ctx.fill();ctx.fillStyle='#596067';ctx.roundRect(px+2,py+4,5,12,2);ctx.fill();}
 if(kind==='player'){
   wheel(1,12);wheel(w-10,12);wheel(1,h-35);wheel(w-10,h-35);
   ctx.fillStyle=safeColor;ctx.beginPath();ctx.moveTo(w*.25,3);ctx.quadraticCurveTo(w*.5,-3,w*.75,3);ctx.lineTo(w*.91,21);ctx.quadraticCurveTo(w*.98,39,w*.87,h-9);ctx.quadraticCurveTo(w*.5,h+2,w*.13,h-9);ctx.quadraticCurveTo(w*.02,39,w*.09,21);ctx.closePath();ctx.fill();
   ctx.fillStyle='#142936';ctx.beginPath();ctx.moveTo(w*.29,12);ctx.quadraticCurveTo(w*.5,5,w*.71,12);ctx.lineTo(w*.79,30);ctx.quadraticCurveTo(w*.5,37,w*.21,30);ctx.closePath();ctx.fill();
   ctx.fillStyle='rgba(220,245,255,.32)';ctx.beginPath();ctx.moveTo(w*.34,11);ctx.lineTo(w*.60,9);ctx.lineTo(w*.48,26);ctx.lineTo(w*.28,24);ctx.closePath();ctx.fill();
   ctx.fillStyle='#fff0a5';ctx.fillRect(w*.17,5,10,5);ctx.fillRect(w*.64,5,10,5);ctx.fillStyle='#ff4c4c';ctx.fillRect(w*.17,h-12,10,4);ctx.fillRect(w*.64,h-12,10,4);
   ctx.fillStyle='#242a2f';ctx.fillRect(w*.17,h-6,w*.66,4);

   if(shieldTime>0){
     let alpha=0.4;
     if(shieldTime<=1.5) alpha = Math.sin(Date.now()*0.02) > 0 ? 0.5 : 0.08;
     ctx.save();
     ctx.strokeStyle=`rgba(73, 183, 255, ${alpha + 0.3})`;
     ctx.fillStyle=`rgba(73, 183, 255, ${alpha})`;
     ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(w/2, h/2, w*0.75, h*0.65, 0, 0, Math.PI*2);
     ctx.fill(); ctx.stroke(); ctx.restore();
   }
 }else{
   if(kind==='truck'){
     wheel(1,12);wheel(w-10,12);wheel(1,h-32);wheel(w-10,h-32);ctx.fillStyle=safeColor;ctx.roundRect(6,4,w-12,h-8,6);ctx.fill();ctx.fillStyle='#253844';ctx.roundRect(11,10,w-22,25,4);ctx.fill();ctx.fillStyle='#90a9b5';ctx.fillRect(14,14,w-28,9);ctx.fillStyle='#ffce48';ctx.fillRect(11,h-13,9,5);ctx.fillRect(w-20,h-13,9,5);
   }else if(kind==='van'){
     wheel(1,13);wheel(w-10,13);wheel(1,h-33);wheel(w-10,h-33);ctx.fillStyle=safeColor;ctx.beginPath();ctx.moveTo(7,8);ctx.quadraticCurveTo(w/2,1,w-7,8);ctx.lineTo(w-6,h-7);ctx.lineTo(6,h-7);ctx.closePath();ctx.fill();ctx.fillStyle='#263b47';ctx.roundRect(11,13,w-22,29,4);ctx.fill();ctx.fillStyle='#8ea8b4';ctx.fillRect(14,17,w-28,9);ctx.fillStyle='#ff5555';ctx.fillRect(12,h-14,10,5);ctx.fillRect(w-22,h-14,10,5);
   }else if(kind==='taxi'){
     wheel(1,14);wheel(w-10,14);wheel(1,h-34);wheel(w-10,h-34);ctx.fillStyle=safeColor;ctx.beginPath();ctx.moveTo(8,22);ctx.lineTo(14,9);ctx.quadraticCurveTo(w/2,1,w-14,9);ctx.lineTo(w-8,22);ctx.lineTo(w-7,h-8);ctx.lineTo(7,h-8);ctx.closePath();ctx.fill();ctx.fillStyle='#233a46';ctx.roundRect(14,11,w-28,20,4);ctx.fill();ctx.fillStyle='#fff';ctx.roundRect(w*.35,4,w*.3,5,2);ctx.fill();ctx.fillStyle='#ff4141';ctx.fillRect(12,h-13,9,4);ctx.fillRect(w-21,h-13,9,4);
   }else{
     wheel(1,13);wheel(w-10,13);wheel(1,h-34);wheel(w-10,h-34);ctx.fillStyle=safeColor;ctx.beginPath();ctx.moveTo(w*.2,5);ctx.quadraticCurveTo(w*.5,0,w*.8,5);ctx.lineTo(w*.91,23);ctx.lineTo(w*.86,h-7);ctx.quadraticCurveTo(w*.5,h,w*.14,h-7);ctx.lineTo(w*.09,23);ctx.closePath();ctx.fill();ctx.fillStyle='#263a46';ctx.roundRect(w*.2,10,w*.6,24,5);ctx.fill();ctx.fillStyle='#89a4af';ctx.fillRect(w*.24,14,w*.22,8);ctx.fillRect(w*.54,14,w*.22,8);ctx.fillStyle='#ff5050';ctx.fillRect(w*.15,h-13,10,5);ctx.fillRect(w*.65,h-13,10,5);
   }
 }
 ctx.restore();
}

function draw(){
 ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore();
 drawRoad();
 obstacles.forEach(o=>drawCar(o.x,o.y,o.w,o.h,o.color,o.kind));
 pickups.forEach(drawPickup);
 drawCar(player.x,player.y,player.w,player.h,selectedColor,'player');
 
 document.getElementById('score').textContent='점수 '+Math.floor(score).toLocaleString();
 document.getElementById('speed').textContent='속도 '+Math.floor(speed);
 
 const shieldHud=document.getElementById('shieldHud');
 if(feverTime > 0){
   shieldHud.textContent='🔥 피버타임 '+feverTime.toFixed(1)+'초';
   shieldHud.style.opacity='1'; shieldHud.style.color='#ffea00';
 }else{
   shieldHud.style.color='#9fdcff';
   shieldHud.textContent=shieldTime>0 ? '🛡️ 보호막 '+shieldTime.toFixed(1)+'초' : `⭐ 별 : ${starCount}/5`;
   shieldHud.style.opacity=shieldTime>0 ? '1' : '.9';
 }
 document.getElementById('coinHud').textContent='🪙 '+coins;
}

function loop(t){
 if(!running)return;
 const dt=Math.min((t-last)/16.67,2);last=t;
 if(keys['arrowleft']||keys['a'])player.x-=7*dt;
 if(keys['arrowright']||keys['d'])player.x+=7*dt;
 player.x=Math.max(road.x+10,Math.min(road.x+road.w-player.w-10,player.x));
 speed=Math.min(13,5+distance/1200);
 distance+=speed*dt;
 score+=speed*0.8*dt;

 feverTime=Math.max(0, feverTime-dt/60);

 if(feverTime<=0){
   spawn-=dt;
   if(spawn<=0){ spawnObstacle(); spawn=Math.max(18,42-speed*2.2)+rand(-9,14); }
   pickupTimer-=dt;
   if(pickupTimer<=0){ spawnPickup(); pickupTimer=rand(110,210); }
 }else{
   pickupTimer-=dt;
   if(pickupTimer<=0){ spawnPickup('coin'); pickupTimer=rand(10,20); }
 }

 shieldTime=Math.max(0, shieldTime-dt/60);
 const currentSpeed=speed;
 obstacles.forEach(o=>o.y+=currentSpeed*dt*1.15);
 pickups.forEach(p=>{p.y+=currentSpeed*dt*1.05;p.spin+=0.12*dt;});
 obstacles=obstacles.filter(o=>o.y<H+120);
 pickups=pickups.filter(p=>{
   if(pickupHit(player,p)){
     if(p.type==='coin'){ coins++;score+=100;saveGarage();playCoin(); }
     if(p.type==='shield'){ shieldTime=5; playShield(); }
     if(p.type==='star'){
       playStar();
       if(feverTime<=0){
         starCount++;
         if(starCount>=5){ starCount=0; feverTime=7; playFever(); }
       }
     }
     return false;
   }
   return p.y<H+80;
 });
 for(const o of obstacles)if(hit(player,o)){
   if(shieldTime>0){o.y=H+200;}
   else {gameOver();break}
 }
 draw();
 requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=()=>{unlockAudio();updateAudioVolume();startMusic();playClick();reset();};
document.getElementById('retryBtn').onclick=()=>{unlockAudio();updateAudioVolume();startMusic();playClick();reset();};
document.getElementById('recordsBtn').onclick=showRecords;
document.getElementById('overRecordsBtn').onclick=showRecords;

document.getElementById('customBtn').onclick=()=>{
  renderCustom();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('records').classList.add('hidden');
  document.getElementById('settings').classList.add('hidden');
  document.getElementById('custom').classList.remove('hidden');
};

document.getElementById('closeCustom').onclick=()=>{
  document.getElementById('custom').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};

document.getElementById('mainBtn').onclick=()=>{
  saveCurrentNickname();
  unlockAudio(); updateAudioVolume(); startMusic(); playClick();
  running=false;
  document.getElementById('over').classList.add('hidden');
  document.getElementById('records').classList.add('hidden');
  document.getElementById('custom').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};

document.getElementById('settingsBtn').onclick=()=>{ openAudioSettings(); };
function openAudioSettings(){
  renderAudioSettings();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('custom').classList.add('hidden');
  document.getElementById('records').classList.add('hidden');
  document.getElementById('settings').classList.remove('hidden');
}
function renderAudioSettings(){
  document.getElementById('bgmVolume').value=soundSettings.bgm;
  document.getElementById('sfxVolume').value=soundSettings.sfx;
  document.getElementById('muteSound').checked=soundSettings.muted;
  document.getElementById('bgmValue').textContent=soundSettings.bgm+'%';
  document.getElementById('sfxValue').textContent=soundSettings.sfx+'%';
}

document.getElementById('closeSettings').onclick=()=>{
  playClick();
  document.getElementById('settings').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
document.getElementById('bgmVolume').oninput=(e)=>{
  soundSettings.bgm=Number(e.target.value);
  localStorage.setItem('soundBgm',String(soundSettings.bgm));
  document.getElementById('bgmValue').textContent=soundSettings.bgm+'%';
  initAudio(); updateAudioVolume();
};
document.getElementById('sfxVolume').oninput=(e)=>{
  soundSettings.sfx=Number(e.target.value);
  localStorage.setItem('soundSfx',String(soundSettings.sfx));
  document.getElementById('sfxValue').textContent=soundSettings.sfx+'%';
  initAudio(); updateAudioVolume();
  if(soundSettings.sfx>0) playClick();
};
document.getElementById('muteSound').onchange=(e)=>{
  soundSettings.muted=e.target.checked;
  localStorage.setItem('soundMuted',soundSettings.muted?'1':'0');
  initAudio(); updateAudioVolume();
  if(!soundSettings.muted){unlockAudio();startMusic();playClick();}
};

document.getElementById('closeRecords').onclick=()=>{
  document.getElementById('records').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};

saveGarage();
renderAudioSettings();
draw();
</script>
</body>
</html>
