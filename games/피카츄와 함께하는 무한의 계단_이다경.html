<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>피카츄의 무한의 계단 (Pikachu Infinite Stairs)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arcade-font {
            font-family: 'Press Start 2P', cursive;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(to bottom, #0f172a, #1e1b4b);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
            overflow: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Glassmorphism overlays */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(250, 204, 21, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .pikachu-btn {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #422006;
            font-weight: bold;
            border: 3px solid #fef08a;
            box-shadow: 0 4px 0 #a16207, 0 6px 12px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
        }

        .pikachu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #a16207, 0 2px 4px rgba(0,0,0,0.4);
        }

        .pikachu-btn-blue {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0c4a6e;
            border: 3px solid #bae6fd;
            box-shadow: 0 4px 0 #0369a1, 0 6px 12px rgba(0,0,0,0.4);
        }

        .pikachu-btn-blue:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0369a1, 0 2px 4px rgba(0,0,0,0.4);
        }

        .pikachu-btn-red {
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            color: #450a0a;
            border: 3px solid #fecaca;
            box-shadow: 0 4px 0 #991b1b, 0 6px 12px rgba(0,0,0,0.4);
        }

        .pikachu-btn-red:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #991b1b, 0 2px 4px rgba(0,0,0,0.4);
        }

        /* Screen Shake effect for Booster */
        .shake {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Lightning aura animation */
        @keyframes thunderGlow {
            0% { filter: drop-shadow(0 0 5px #facc15); }
            50% { filter: drop-shadow(0 0 25px #fef08a) drop-shadow(0 0 15px #38bdf8); }
            100% { filter: drop-shadow(0 0 5px #facc15); }
        }

        .thunder-active {
            animation: thunderGlow 0.2s infinite;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Top HUD Panel -->
        <div id="hud-panel" class="absolute top-0 left-0 w-full p-4 flex flex-col gap-2 pointer-events-none z-10 hidden">
            <!-- Mode title & Score -->
            <div class="flex justify-between items-center">
                <span id="hud-mode-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-yellow-500 text-slate-900 border border-yellow-200 shadow">일반전</span>
                <div class="text-right">
                    <div id="hud-score" class="text-3xl font-black text-yellow-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] arcade-font">0</div>
                    <div id="hud-sub-info" class="text-xs text-yellow-100/80 font-semibold">최고 기록: <span id="hud-highscore">0</span></div>
                </div>
            </div>

            <!-- Time Bar Gauge -->
            <div id="time-gauge-box" class="w-full bg-slate-900/80 rounded-full h-4 p-0.5 border border-amber-400/50 shadow-inner">
                <div id="time-gauge-bar" class="bg-gradient-to-r from-red-500 via-yellow-400 to-green-400 h-full rounded-full w-full transition-all duration-75"></div>
            </div>

            <!-- Electric Energy Gauge (Booster Meter) -->
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bolt text-yellow-400 animate-bounce"></i>
                <div class="flex-1 bg-slate-900/80 rounded-full h-3 p-0.5 border border-yellow-500/40">
                    <div id="energy-gauge-bar" class="bg-gradient-to-r from-yellow-500 to-amber-300 h-full rounded-full w-0 transition-all duration-150 shadow-[0_0_8px_#facc15]"></div>
                </div>
                <span id="energy-count" class="text-xs font-bold text-yellow-300 w-8 text-right">0/10</span>
            </div>

            <!-- Special Mode Info Overlay (Flag or Speed Run) -->
            <div id="special-status" class="hidden text-center text-sm font-bold bg-slate-900/90 text-yellow-300 rounded-lg py-1 border border-yellow-500/30">
                <!-- Dynamic status inserted via JS -->
            </div>
        </div>

        <!-- Touch Controls overlay for Mobile & On-screen UI -->
        <div id="touch-controls" class="absolute bottom-4 left-0 w-full px-4 flex justify-between items-center z-20 hidden">
            <!-- Change Direction (D Key) -->
            <button id="btn-dir" class="pikachu-btn-blue w-24 h-20 rounded-2xl flex flex-col justify-center items-center active:scale-95 transition-transform">
                <i class="fa-solid fa-right-left text-2xl mb-1"></i>
                <span class="text-xs">방향 전환 [D]</span>
            </button>

            <!-- Flag Action Key (W Key) -->
            <button id="btn-flag" class="pikachu-btn-red w-20 h-20 rounded-2xl hidden flex flex-col justify-center items-center active:scale-95 transition-transform">
                <i class="fa-solid fa-flag text-2xl mb-1"></i>
                <span class="text-xs">깃발 [W]</span>
            </button>

            <!-- Climb Stairs (S Key) -->
            <button id="btn-climb" class="pikachu-btn w-28 h-20 rounded-2xl flex flex-col justify-center items-center active:scale-95 transition-transform">
                <i class="fa-solid fa-shoe-prints text-2xl mb-1"></i>
                <span class="text-xs">계단 오르기 [S]</span>
            </button>
        </div>

        <!-- Main Title / Mode Select Screen -->
        <div id="menu-screen" class="absolute inset-0 z-30 flex flex-col justify-between p-6 glass-panel">
            <div class="text-center mt-6">
                <div class="inline-block px-3 py-1 rounded-full bg-yellow-400/20 text-yellow-300 border border-yellow-400/50 text-xs font-bold mb-2">⚡ POKÉMON INFINITE STAIRS ⚡</div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 tracking-wider drop-shadow-md">
                    피카츄의 무한의 계단
                </h1>
                <p class="text-xs text-yellow-100/70 mt-1">백만볼트 부스터를 터뜨려 최강의 정상에 도전하세요!</p>
            </div>

            <!-- Pikachu Icon Graphic Preview -->
            <div class="flex justify-center my-2">
                <div class="relative w-32 h-32 flex items-center justify-center bg-yellow-400/10 rounded-full border-2 border-yellow-400/30">
                    <div class="text-6xl animate-bounce">⚡🐭</div>
                </div>
            </div>

            <!-- Mode Selection Buttons -->
            <div class="flex flex-col gap-3 my-auto">
                <button onclick="startGame('classic')" class="pikachu-btn py-3 px-4 rounded-xl text-lg flex items-center justify-between">
                    <span><i class="fa-solid fa-infinity mr-2"></i>일반전 (Endless)</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                <button onclick="startGame('flag')" class="pikachu-btn-red py-3 px-4 rounded-xl text-lg flex items-center justify-between">
                    <span><i class="fa-solid fa-flag mr-2"></i>플래그전 (VS AI)</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                <button onclick="startGame('combo')" class="pikachu-btn-blue py-3 px-4 rounded-xl text-lg flex items-center justify-between">
                    <span><i class="fa-solid fa-fire mr-2"></i>콤보 배틀전 (30초)</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                <button onclick="startGame('speed')" class="pikachu-btn py-3 px-4 rounded-xl text-lg flex items-center justify-between bg-gradient-to-r from-emerald-400 to-green-600 text-slate-900 border-green-200">
                    <span><i class="fa-solid fa-stopwatch mr-2"></i>스피드전 (100계단)</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <!-- Key Guide Controls Footer -->
            <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 text-xs text-yellow-100/80">
                <div class="font-bold text-yellow-300 mb-1 flex items-center gap-1">
                    <i class="fa-solid fa-keyboard"></i> 조작법 설명:
                </div>
                <div class="grid grid-cols-2 gap-1 text-[11px]">
                    <div><b>계단 오르기:</b> <span class="bg-slate-700 px-1 rounded text-yellow-300">S</span> 키 또는 <span class="bg-slate-700 px-1 rounded text-yellow-300">↓</span></div>
                    <div><b>방향 전환:</b> <span class="bg-slate-700 px-1 rounded text-yellow-300">D</span> 키 또는 <span class="bg-slate-700 px-1 rounded text-yellow-300">↑</span></div>
                    <div class="col-span-2"><b>깃발 상호작용 (플래그전):</b> <span class="bg-slate-700 px-1 rounded text-yellow-300">W</span> 키로 깃발 잡기/꽂기</div>
                </div>
            </div>
        </div>

        <!-- Game Over Modal Screen -->
        <div id="gameover-screen" class="absolute inset-0 z-30 flex flex-col justify-center items-center p-6 glass-panel hidden">
            <div class="bg-slate-900/90 border-2 border-yellow-400 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
                <div id="gameover-title" class="text-2xl font-black text-red-400 mb-1">GAME OVER</div>
                <p id="gameover-sub" class="text-xs text-gray-300 mb-4">발을 헛디뎠습니다!</p>

                <div class="bg-slate-800/80 rounded-xl p-4 mb-5 border border-slate-700 flex flex-col gap-2">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-400">최종 점수 / 기록:</span>
                        <span id="final-score" class="text-2xl font-bold text-yellow-300 arcade-font">0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-400">모드 최고 기록:</span>
                        <span id="final-best" class="text-yellow-400 font-bold">0</span>
                    </div>
                    <div id="combo-stat" class="flex justify-between items-center text-xs hidden">
                        <span class="text-gray-400">최대 연속 콤보:</span>
                        <span id="final-combo" class="text-cyan-400 font-bold">0 Combo</span>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button onclick="restartGame()" class="pikachu-btn py-3 rounded-xl font-bold text-base w-full">
                        <i class="fa-solid fa-rotate-right mr-2"></i> 다시 도전하기
                    </button>
                    <button onclick="showMenu()" class="pikachu-btn-blue py-2.5 rounded-xl font-bold text-sm w-full">
                        <i class="fa-solid fa-list mr-2"></i> 모드 선택으로
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* Web Audio API Synthesizer for Retro Game Sound Effects */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playStep() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playTurn() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }

            playElectric() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playBooster() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                // High thunder burst
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(1500, now + 0.4);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.5);
            }

            playFlag() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.15);
                });
            }

            playGameOver() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        const sfx = new SoundFX();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Dimensions
        const STAIR_WIDTH = 64;
        const STAIR_HEIGHT = 28;
        const STAIR_DEPTH = 12;

        // Modes: 'classic', 'flag', 'combo', 'speed'
        let currentMode = 'classic';
        let isPlaying = false;
        let isGameOver = false;

        // Player State
        let player = {
            stairIndex: 0,
            dir: 1, // 1: Right, -1: Left
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            electricEnergy: 0,
            isBooster: false,
            boosterStepsLeft: 0,
            hasFlag: false
        };

        // AI Competitor (Flag mode)
        let ai = {
            stairIndex: 0,
            dir: 1,
            x: 0,
            y: 0,
            moveTimer: 0,
            speed: 18, // ticks per step
            hasFlag: false
        };

        // Game Metrics & High Scores
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let timeRemaining = 100; // Percentage or seconds depending on mode
        let speedRunTimer = 0;
        let speedRunStartTime = 0;
        
        let highScores = {
            classic: localStorage.getItem('pika_hs_classic') || 0,
            flag: localStorage.getItem('pika_hs_flag') || 0,
            combo: localStorage.getItem('pika_hs_combo') || 0,
            speed: localStorage.getItem('pika_hs_speed') || 0
        };

        // Stairs array & Particles
        let stairs = []; // {x, y, dir, isElectric, hasFlag, isFlagZone}
        let particles = [];
        let lightningEffects = [];

        // Camera offset for smooth scrolling
        let cameraY = 0;
        let targetCameraY = 0;

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function generateStairs(count = 100) {
            if (stairs.length === 0) {
                // First ground stair
                stairs.push({
                    index: 0,
                    x: canvas.width / 2 - STAIR_WIDTH / 2,
                    y: canvas.height - 180,
                    dir: 1, // Next stair direction
                    isElectric: false,
                    hasFlag: false,
                    isFlagZone: false
                });
            }

            let lastStair = stairs[stairs.length - 1];
            let currentX = lastStair.x;
            let currentY = lastStair.y;
            let currentDir = lastStair.dir;

            for (let i = stairs.length; i < count; i++) {
                // Randomly decide if path turns or continues straight
                if (Math.random() < 0.45) {
                    currentDir = -currentDir;
                }

                currentX += currentDir * (STAIR_WIDTH * 0.65);
                currentY -= STAIR_HEIGHT;

                // Restrict stairs from going too far out of bounds horizontally
                const minX = 40;
                const maxX = canvas.width - STAIR_WIDTH - 40;
                if (currentX < minX) {
                    currentX = minX + 20;
                    currentDir = 1;
                } else if (currentX > maxX) {
                    currentX = maxX - 20;
                    currentDir = -1;
                }

                // Electric stairs: 20% chance
                const isElectric = Math.random() < 0.22 && i > 3;

                // Special stairs for Flag Mode
                let hasFlag = false;
                let isFlagZone = false;
                if (currentMode === 'flag') {
                    if (i === 60) hasFlag = true;
                    if (i === 120) isFlagZone = true;
                }

                stairs.push({
                    index: i,
                    x: currentX,
                    y: currentY,
                    dir: currentDir,
                    isElectric: isElectric,
                    hasFlag: hasFlag,
                    isFlagZone: isFlagZone
                });
            }
        }

        function drawPikachu(ctx, x, y, dir, isElectricMode = false) {
            ctx.save();
            ctx.translate(x, y);

            // Flip horizontally if facing left (-1)
            if (dir === -1) {
                ctx.scale(-1, 1);
            }

            // Booster electric outline/glow
            if (isElectricMode) {
                ctx.shadowColor = '#fef08a';
                ctx.shadowBlur = 20;
            }

            // Tail (Zigzag Thunder Tail)
            ctx.fillStyle = '#b45309';
            ctx.beginPath();
            ctx.moveTo(-12, -10);
            ctx.lineTo(-22, -20);
            ctx.lineTo(-16, -22);
            ctx.lineTo(-28, -38);
            ctx.lineTo(-14, -28);
            ctx.lineTo(-18, -24);
            ctx.lineTo(-10, -14);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.moveTo(-16, -22);
            ctx.lineTo(-28, -38);
            ctx.lineTo(-18, -28);
            ctx.closePath();
            ctx.fill();

            // Body
            ctx.fillStyle = '#facc15'; // Pikachu Yellow
            ctx.beginPath();
            ctx.ellipse(0, -12, 14, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.arc(4, -24, 13, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            // Back Ear
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.ellipse(-2, -38, 4, 12, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1e293b'; // Black tip
            ctx.beginPath();
            ctx.ellipse(-5, -45, 3, 5, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            // Front Ear
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.ellipse(8, -38, 4, 12, Math.PI / 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1e293b'; // Black tip
            ctx.beginPath();
            ctx.ellipse(10, -45, 3, 5, Math.PI / 8, 0, Math.PI * 2);
            ctx.fill();

            // Cheek Red Spot (Electric Sack)
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(10, -20, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(8, -26, 2.5, 0, Math.PI * 2);
            ctx.fill();
            // Eye shine
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(9, -27, 1, 0, Math.PI * 2);
            ctx.fill();

            // Nose & Mouth
            ctx.fillStyle = '#451a03';
            ctx.beginPath();
            ctx.arc(14, -24, 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(12, -21, 2, 0, Math.PI / 2);
            ctx.stroke();

            // Feet
            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.ellipse(4, -2, 5, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(-6, -2, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function createElectricParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    size: Math.random() * 4 + 2,
                    color: Math.random() < 0.5 ? '#fef08a' : '#38bdf8',
                    life: 1.0,
                    decay: Math.random() * 0.05 + 0.03
                });
            }
        }

        function createBoosterThunder(x, y) {
            for (let i = 0; i < 3; i++) {
                lightningEffects.push({
                    x: x + (Math.random() - 0.5) * 60,
                    y: y - 100,
                    targetX: x + (Math.random() - 0.5) * 20,
                    targetY: y + 20,
                    life: 1.0,
                    decay: 0.15
                });
            }
        }

        function updateAndDrawParticles(ctx) {
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y - cameraY, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Lightning Bolts
            for (let i = lightningEffects.length - 1; i >= 0; i--) {
                let l = lightningEffects[i];
                l.life -= l.decay;

                if (l.life <= 0) {
                    lightningEffects.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = l.life;
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 15;

                ctx.beginPath();
                ctx.moveTo(l.x, l.y - cameraY);
                let midX = (l.x + l.targetX) / 2 + (Math.random() - 0.5) * 30;
                let midY = (l.y - cameraY + l.targetY - cameraY) / 2;
                ctx.lineTo(midX, midY);
                ctx.lineTo(l.targetX, l.targetY - cameraY);
                ctx.stroke();
                ctx.restore();
            }
        }

        function startGame(mode) {
            sfx.init();
            currentMode = mode;
            isPlaying = true;
            isGameOver = false;

            // Reset UI
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud-panel').classList.remove('hidden');
            document.getElementById('touch-controls').classList.remove('hidden');

            const modeNames = {
                classic: '일반전',
                flag: '플래그전',
                combo: '콤보 배틀전',
                speed: '스피드전'
            };
            document.getElementById('hud-mode-badge').innerText = modeNames[mode];
            document.getElementById('hud-highscore').innerText = highScores[mode];

            // Reset Flag button visibility
            const btnFlag = document.getElementById('btn-flag');
            if (mode === 'flag') {
                btnFlag.classList.remove('hidden');
            } else {
                btnFlag.classList.add('hidden');
            }

            // Reset Player & Stairs
            stairs = [];
            generateStairs(150);

            player.stairIndex = 0;
            player.dir = 1;
            player.x = stairs[0].x + STAIR_WIDTH / 2;
            player.y = stairs[0].y;
            player.targetX = player.x;
            player.targetY = player.y;
            player.electricEnergy = 0;
            player.isBooster = false;
            player.boosterStepsLeft = 0;
            player.hasFlag = false;

            // Reset AI for Flag mode
            if (mode === 'flag') {
                ai.stairIndex = 0;
                ai.dir = 1;
                ai.x = stairs[0].x + STAIR_WIDTH / 2;
                ai.y = stairs[0].y;
                ai.moveTimer = 0;
                ai.hasFlag = false;
            }

            score = 0;
            combo = 0;
            maxCombo = 0;
            timeRemaining = 100;
            speedRunTimer = 0;
            speedRunStartTime = Date.now();

            cameraY = 0;
            targetCameraY = 0;

            updateHUD();
        }

        function triggerGameOver(reason = '발을 헛디뎠습니다!') {
            if (isGameOver) return;
            isGameOver = true;
            isPlaying = false;
            sfx.playGameOver();

            // Update Highscore
            let finalStat = score;
            if (currentMode === 'speed') {
                finalStat = speedRunTimer.toFixed(2) + 's';
            }

            if (currentMode !== 'speed' && score > highScores[currentMode]) {
                highScores[currentMode] = score;
                localStorage.setItem(`pika_hs_${currentMode}`, score);
            } else if (currentMode === 'speed' && (highScores[currentMode] == 0 || speedRunTimer < highScores[currentMode])) {
                highScores[currentMode] = speedRunTimer.toFixed(2);
                localStorage.setItem('pika_hs_speed', highScores[currentMode]);
            }

            document.getElementById('gameover-sub').innerText = reason;
            document.getElementById('final-score').innerText = finalStat;
            document.getElementById('final-best').innerText = highScores[currentMode] + (currentMode === 'speed' ? 's' : '');

            const comboStat = document.getElementById('combo-stat');
            if (currentMode === 'combo') {
                comboStat.classList.remove('hidden');
                document.getElementById('final-combo').innerText = maxCombo + ' Combo';
            } else {
                comboStat.classList.add('hidden');
            }

            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        function handleStep() {
            if (!isPlaying || player.isBooster) return;

            const currentStair = stairs[player.stairIndex];
            const nextStair = stairs[player.stairIndex + 1];

            if (!nextStair) return;

            // Check if player facing correct direction to reach next stair
            const requiredDir = (nextStair.x > currentStair.x) ? 1 : -1;

            if (player.dir === requiredDir) {
                // Correct step!
                player.stairIndex++;
                score++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;

                sfx.playStep();

                // Check Electric Stair
                if (nextStair.isElectric) {
                    player.electricEnergy++;
                    sfx.playElectric();
                    createElectricParticles(nextStair.x + STAIR_WIDTH / 2, nextStair.y);
                    if (player.electricEnergy >= 10) {
                        activateBooster();
                    }
                }

                // Add time bonus in Classic mode
                if (currentMode === 'classic') {
                    timeRemaining = Math.min(100, timeRemaining + 4);
                }

                // Smooth camera follow target
                targetCameraY = stairs[player.stairIndex].y - (canvas.height - 250);

                // Ensure enough stairs exist
                if (stairs.length - player.stairIndex < 50) {
                    generateStairs(stairs.length + 50);
                }

                // Speed Mode check
                if (currentMode === 'speed' && player.stairIndex >= 100) {
                    triggerGameOver('🎉 100계단 돌파 성공!');
                }

            } else {
                // Wrong direction -> Fall off / Game Over
                createElectricParticles(currentStair.x + STAIR_WIDTH / 2, currentStair.y);
                triggerGameOver('방향 선택 미스!');
            }

            updateHUD();
        }

        function handleTurn() {
            if (!isPlaying || player.isBooster) return;
            player.dir = -player.dir;
            sfx.playTurn();
        }

        function handleFlagAction() {
            if (!isPlaying || currentMode !== 'flag') return;

            const currentStair = stairs[player.stairIndex];

            // Pick up flag
            if (currentStair.hasFlag && !player.hasFlag) {
                player.hasFlag = true;
                currentStair.hasFlag = false;
                sfx.playFlag();
                document.getElementById('special-status').innerText = '🚩 깃발 획득! 120번째 계단에 꽂으세요!';
            } 
            // Plant flag
            else if (currentStair.isFlagZone && player.hasFlag) {
                sfx.playFlag();
                triggerGameOver('👑 플래그전 승리!');
            }
        }

        function activateBooster() {
            player.isBooster = true;
            player.boosterStepsLeft = 20;
            player.electricEnergy = 0;
            sfx.playBooster();

            document.getElementById('game-container').classList.add('shake', 'thunder-active');
            setTimeout(() => {
                document.getElementById('game-container').classList.remove('shake', 'thunder-active');
            }, 1500);
        }

        function updateAI() {
            if (currentMode !== 'flag' || !isPlaying) return;

            ai.moveTimer++;
            if (ai.moveTimer >= ai.speed) {
                ai.moveTimer = 0;

                const nextStair = stairs[ai.stairIndex + 1];
                if (nextStair) {
                    ai.stairIndex++;
                    const currentStair = stairs[ai.stairIndex];

                    // AI flag logic
                    if (currentStair.hasFlag && !ai.hasFlag && !player.hasFlag) {
                        ai.hasFlag = true;
                        currentStair.hasFlag = false;
                        document.getElementById('special-status').innerText = '⚠️ AI 피카츄가 깃발을 선점했습니다!';
                    } else if (currentStair.isFlagZone && ai.hasFlag) {
                        triggerGameOver('💀 AI 피카츄에게 패배했습니다!');
                    }
                }
            }
        }

        function update() {
            if (!isPlaying) return;

            // Handle Booster auto-climbing
            if (player.isBooster) {
                if (Math.random() < 0.6) {
                    player.stairIndex++;
                    score++;
                    player.boosterStepsLeft--;

                    const currStair = stairs[player.stairIndex];
                    if (currStair) {
                        player.dir = currStair.dir;
                        createBoosterThunder(currStair.x + STAIR_WIDTH / 2, currStair.y);
                        createElectricParticles(currStair.x + STAIR_WIDTH / 2, currStair.y);
                    }

                    targetCameraY = stairs[player.stairIndex].y - (canvas.height - 250);

                    if (stairs.length - player.stairIndex < 50) {
                        generateStairs(stairs.length + 50);
                    }

                    if (player.boosterStepsLeft <= 0) {
                        player.isBooster = false;
                    }
                    updateHUD();
                }
            }

            // Smooth Camera Interpolation
            cameraY += (targetCameraY - cameraY) * 0.15;

            // Mode-based Timer Drainage
            if (currentMode === 'classic') {
                const drainRate = 0.25 + (score * 0.003); // Drains faster as score increases
                timeRemaining -= drainRate;
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    triggerGameOver('시간 초과!');
                }
            } else if (currentMode === 'combo') {
                timeRemaining -= 0.05; // 30 seconds count down approximation
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    triggerGameOver(`시간 종료! 최종 점수: ${score}`);
                }
            } else if (currentMode === 'speed') {
                speedRunTimer = (Date.now() - speedRunStartTime) / 1000;
            }

            // AI Update
            updateAI();

            updateHUD();
        }

        function draw() {
            // Clear Background
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            // Render Stairs
            for (let i = Math.max(0, player.stairIndex - 10); i < Math.min(stairs.length, player.stairIndex + 25); i++) {
                const stair = stairs[i];
                const drawY = stair.y - cameraY;

                // Stair Top Surface
                if (stair.isElectric) {
                    ctx.fillStyle = '#facc15'; // Electric Stair Glow
                    ctx.shadowColor = '#fef08a';
                    ctx.shadowBlur = 10;
                } else if (stair.isFlagZone) {
                    ctx.fillStyle = '#ef4444'; // Flag Win Zone
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#334155'; // Normal Stair
                    ctx.shadowBlur = 0;
                }

                ctx.fillRect(stair.x, drawY, STAIR_WIDTH, STAIR_HEIGHT);

                // Stair Front Depth
                ctx.fillStyle = stair.isElectric ? '#ca8a04' : '#1e293b';
                ctx.fillRect(stair.x, drawY + STAIR_HEIGHT, STAIR_WIDTH, STAIR_DEPTH);

                // Stair Border
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 1;
                ctx.strokeRect(stair.x, drawY, STAIR_WIDTH, STAIR_HEIGHT);

                // Draw Flag Item on Stair if present
                if (stair.hasFlag) {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(stair.x + STAIR_WIDTH / 2, drawY - 30);
                    ctx.lineTo(stair.x + STAIR_WIDTH / 2 + 15, drawY - 22);
                    ctx.lineTo(stair.x + STAIR_WIDTH / 2, drawY - 15);
                    ctx.fill();

                    // Flag Pole
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(stair.x + STAIR_WIDTH / 2, drawY);
                    ctx.lineTo(stair.x + STAIR_WIDTH / 2, drawY - 32);
                    ctx.stroke();
                }

                // Draw Flag Zone marker
                if (stair.isFlagZone) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px Jua';
                    ctx.textAlign = 'center';
                    ctx.fillText('👑 승리 지점', stair.x + STAIR_WIDTH / 2, drawY - 10);
                }
            }

            // Draw AI Pikachu (Flag Mode)
            if (currentMode === 'flag' && stairs[ai.stairIndex]) {
                const aiStair = stairs[ai.stairIndex];
                ctx.save();
                ctx.globalAlpha = 0.7; // AI semi-transparent
                drawPikachu(ctx, aiStair.x + STAIR_WIDTH / 2, aiStair.y - cameraY, ai.dir, false);
                ctx.restore();
            }

            // Draw Player Pikachu
            if (stairs[player.stairIndex]) {
                const currStair = stairs[player.stairIndex];
                drawPikachu(ctx, currStair.x + STAIR_WIDTH / 2, currStair.y - cameraY, player.dir, player.isBooster);

                // Draw carried flag over player head
                if (player.hasFlag) {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(currStair.x + STAIR_WIDTH / 2, currStair.y - cameraY - 55);
                    ctx.lineTo(currStair.x + STAIR_WIDTH / 2 + 12, currStair.y - cameraY - 48);
                    ctx.lineTo(currStair.x + STAIR_WIDTH / 2, currStair.y - cameraY - 40);
                    ctx.fill();
                }
            }

            // Update & Render Particles
            updateAndDrawParticles(ctx);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('hud-score').innerText = score;
            
            // Update Time Bar
            const timeBar = document.getElementById('time-gauge-bar');
            const timeBox = document.getElementById('time-gauge-box');

            if (currentMode === 'speed') {
                timeBox.classList.add('hidden');
                document.getElementById('hud-score').innerText = speedRunTimer.toFixed(2) + 's';
            } else {
                timeBox.classList.remove('hidden');
                timeBar.style.width = Math.max(0, timeRemaining) + '%';
            }

            // Update Electric Energy Bar
            const energyBar = document.getElementById('energy-gauge-bar');
            energyBar.style.width = (player.electricEnergy * 10) + '%';
            document.getElementById('energy-count').innerText = `${player.electricEnergy}/10`;

            // Special Mode overlays
            const specialStatus = document.getElementById('special-status');
            if (currentMode === 'flag') {
                specialStatus.classList.remove('hidden');
                if (!player.hasFlag && !ai.hasFlag) {
                    specialStatus.innerText = `🚩 60번째 계단의 깃발을 향해 달리세요! (AI 계단: ${ai.stairIndex})`;
                }
            } else if (currentMode === 'combo') {
                specialStatus.classList.remove('hidden');
                specialStatus.innerText = `🔥 현재 콤보: ${combo} Combo (최대: ${maxCombo})`;
            } else {
                specialStatus.classList.add('hidden');
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();

            if (key === 's' || e.key === 'ArrowDown') {
                handleStep();
            } else if (key === 'd' || e.key === 'ArrowUp') {
                handleTurn();
            } else if (key === 'w') {
                handleFlagAction();
            }
        });

        // Touch Controls Buttons
        document.getElementById('btn-climb').addEventListener('touchstart', (e) => { e.preventDefault(); handleStep(); });
        document.getElementById('btn-climb').addEventListener('click', handleStep);

        document.getElementById('btn-dir').addEventListener('touchstart', (e) => { e.preventDefault(); handleTurn(); });
        document.getElementById('btn-dir').addEventListener('click', handleTurn);

        document.getElementById('btn-flag').addEventListener('touchstart', (e) => { e.preventDefault(); handleFlagAction(); });
        document.getElementById('btn-flag').addEventListener('click', handleFlagAction);

        function restartGame() {
            startGame(currentMode);
        }

        function showMenu() {
            isPlaying = false;
            document.getElementById('hud-panel').classList.add('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        // Start Animation Loop on Load
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
