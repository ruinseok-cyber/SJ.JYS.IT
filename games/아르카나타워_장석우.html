<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아르카나 타워: 영원의 파수꾼 (Arcana Tower)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;
        }
        .title-font {
            font-family: 'Cinzel', 'Noto Sans KR', serif;
        }
        .arcana-glow-text {
            font-family: 'Cinzel', 'Noto Sans KR', serif;
            background: linear-gradient(135deg, #e879f9 0%, #a855f7 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.5));
        }
        .dark-glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glow-border {
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.15), inset 0 0 15px rgba(168, 85, 247, 0.1);
        }
        .shake {
            animation: shake 0.18s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, -2px, 0); }
            20%, 80% { transform: translate3d(4px, 3px, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, -4px, 0); }
            40%, 60% { transform: translate3d(5px, 4px, 0); }
        }
        .event-banner {
            animation: bannerPulse 1.2s infinite alternate;
        }
        @keyframes bannerPulse {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #581c87; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 md:p-4 bg-slate-950 text-slate-100 overflow-hidden select-none">

    <header class="w-full max-w-6xl flex justify-between items-center px-4 py-2.5 dark-glass rounded-2xl z-20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 via-indigo-600 to-slate-900 flex items-center justify-center text-purple-300 text-xl border border-purple-400/30 shadow-lg shadow-purple-900/50">
                <i class="fa-solid fa-hat-wizard"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-extrabold arcana-glow-text leading-none tracking-wider">아르카나 타워</h1>
                <p class="text-[11px] text-purple-300/60 font-medium tracking-tight hidden sm:block">수호 파트너와 함께하는 타이핑 마법</p>
            </div>
        </div>

        <div class="flex items-center space-x-4 md:space-x-8">
            <div class="flex flex-col w-28 sm:w-40">
                <div class="flex justify-between text-xs mb-1 font-bold tracking-wide">
                    <span class="text-rose-400 flex items-center"><i class="fa-solid fa-heart-pulse mr-1 text-[10px]"></i>결계</span>
                    <span id="hp-text" class="text-slate-200">100 / 100</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden p-0.5 border border-rose-500/30">
                    <div id="hp-bar" class="bg-gradient-to-r from-rose-600 via-pink-500 to-purple-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
                </div>
            </div>

            <div class="hidden md:flex space-x-3 text-xs">
                <div class="bg-slate-900/80 px-3 py-1.5 rounded-xl border border-purple-500/20">
                    <span class="text-slate-400 font-medium">웨이브: </span>
                    <span id="wave-display" class="text-purple-300 font-extrabold ml-1">WAVE 1</span>
                </div>
                <div class="bg-slate-900/80 px-3 py-1.5 rounded-xl border border-purple-500/20">
                    <span class="text-slate-400 font-medium">타속: </span>
                    <span id="live-wpm" class="text-cyan-400 font-extrabold ml-1">0 WPM</span>
                </div>
            </div>

            <div class="text-right pl-2">
                <div id="score-display" class="text-2xl md:text-3xl font-black text-amber-400 title-font tracking-wide">0</div>
                <div id="combo-display" class="text-[11px] font-bold text-purple-400 tracking-wider">0 COMBO</div>
            </div>
        </div>
    </header>

    <main id="game-container" class="relative w-full max-w-6xl flex-1 my-2 rounded-2xl overflow-hidden glow-border bg-slate-950 flex flex-col items-center justify-center">
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

        <div id="event-banner" class="hidden absolute top-10 z-20 pointer-events-none event-banner bg-amber-500/20 border border-amber-400/50 backdrop-blur-md px-6 py-2 rounded-full text-amber-300 font-bold text-xs md:text-sm tracking-wider shadow-xl flex items-center space-x-2">
            <i class="fa-solid fa-triangle-exclamation text-amber-400 animate-bounce"></i>
            <span id="event-text">특수 이벤트 몬스터 출현!</span>
        </div>

        <div class="absolute top-3 left-4 z-10 hidden sm:flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-purple-500/20 text-xs font-semibold text-slate-300">
            <span id="mode-badge" class="px-2 py-0.5 rounded bg-purple-900/80 text-purple-200 text-[10px] uppercase tracking-wider border border-purple-500/40">무한 수호</span>
            <span id="time-display" class="text-cyan-300">00:00</span>
        </div>

        <div class="absolute top-3 right-4 z-10 flex items-center space-x-3 text-xs bg-slate-900/80 px-3 py-1.5 rounded-xl border border-purple-500/20 font-bold">
            <span class="text-slate-400">정확도:</span>
            <span id="live-acc" class="text-emerald-400">100%</span>
        </div>

        <!-- Start Screen Modal -->
        <div id="start-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-4 md:p-6 bg-slate-950/95 backdrop-blur-md text-center overflow-y-auto">
            <div class="w-14 h-14 mb-2 rounded-2xl bg-gradient-to-br from-purple-500 via-indigo-600 to-slate-900 p-0.5 border border-purple-400/40 shadow-2xl flex items-center justify-center">
                <i class="fa-solid fa-wand-magic-sparkles text-2xl text-purple-300"></i>
            </div>
            <h2 class="text-2xl md:text-4xl font-extrabold arcana-glow-text mb-1 tracking-wider">아르카나 타워</h2>
            <p class="text-slate-400 text-xs max-w-md mb-4 font-medium">나만의 파수꾼 파트너와 커스텀 단어로 즐기는 타이핑 수호전</p>

            <div class="w-full max-w-lg space-y-3 mb-5 text-left text-xs">
                <!-- 수호 파트너 선택 -->
                <div>
                    <label class="block font-bold text-purple-300 mb-1.5 uppercase tracking-wider"><i class="fa-solid fa-paw mr-1"></i>영혼의 파수꾼 파트너 (Soul Companion)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" data-pet="cat" class="pet-btn active px-3 py-2 rounded-xl border border-purple-500/60 bg-purple-900/40 text-white font-bold transition-all text-center">
                            🐱 아케인 묘묘<br><span class="text-[10px] text-purple-300/70 font-normal">신비로운 현자</span>
                        </button>
                        <button type="button" data-pet="dragon" class="pet-btn px-3 py-2 rounded-xl border border-slate-800 bg-slate-900/60 text-slate-400 font-bold transition-all text-center">
                            🐲 불꽃 드래곤<br><span class="text-[10px] text-slate-500 font-normal">용맹한 용아</span>
                        </button>
                        <button type="button" data-pet="fairy" class="pet-btn px-3 py-2 rounded-xl border border-slate-800 bg-slate-900/60 text-slate-400 font-bold transition-all text-center">
                            🧚‍♀️ 빛의 요정<br><span class="text-[10px] text-slate-500 font-normal">치유의 소울</span>
                        </button>
                    </div>
                </div>

                <!-- 게임 모드 & 난이도 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-purple-300 mb-1 uppercase tracking-wider"><i class="fa-solid fa-gamepad mr-1"></i>게임 모드</label>
                        <select id="mode-select" class="w-full bg-slate-900 border border-purple-500/30 rounded-xl px-2.5 py-1.5 text-white font-bold focus:outline-none">
                            <option value="endless">무한 수호 (Endless)</option>
                            <option value="timeattack">타임 어택 (60s)</option>
                            <option value="boss">보스 레이드 (Boss)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-purple-300 mb-1 uppercase tracking-wider"><i class="fa-solid fa-gauge-high mr-1"></i>난이도</label>
                        <select id="diff-select" class="w-full bg-slate-900 border border-purple-500/30 rounded-xl px-2.5 py-1.5 text-white font-bold focus:outline-none">
                            <option value="easy">🌱 쉬움 (초보자)</option>
                            <option value="normal" selected>⚡ 보통 (표준)</option>
                            <option value="hard">🔥 어려움 (숙련자)</option>
                        </select>
                    </div>
                </div>

                <!-- 나만의 커스텀 단어장 입력 -->
                <div>
                    <label class="block font-bold text-purple-300 mb-1 uppercase tracking-wider"><i class="fa-solid fa-pen-to-square mr-1"></i>나만의 단어장 (쉼표로 구분)</label>
                    <input type="text" id="custom-words-input" placeholder="예: 코딩, 파이썬, 리액트, 타자왕, 단어공부" 
                        class="w-full bg-slate-900 border border-purple-500/30 rounded-xl px-3 py-1.5 text-slate-200 font-medium placeholder-slate-600 focus:outline-none focus:border-purple-400">
                </div>
            </div>

            <button id="start-btn" class="w-full max-w-lg py-3 px-6 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 font-extrabold text-white text-base shadow-lg hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 title-font">
                <i class="fa-solid fa-play"></i>
                <span>수호 시작하기</span>
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-slate-950/95 backdrop-blur-md text-center">
            <div id="result-icon" class="w-14 h-14 mb-2 rounded-2xl bg-purple-950/80 border border-purple-500/40 flex items-center justify-center text-3xl text-purple-400 shadow-xl">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 id="result-title" class="text-3xl font-extrabold arcana-glow-text mb-1 title-font">결계 수호 완료</h2>
            <p id="result-subtitle" class="text-slate-400 text-xs mb-4">아르카나 서버에 당도한 파수꾼의 기록입니다.</p>

            <div class="w-full max-w-md bg-slate-900/80 rounded-xl p-3.5 border border-purple-500/20 mb-5 grid grid-cols-2 gap-2 text-left">
                <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
                    <div class="text-[10px] text-slate-400 font-medium">최종 점수</div>
                    <div id="res-score" class="text-lg font-black text-amber-400 title-font">0</div>
                </div>
                <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
                    <div class="text-[10px] text-slate-400 font-medium">평균 타속</div>
                    <div id="res-wpm" class="text-lg font-black text-cyan-400 title-font">0 WPM</div>
                </div>
                <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
                    <div class="text-[10px] text-slate-400 font-medium">타자 정확도</div>
                    <div id="res-acc" class="text-lg font-black text-emerald-400 title-font">0%</div>
                </div>
                <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
                    <div class="text-[10px] text-slate-400 font-medium">정화한 적</div>
                    <div id="res-kills" class="text-lg font-black text-purple-400 title-font">0 개체</div>
                </div>
            </div>

            <div class="flex space-x-3 w-full max-w-md">
                <button id="restart-btn" class="flex-1 py-3 px-4 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 font-bold text-white text-sm shadow-md hover:brightness-110 active:scale-95 transition-all">
                    <i class="fa-solid fa-rotate-right mr-1"></i>다시 하기
                </button>
                <button id="menu-btn" class="px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 font-bold text-slate-300 text-sm hover:bg-slate-800 active:scale-95 transition-all">
                    설정 메뉴
                </button>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-6xl mt-1 z-20">
        <div class="relative flex items-center">
            <div class="absolute left-4 text-purple-400 text-xl">
                <i class="fa-solid fa-terminal"></i>
            </div>

            <input type="text" id="type-input" placeholder="적의 단어를 입력하여 정화하세요..." 
                autocomplete="off" spellcheck="false"
                class="w-full py-3.5 pl-12 pr-28 rounded-xl bg-slate-900/90 border border-purple-500/40 text-white font-bold text-base md:text-lg focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-500/30 shadow-2xl placeholder-slate-600 transition-all">

            <div class="absolute right-3 flex items-center">
                <span class="text-[11px] text-slate-500 bg-slate-950 px-2.5 py-1 rounded border border-slate-800 font-mono hidden sm:inline">Space / Enter</span>
            </div>
        </div>
    </footer>

    <script>
        // Web Audio Synthesizer
        class SoundEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playKey() {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(450 + Math.random() * 80, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.03);
            }
            playHit() {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.09);
            }
            playEliteHit() {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1100, this.ctx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.16);
            }
            playDamage() {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(130, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const sound = new SoundEngine();

        // Standard Word Sets & Event Hard Words
        const DEFAULT_WORDS = [
            "하늘", "바다", "구름", "햇살", "바람", "나무", "지평선", "무지개", "행복", "희망",
            "사랑", "미소", "용기", "열정", "지혜", "진실", "평화", "우정", "아침", "추억",
            "sky", "ocean", "cloud", "sunlight", "wind", "forest", "nature", "smile", "peace"
        ];

        const HARD_EVENT_WORDS = ["명불허전", "대기만성", "동문서답", "유비무환", "시나브로", "가람슬기", "PHENOMENON", "APOCALYPSE", "EXTRAORDINARY"];

        let canvas, ctx;
        let gameState = 'START';
        let selectedPet = 'cat';

        let score = 0, hp = 100, combo = 0;
        let totalTyped = 0, correctTyped = 0, defeatedCount = 0;
        let startTime = 0, elapsedTime = 0, currentWave = 1, spawnTimer = 0;

        let activeWordPool = [];
        let monsters = [], projectiles = [], particles = [], damageTexts = [];

        // DOM Element Caching
        const gameContainer = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const typeInput = document.getElementById('type-input');
        const hpBar = document.getElementById('hp-bar');
        const hpText = document.getElementById('hp-text');
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const liveWpm = document.getElementById('live-wpm');
        const liveAcc = document.getElementById('live-acc');
        const waveDisplay = document.getElementById('wave-display');
        const timeDisplay = document.getElementById('time-display');
        const modeBadge = document.getElementById('mode-badge');
        const eventBanner = document.getElementById('event-banner');
        const eventText = document.getElementById('event-text');

        window.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            setupUIEvents();
            requestAnimationFrame(gameLoop);
        });

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        function setupUIEvents() {
            const petBtns = document.querySelectorAll('.pet-btn');
            petBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    petBtns.forEach(b => {
                        b.classList.remove('active', 'border-purple-500/60', 'bg-purple-900/40', 'text-white');
                        b.classList.add('border-slate-800', 'bg-slate-900/60', 'text-slate-400');
                    });
                    btn.classList.add('active', 'border-purple-500/60', 'bg-purple-900/40', 'text-white');
                    btn.classList.remove('border-slate-800', 'bg-slate-900/60', 'text-slate-400');
                    selectedPet = btn.dataset.pet;
                });
            });

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);
            document.getElementById('menu-btn').addEventListener('click', showMenu);

            typeInput.addEventListener('input', () => {
                sound.playKey();
                checkTypingHighlight(typeInput.value.trim());
            });

            typeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    processInput(typeInput.value.trim());
                    typeInput.value = '';
                }
            });
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0; hp = 100; combo = 0;
            totalTyped = 0; correctTyped = 0; defeatedCount = 0;
            startTime = Date.now(); elapsedTime = 0;
            currentWave = 1; spawnTimer = 0;

            monsters = []; projectiles = []; particles = []; damageTexts = [];

            // 커스텀 단어 처리
            const customInput = document.getElementById('custom-words-input').value.trim();
            activeWordPool = [...DEFAULT_WORDS];
            if (customInput) {
                const parsed = customInput.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (parsed.length > 0) {
                    activeWordPool = [...parsed, ...activeWordPool];
                }
            }

            const modeVal = document.getElementById('mode-select').value;
            const modeNames = { endless: '무한 수호', timeattack: '타임 어택', boss: '보스 레이드' };
            modeBadge.innerText = modeNames[modeVal] || '무한 수호';

            updateUI();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            typeInput.value = '';
            typeInput.focus();
        }

        function showMenu() {
            gameState = 'START';
            startScreen.classList.remove('hidden');
            gameOverScreen.classList.add('hidden');
            eventBanner.classList.add('hidden');
        }

        function triggerScreenShake() {
            gameContainer.classList.remove('shake');
            void gameContainer.offsetWidth;
            gameContainer.classList.add('shake');
            setTimeout(() => gameContainer.classList.remove('shake'), 180);
        }

        function triggerBanner(msg) {
            eventText.innerText = msg;
            eventBanner.classList.remove('hidden');
            setTimeout(() => eventBanner.classList.add('hidden'), 3000);
        }

        function checkTypingHighlight(text) {
            if (!text) return;
            monsters.forEach(m => {
                if (m.word.startsWith(text)) {
                    m.highlightLength = text.length;
                    m.y = Math.max(0, m.y - 0.4);
                } else {
                    m.highlightLength = 0;
                }
            });
        }

        function processInput(text) {
            if (!text) return;
            totalTyped += text.length;

            let matchedMonster = monsters.find(m => m.word === text);

            if (matchedMonster) {
                correctTyped += text.length;
                combo++;

                let bonusScore = 100 + combo * 20;
                if (matchedMonster.type === 'goblin') bonusScore += 500;
                if (matchedMonster.type === 'golem_elite') bonusScore += 300;

                score += bonusScore;
                if (matchedMonster.type === 'golem_elite') hp = Math.min(100, hp + 15);

                // 마법 발사체 생성
                const towerX = canvas.width / 2;
                const towerY = canvas.height - 40;
                projectiles.push({
                    x: towerX,
                    y: towerY,
                    targetX: matchedMonster.x,
                    targetY: matchedMonster.y,
                    targetMonster: matchedMonster,
                    color: matchedMonster.color,
                    speed: matchedMonster.isElite ? 28 : 24
                });

                if (matchedMonster.isElite) sound.playEliteHit();
                else sound.playHit();

                typeInput.value = '';
            } else {
                combo = 0;
            }

            updateUI();
        }

        function updateUI() {
            hpBar.style.width = `${Math.max(0, hp)}%`;
            hpText.innerText = `${Math.max(0, Math.round(hp))} / 100`;
            scoreDisplay.innerText = score.toLocaleString();
            comboDisplay.innerText = `${combo} COMBO`;
            waveDisplay.innerText = `WAVE ${currentWave}`;

            const durationMinutes = Math.max((Date.now() - startTime) / 1000 / 60, 0.05);
            const wpm = Math.round((correctTyped / 5) / durationMinutes);
            const accuracy = totalTyped > 0 ? Math.round((correctTyped / totalTyped) * 100) : 100;
            liveWpm.innerText = `${wpm} WPM`;
            liveAcc.innerText = `${accuracy}%`;

            const modeVal = document.getElementById('mode-select').value;
            if (modeVal === 'timeattack') {
                const remaining = Math.max(0, 60 - Math.floor(elapsedTime));
                timeDisplay.innerText = `00:${remaining < 10 ? '0' : ''}${remaining}`;
            } else {
                const sec = Math.floor(elapsedTime);
                const min = Math.floor(sec / 60);
                const showSec = sec % 60;
                timeDisplay.innerText = `${min < 10 ? '0' : ''}${min}:${showSec < 10 ? '0' : ''}${showSec}`;
            }
        }

        function spawnMonster() {
            if (gameState !== 'PLAYING') return;

            const modeVal = document.getElementById('mode-select').value;
            const diffVal = document.getElementById('diff-select').value;

            if (modeVal === 'boss' && monsters.length === 0) {
                const bossWord = activeWordPool[Math.floor(Math.random() * activeWordPool.length)];
                monsters.push({
                    x: canvas.width / 2,
                    y: 70,
                    word: bossWord,
                    type: 'boss',
                    hp: 5,
                    maxHp: 5,
                    speed: 0.12,
                    color: '#e879f9',
                    radius: 45,
                    pulse: 0,
                    highlightLength: 0,
                    isElite: true
                });
                return;
            }

            let baseInterval = 120;
            if (diffVal === 'normal') baseInterval = 90;
            if (diffVal === 'hard') baseInterval = 60;

            const speedUp = Math.min(30, Math.floor(elapsedTime / 10) * 3);
            const spawnInterval = Math.max(30, baseInterval - speedUp);

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;

                const isEliteSpawn = Math.random() < 0.14;
                let randomWord = "";
                let chosenType = null;

                if (isEliteSpawn) {
                    const isGoblin = Math.random() < 0.5;
                    if (isGoblin) {
                        chosenType = { type: 'goblin', speed: 1.1, color: '#fbbf24', radius: 24, isElite: true };
                        randomWord = HARD_EVENT_WORDS[Math.floor(Math.random() * HARD_EVENT_WORDS.length)];
                        triggerBanner("⚡ 황금 고블린 출몰! (보너스 500점)");
                    } else {
                        chosenType = { type: 'golem_elite', speed: 0.4, color: '#38bdf8', radius: 34, isElite: true };
                        randomWord = HARD_EVENT_WORDS[Math.floor(Math.random() * HARD_EVENT_WORDS.length)];
                        triggerBanner("🛡️ 사자성어 룬 골렘 출몰! (결계 회복)");
                    }
                } else {
                    const monsterTypes = [
                        { type: 'stalker', speed: 0.55, color: '#a855f7', radius: 22 },
                        { type: 'wraith', speed: 0.7, color: '#38bdf8', radius: 20 },
                        { type: 'golem', speed: 0.35, color: '#f59e0b', radius: 28 }
                    ];
                    chosenType = monsterTypes[Math.floor(Math.random() * monsterTypes.length)];
                    randomWord = activeWordPool[Math.floor(Math.random() * activeWordPool.length)];
                }

                if (monsters.some(m => m.word === randomWord)) return;

                const x = 80 + Math.random() * (canvas.width - 160);
                const y = -35;

                let diffSpeedMult = 0.85;
                if (diffVal === 'normal') diffSpeedMult = 1.1;
                if (diffVal === 'hard') diffSpeedMult = 1.5;

                monsters.push({
                    x: x,
                    y: y,
                    word: randomWord,
                    type: chosenType.type,
                    hp: 1,
                    speed: chosenType.speed * diffSpeedMult,
                    color: chosenType.color,
                    radius: chosenType.radius,
                    pulse: Math.random() * Math.PI,
                    highlightLength: 0,
                    isElite: !!chosenType.isElite
                });
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            const durationMinutes = Math.max((Date.now() - startTime) / 1000 / 60, 0.1);
            const wpm = Math.round((correctTyped / 5) / durationMinutes);
            const accuracy = totalTyped > 0 ? Math.round((correctTyped / totalTyped) * 100) : 100;

            document.getElementById('res-score').innerText = score.toLocaleString();
            document.getElementById('res-wpm').innerText = `${wpm} WPM`;
            document.getElementById('res-acc').innerText = `${accuracy}%`;
            document.getElementById('res-kills').innerText = `${defeatedCount} 개체`;

            gameOverScreen.classList.remove('hidden');
            eventBanner.classList.add('hidden');
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'PLAYING') {
                elapsedTime = (Date.now() - startTime) / 1000;
                currentWave = Math.floor(elapsedTime / 20) + 1;

                const modeVal = document.getElementById('mode-select').value;
                if (modeVal === 'timeattack' && elapsedTime >= 60) {
                    endGame();
                    return;
                }

                spawnMonster();

                // 몬스터 업데이트 & 렌더링
                for (let i = monsters.length - 1; i >= 0; i--) {
                    const m = monsters[i];
                    m.y += m.speed;
                    m.pulse += 0.05;

                    if (m.y >= canvas.height - 50) {
                        hp -= (m.type === 'boss' ? 40 : 15);
                        sound.playDamage();
                        triggerScreenShake();
                        createExplosion(m.x, m.y, '#f43f5e');
                        monsters.splice(i, 1);
                        updateUI();

                        if (hp <= 0) endGame();
                        continue;
                    }

                    drawDetailedMonster(m);
                }

                // 발사체 업데이트
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    const dx = p.targetX - p.x;
                    const dy = p.targetY - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 22) {
                        p.targetMonster.hp--;
                        triggerScreenShake();
                        createExplosion(p.targetX, p.targetY, p.color);

                        let addTxt = `+${100 + combo * 20}`;
                        if (p.targetMonster.type === 'goblin') addTxt = "+500 BONUS!";
                        if (p.targetMonster.type === 'golem_elite') addTxt = "+HEAL 15";
                        addDamageText(p.targetX, p.targetY, addTxt);

                        if (p.targetMonster.hp <= 0) {
                            const idx = monsters.indexOf(p.targetMonster);
                            if (idx !== -1) {
                                monsters.splice(idx, 1);
                                defeatedCount++;
                            }
                        }

                        projectiles.splice(i, 1);
                    } else {
                        p.x += (dx / dist) * p.speed;
                        p.y += (dy / dist) * p.speed;
                        drawProjectile(p);
                    }
                }

                updateParticles();
                updateDamageTexts();
                drawTowerAndCompanion();
            }

            requestAnimationFrame(gameLoop);
        }

        function drawDetailedMonster(m) {
            ctx.save();
            ctx.translate(m.x, m.y);

            ctx.shadowBlur = m.isElite ? 22 : 14;
            ctx.shadowColor = m.color;

            const pulse = Math.sin(m.pulse) * 3;

            if (m.type === 'stalker') {
                // 그림자 추적자 (Shadow Stalker)
                ctx.fillStyle = "#a855f7";
                ctx.beginPath();
                ctx.moveTo(0, -22 - pulse);
                ctx.quadraticCurveTo(18, -10, 15, 15);
                ctx.quadraticCurveTo(0, 8, -15, 15);
                ctx.quadraticCurveTo(-18, -10, 0, -22 - pulse);
                ctx.fill();

                // 안광
                ctx.fillStyle = "#f43f5e";
                ctx.beginPath();
                ctx.arc(-5, -4, 3, 0, Math.PI * 2);
                ctx.arc(5, -4, 3, 0, Math.PI * 2);
                ctx.fill();
            } else if (m.type === 'wraith') {
                // 공허의 망령 (Void Wraith)
                ctx.fillStyle = "#38bdf8";
                ctx.beginPath();
                ctx.arc(0, -5, 18 + pulse, 0, Math.PI, true);
                ctx.lineTo(18, 18);
                ctx.quadraticCurveTo(9, 10, 0, 18);
                ctx.quadraticCurveTo(-9, 10, -18, 18);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#030712";
                ctx.beginPath();
                ctx.arc(-6, -5, 3, 0, Math.PI * 2);
                ctx.arc(6, -5, 3, 0, Math.PI * 2);
                ctx.fill();
            } else if (m.type === 'goblin') {
                // 황금 고블린 (Golden Goblin)
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath();
                ctx.arc(0, -2, 18 + pulse, 0, Math.PI * 2);
                ctx.fill();

                // 귀
                ctx.beginPath();
                ctx.moveTo(-15, -10); ctx.lineTo(-28, -20); ctx.lineTo(-12, 0);
                ctx.moveTo(15, -10); ctx.lineTo(28, -20); ctx.lineTo(12, 0);
                ctx.fill();

                // 보물 자루
                ctx.fillStyle = "#d97706";
                ctx.beginPath();
                ctx.arc(12, 10, 8, 0, Math.PI * 2);
                ctx.fill();
            } else if (m.type === 'golem_elite') {
                // 룬 갑주 골렘 (Rune Armored Golem)
                ctx.fillStyle = "#0284c7";
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    const r = 26 + pulse;
                    const px = r * Math.cos(angle);
                    const py = r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#e0f2fe";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("ᚱ", 0, 0);
            } else if (m.type === 'boss') {
                // 코스믹 드레이크 (Cosmic Dragon Boss)
                ctx.fillStyle = "#c084fc";
                // 날개
                ctx.beginPath();
                ctx.moveTo(-10, 0); ctx.lineTo(-45, -25); ctx.lineTo(-25, 15);
                ctx.moveTo(10, 0); ctx.lineTo(45, -25); ctx.lineTo(25, 15);
                ctx.fill();

                // 용의 머리
                ctx.beginPath();
                ctx.arc(0, 0, 28 + pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#fef08a";
                ctx.beginPath();
                ctx.arc(-8, -6, 4, 0, Math.PI * 2);
                ctx.arc(8, -6, 4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = m.color;
                ctx.beginPath();
                ctx.arc(0, 0, m.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 단어 표지판
            ctx.shadowBlur = 0;
            ctx.font = "bold 15px 'Noto Sans KR', sans-serif";
            const textWidth = ctx.measureText(m.word).width;

            ctx.fillStyle = m.isElite ? "rgba(30, 27, 75, 0.95)" : "rgba(3, 7, 18, 0.9)";
            ctx.roundRect(-textWidth / 2 - 10, -m.radius - 30, textWidth + 20, 26, 6);
            ctx.fill();

            ctx.strokeStyle = m.highlightLength > 0 ? "#4ade80" : (m.isElite ? "#fbbf24" : "rgba(168, 85, 247, 0.4)");
            ctx.lineWidth = m.isElite ? 2 : 1.5;
            ctx.stroke();

            const typedPart = m.word.substring(0, m.highlightLength);
            const remainingPart = m.word.substring(m.highlightLength);

            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            const startX = -textWidth / 2;

            ctx.fillStyle = "#4ade80";
            ctx.fillText(typedPart, startX, -m.radius - 17);

            const typedWidth = ctx.measureText(typedPart).width;
            ctx.fillStyle = m.isElite ? "#fef08a" : "#f3f4f6";
            ctx.fillText(remainingPart, startX + typedWidth, -m.radius - 17);

            ctx.restore();
        }

        function drawTowerAndCompanion() {
            const towerX = canvas.width / 2;
            const towerY = canvas.height - 30;

            ctx.save();
            // 수호 타워
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#a855f7";

            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 40);
            ctx.lineTo(canvas.width, canvas.height - 40);
            ctx.strokeStyle = "rgba(168, 85, 247, 0.3)";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(towerX, towerY, 14, 0, Math.PI * 2);
            ctx.fillStyle = "#c084fc";
            ctx.fill();

            // 영혼의 파수꾼 파트너 (Companion Pet)
            const petX = towerX + 45;
            const petY = towerY - 5;
            const bob = Math.sin(Date.now() / 250) * 3;

            ctx.shadowBlur = 12;
            ctx.shadowColor = combo > 5 ? "#4ade80" : "#e879f9";

            if (selectedPet === 'cat') {
                // 아케인 묘묘
                ctx.fillStyle = "#a855f7";
                ctx.beginPath(); ctx.arc(petX, petY + bob, 12, 0, Math.PI * 2); ctx.fill();
                // 귀
                ctx.beginPath();
                ctx.moveTo(petX - 10, petY - 5 + bob); ctx.lineTo(petX - 14, petY - 18 + bob); ctx.lineTo(petX - 2, petY - 10 + bob);
                ctx.moveTo(petX + 10, petY - 5 + bob); ctx.lineTo(petX + 14, petY - 18 + bob); ctx.lineTo(petX + 2, petY - 10 + bob);
                ctx.fill();
            } else if (selectedPet === 'dragon') {
                // 불꽃 드래곤
                ctx.fillStyle = "#f43f5e";
                ctx.beginPath(); ctx.arc(petX, petY + bob, 13, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath(); ctx.arc(petX - 4, petY - 3 + bob, 3, 0, Math.PI * 2); ctx.arc(petX + 4, petY - 3 + bob, 3, 0, Math.PI * 2); ctx.fill();
            } else {
                // 빛의 요정
                ctx.fillStyle = "#38bdf8";
                ctx.beginPath(); ctx.arc(petX, petY + bob, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "rgba(224, 242, 254, 0.7)";
                ctx.beginPath(); ctx.ellipse(petX - 12, petY + bob, 8, 4, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(petX + 12, petY + bob, 8, 4, -Math.PI / 4, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();
        }

        function drawProjectile(p) {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;

            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: p.x,
                    y: p.y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: Math.random() * 3 + 1,
                    color: p.color,
                    life: 12
                });
            }

            ctx.restore();
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 22; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 4 + 1.5,
                    color: color,
                    life: 25
                });
            }
        }

        function addDamageText(x, y, text) {
            damageTexts.push({
                x: x,
                y: y,
                text: text,
                alpha: 1.0,
                vy: -1.2
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life--;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.life / 25;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        function updateDamageTexts() {
            for (let i = damageTexts.length - 1; i >= 0; i--) {
                const dt = damageTexts[i];
                dt.y += dt.vy;
                dt.alpha -= 0.03;

                if (dt.alpha <= 0) {
                    damageTexts.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = dt.alpha;
                    ctx.font = "bold 16px 'Cinzel', sans-serif";
                    ctx.fillStyle = "#fbbf24";
                    ctx.textAlign = "center";
                    ctx.fillText(dt.text, dt.x, dt.y);
                    ctx.restore();
                }
            }
        }
    </script>
