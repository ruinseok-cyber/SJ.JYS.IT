<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>라이츄 배구 (Raichu Volleyball)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    h1 {
      margin-bottom: 10px;
      color: #ffb703;
      text-shadow: 2px 2px 4px #000;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      max-width: 100%;
    }
    canvas {
      background: linear-gradient(to bottom, #70d6ff 0%, #e8c547 75%, #d4a373 100%);
      display: block;
      border: 4px solid #fff;
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
    #menu-overlay {
      position: absolute;
      top: 0; left: 0; width: 800px; height: 500px;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      z-index: 10;
    }
    .btn {
      background-color: #fb8500;
      color: white;
      border: none;
      padding: 15px 32px;
      font-size: 20px;
      font-weight: bold;
      margin: 12px;
      cursor: pointer;
      border-radius: 30px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn:hover {
      background-color: #ffb703;
      color: #023047;
      transform: translateY(-2px);
    }
    .controls-info {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
      text-align: center;
      line-height: 1.6;
    }
    .serve-hint {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #ffb703;
      text-shadow: 1px 1px 2px #000;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1>⚡ 라이츄 배구 (Raichu Volleyball) ⚡</h1>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="menu-overlay">
      <h2 style="font-size: 36px; color: #ffb703; margin-bottom: 20px;">라이츄 배구</h2>
      <button class="btn" onclick="startGame()">게임 시작</button>

      <div class="controls-info">
        <p><b>[조작법]</b></p>
        <p>왼쪽 플레이어: W(점프/서브) A(왼쪽) S(스파이크/다운) D(오른쪽)</p>
        <p>오른쪽 플레이어: 방향키 UP(점프/서브) LEFT(왼쪽) DOWN(스파이크/다운) RIGHT(오른쪽)</p>
        <p style="margin-top:8px;">공이 서버 머리 위에 멈춰있을 때, 서버의 점프 키를 누르면 서브가 시작됩니다.</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menu-overlay');

    // 게임 설정
    const GRAVITY = 0.4;
    const NET_WIDTH = 12;
    const NET_HEIGHT = 160;
    const GROUND_Y = 440;
    const WINNING_SCORE = 15;

    let isGameRunning = false;
    let scoreLeft = 0;
    let scoreRight = 0;
    let keys = {};

    // 플레이어 클래스
    class Raichu {
      constructor(x, y, color, controls, bounds) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.radius = 28;
        this.vx = 0;
        this.vy = 0;
        this.speed = 6;
        this.jumpForce = -11;
        this.isGrounded = false;
        this.color = color;
        this.controls = controls; // {up, left, down, right}
        this.bounds = bounds;     // {minX, maxX}
        this.isSpiking = false;
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = false;
        this.isSpiking = false;
      }

      update() {
        // 이동 처리
        this.vx = 0;
        if (keys[this.controls.left]) this.vx = -this.speed;
        if (keys[this.controls.right]) this.vx = this.speed;

        // 점프 처리
        if (keys[this.controls.up] && this.isGrounded) {
          this.vy = this.jumpForce;
          this.isGrounded = false;
        }

        // 스파이크 / 강하 동작
        this.isSpiking = keys[this.controls.down] && !this.isGrounded;
        if (this.isSpiking) {
          this.vy += 0.8; // 빠르게 강하
        }

        // 중력 적용
        this.vy += GRAVITY;

        // 위치 업데이트
        this.x += this.vx;
        this.y += this.vy;

        // 바닥 충돌
        if (this.y + this.radius >= GROUND_Y) {
          this.y = GROUND_Y - this.radius;
          this.vy = 0;
          this.isGrounded = true;
        }

        // 영역 경계 제한 (네트 및 화면 밖)
        if (this.x - this.radius < this.bounds.minX) {
          this.x = this.bounds.minX + this.radius;
        }
        if (this.x + this.radius > this.bounds.maxX) {
          this.x = this.bounds.maxX - this.radius;
        }
      }

      draw() {
        // 라이츄 캐릭터 그리기 (원 기반의 심플 아트)
        ctx.save();
        ctx.translate(this.x, this.y);

        // 몸통 (주황색)
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.stroke();

        // 귀 (왼쪽, 오른쪽)
        ctx.beginPath();
        ctx.ellipse(-15, -25, 6, 16, -Math.PI / 6, 0, Math.PI * 2);
        ctx.ellipse(15, -25, 6, 16, Math.PI / 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffb703';
        ctx.fill();
        ctx.stroke();

        // 볼 (하얀색 볼터치)
        ctx.beginPath();
        ctx.arc(-12, 4, 6, 0, Math.PI * 2);
        ctx.arc(12, 4, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        // 눈
        ctx.beginPath();
        ctx.arc(-8, -5, 3, 0, Math.PI * 2);
        ctx.arc(8, -5, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();

        // 스파이크 중 이펙트
        if (this.isSpiking) {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 5, 0, Math.PI * 2);
          ctx.strokeStyle = '#ff0000';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // 공 클래스
    class Ball {
      constructor() {
        this.radius = 26;
        this.x = canvas.width / 2;
        this.y = 150;
        this.vx = 0;
        this.vy = 0;
        this.isHeld = false;   // 서브 대기 상태 여부
        this.heldBy = null;    // 대기 중인 서버(플레이어)
        this.servingTeam = 1;
      }

      // 서버 머리 위에 공을 고정시킨다 (서브 대기)
      holdAbove(player, team) {
        this.isHeld = true;
        this.heldBy = player;
        this.servingTeam = team;
        this.vx = 0;
        this.vy = 0;
        this.x = player.x;
        this.y = player.y - player.radius - this.radius - 15;
      }

      // 대기 중인 공을 서브로 발사한다
      serve() {
        this.isHeld = false;
        this.heldBy = null;
        this.vx = this.servingTeam === 1 ? 4 : -4;
        this.vy = -9;
      }

      update() {
        if (this.isHeld) {
          // 서버를 따라다니며 머리 위에 고정
          this.x = this.heldBy.x;
          this.y = this.heldBy.y - this.heldBy.radius - this.radius - 15;
          return;
        }

        this.vy += GRAVITY * 0.7; // 공 중력
        this.x += this.vx;
        this.y += this.vy;

        // 벽 반발력
        if (this.x - this.radius <= 0) {
          this.x = this.radius;
          this.vx *= -0.8;
        }
        if (this.x + this.radius >= canvas.width) {
          this.x = canvas.width - this.radius;
          this.vx *= -0.8;
        }

        // 천장 반발력
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.vy *= -0.8;
        }

        // 네트 충돌
        const netX = canvas.width / 2;
        const netTop = GROUND_Y - NET_HEIGHT;
        if (this.x + this.radius > netX - NET_WIDTH/2 &&
            this.x - this.radius < netX + NET_WIDTH/2 &&
            this.y + this.radius > netTop) {

          if (this.y < netTop) {
            // 네트 윗면에 상단 충돌
            this.y = netTop - this.radius;
            this.vy *= -0.8;
          } else {
            // 네트 옆면 충돌
            if (this.x < netX) this.x = netX - NET_WIDTH/2 - this.radius;
            else this.x = netX + NET_WIDTH/2 + this.radius;
            this.vx *= -0.8;
          }
        }
      }

      draw() {
        const r = this.radius;
        ctx.save();

        // 바닥 그림자 (입체감)
        ctx.beginPath();
        ctx.ellipse(this.x, GROUND_Y + 2, r * 0.9, r * 0.28, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fill();

        ctx.translate(this.x, this.y);

        // 전체 외곽 (검은 테두리)
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = '#1a1a1a';
        ctx.fill();

        // 윗부분 (빨강, 그라데이션으로 입체감)
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r - 2.5, Math.PI, 0);
        ctx.closePath();
        ctx.clip();
        const topGrad = ctx.createRadialGradient(-r * 0.35, -r * 0.5, r * 0.15, 0, 0, r * 1.3);
        topGrad.addColorStop(0, '#ff8fa3');
        topGrad.addColorStop(0.45, '#ff4d6d');
        topGrad.addColorStop(1, '#c9184a');
        ctx.fillStyle = topGrad;
        ctx.fillRect(-r, -r, r * 2, r * 2);
        ctx.restore();

        // 아랫부분 (하양, 은은한 그라데이션)
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r - 2.5, 0, Math.PI);
        ctx.closePath();
        ctx.clip();
        const botGrad = ctx.createRadialGradient(-r * 0.3, r * 0.2, r * 0.1, 0, 0, r * 1.3);
        botGrad.addColorStop(0, '#ffffff');
        botGrad.addColorStop(1, '#dfe3e8');
        ctx.fillStyle = botGrad;
        ctx.fillRect(-r, -r, r * 2, r * 2);
        ctx.restore();

        // 중앙 검은 띠
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-r, -r * 0.14, r * 2, r * 0.28);

        // 중앙 버튼 (입체감 있는 원)
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.34, 0, Math.PI * 2);
        ctx.fillStyle = '#1a1a1a';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
        const btnGrad = ctx.createRadialGradient(-r * 0.08, -r * 0.08, r * 0.02, 0, 0, r * 0.22);
        btnGrad.addColorStop(0, '#ffffff');
        btnGrad.addColorStop(1, '#c9d1d9');
        ctx.fillStyle = btnGrad;
        ctx.fill();
        ctx.lineWidth = Math.max(1.5, r * 0.05);
        ctx.strokeStyle = '#1a1a1a';
        ctx.stroke();

        // 하이라이트 (광택)
        ctx.beginPath();
        ctx.ellipse(-r * 0.35, -r * 0.45, r * 0.28, r * 0.16, -0.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fill();

        ctx.restore();

        // 서브 대기 중일 때 안내 문구
        if (this.isHeld) {
          ctx.save();
          ctx.fillStyle = '#ffb703';
          ctx.font = 'bold 14px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('점프 키로 서브!', this.x, this.y - this.radius - 10);
          ctx.restore();
        }
      }
    }

    // 객체 생성을 위한 컨트롤 정의
    const controlsLeft = { up: 'KeyW', left: 'KeyA', down: 'KeyS', right: 'KeyD' };
    const controlsRight = { up: 'ArrowUp', left: 'ArrowLeft', down: 'ArrowDown', right: 'ArrowRight' };

    let players = [];
    let ball = new Ball();
    let leftServer = null;
    let rightServer = null;

    // 키보드 이벤트 리스너
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function startGame() {
      scoreLeft = 0;
      scoreRight = 0;
      menuOverlay.style.display = 'none';
      isGameRunning = true;

      initPlayers();
      ball.holdAbove(leftServer, 1);
      requestAnimationFrame(gameLoop);
    }

    function initPlayers() {
      players = [];
      const leftBound = { minX: 0, maxX: canvas.width / 2 - NET_WIDTH / 2 };
      const rightBound = { minX: canvas.width / 2 + NET_WIDTH / 2, maxX: canvas.width };

      players.push(new Raichu(150, GROUND_Y - 30, '#f77f00', controlsLeft, leftBound));
      players.push(new Raichu(650, GROUND_Y - 30, '#d62828', controlsRight, rightBound));
      leftServer = players[0];
      rightServer = players[1];
    }

    // 플레이어와 공 충돌 처리
    function handleCollisions() {
      if (ball.isHeld) return; // 서브 대기 중에는 충돌 계산 생략

      players.forEach(p => {
        const dx = ball.x - p.x;
        const dy = ball.y - p.y;
        const dist = Math.hypot(dx, dy);

        if (dist < ball.radius + p.radius) {
          // 충돌 각도 계산
          const angle = Math.atan2(dy, dx);
          const speed = p.isSpiking ? 15 : 10; // 스파이크 시 강력한 속도

          ball.vx = Math.cos(angle) * speed + p.vx * 0.5;
          ball.vy = Math.sin(angle) * speed + (p.isSpiking ? 5 : -3);

          // 공이 너무 아래로 가는 것 방지
          if (ball.vy > 0 && !p.isSpiking) ball.vy *= -0.5;

          // 중첩 해제
          ball.x = p.x + Math.cos(angle) * (ball.radius + p.radius + 1);
          ball.y = p.y + Math.sin(angle) * (ball.radius + p.radius + 1);
        }
      });
    }

    // 서브 대기 중 서버가 점프 키를 누르면 발사
    function handleServeInput() {
      if (ball.isHeld && ball.heldBy && keys[ball.heldBy.controls.up]) {
        ball.serve();
      }
    }

    // 득점 및 리셋 체크
    function checkGoal() {
      if (ball.isHeld) return;

      if (ball.y + ball.radius >= GROUND_Y) {
        let servingTeam = 1;
        if (ball.x < canvas.width / 2) {
          // 오른쪽 팀 득점
          scoreRight++;
          servingTeam = 2;
        } else {
          // 왼쪽 팀 득점
          scoreLeft++;
          servingTeam = 1;
        }

        if (scoreLeft >= WINNING_SCORE || scoreRight >= WINNING_SCORE) {
          alert(`게임 종료! 승리: ${scoreLeft >= WINNING_SCORE ? '왼쪽 플레이어' : '오른쪽 플레이어'}`);
          isGameRunning = false;
          menuOverlay.style.display = 'flex';
          return;
        }

        // 세트 리셋 - 득점한 팀이 다음 서브를 갖는다
        players.forEach(p => p.reset());
        const nextServer = servingTeam === 1 ? leftServer : rightServer;
        ball.holdAbove(nextServer, servingTeam);
      }
    }

    // 메인 게임 루프
    function gameLoop() {
      if (!isGameRunning) return;

      // 1. 업데이트
      players.forEach(p => p.update());
      handleServeInput();
      ball.update();
      handleCollisions();
      checkGoal();

      // 2. 그리기
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 네트 그리기
      ctx.fillStyle = '#fff';
      ctx.fillRect(canvas.width / 2 - NET_WIDTH / 2, GROUND_Y - NET_HEIGHT, NET_WIDTH, NET_HEIGHT);

      // 바닥 그리기
      ctx.fillStyle = '#6b705c';
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // 게임 요소 그리기
      players.forEach(p => p.draw());
      ball.draw();

      // 점수판 그리기
      ctx.fillStyle = '#000';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${scoreLeft} : ${scoreRight}`, canvas.width / 2, 50);

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
